variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CI_REGISTRY_IMAGE: registry.haganah.net
  # TODO: This will need to change, or else different MRs will stomp on each other
  CI_REGISTRY_IMAGE_TAG: "$CI_REGISTRY_IMAGE/rust-ci:latest"
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_REF_PROTECTED == "true"'
default:
  cache:
    key: "$CI_COMMIT_REF_SLUG" # Use a unique key per branch for better isolation
    paths:
      - "$CARGO_HOME" # Cache the CARGO_HOME directory
      - "target/" # Cache the project's target directory
stages:
  - lint
  - build
  - test
  - deploy
lint:rust:
  stage: lint
  image: rustlang/rust:nightly
  script:
    - rustup component add rustfmt
    - cargo fmt
lint:nix:
  stage: lint
  image: nixos/nix
  script:
    - nix --extra-experimental-features "nix-command flakes" flake check
lint:mr-title:
  stage: lint
  image:
    name: commitlint/commitlint
    entrypoint:
      - ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "$CI_MERGE_REQUEST_TITLE" | commitlint
lint-done:
  stage: lint
  needs:
    - lint:rust
    - lint:nix
    - job: lint:mr-title
      optional: true
  script:
    - echo "done"
build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - docker
  script:
    # 1. Pull the existing image to use as a local cache layer source
    - docker pull $CI_REGISTRY_IMAGE_TAG || true
    # 2. Build using the pulled image as a cache reference
    - docker build -f containers/testenv.Dockerfile --cache-from "$CI_REGISTRY_IMAGE_TAG" -t "$CI_REGISTRY_IMAGE_TAG" .
    # 3. Push the newly evaluated/built image back to the registry
    - docker push "$CI_REGISTRY_IMAGE_TAG"
build:
  stage: build
  image: $CI_REGISTRY_IMAGE_TAG
  needs:
    - lint-done
    - build-image
  script:
    - cargo build --workspace
    - cargo clippy --workspace
test:run:rust:
  stage: test
  image: $CI_REGISTRY_IMAGE_TAG
  needs:
    - build
  # GitLab scrapes this regex against job stdout to populate the coverage badge.
  # The `cargo llvm-cov report` step below prints the TOTAL summary line it matches.
  coverage: '/(?i)total.*?(\d+(?:\.\d+)?%)/'
  script:
    # Cobertura file for the MR diff coverage annotations.
    - cargo llvm-cov nextest --profile ci --workspace --cobertura --output-path coverage.xml
    # Text summary to stdout so the `coverage:` regex above can extract the badge number.
    - cargo llvm-cov nextest --profile ci --workspace
  artifacts:
    reports:
      coverage_report:
        path: coverage.xml
        coverage_format: cobertura
test:run:python:
  stage: test
  image: $CI_REGISTRY_IMAGE_TAG
  needs:
    - build
  script:
    # The image's default user is `ci` (unprivileged); tshark won't load the Lua
    # dissector as root, so the suite must run non-root.
    - python3 -m pytest
test:run:
  stage: test
  needs:
    - test:run:rust
    - test:run:python
  script:
    - echo "Test Completed"
deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  tags:
    - docker
  needs:
    - test:run
  # Build the tap and tui images and push them to the registry. A tagged
  # commit is a release: the images are tagged with the git tag itself
  # (e.g. wayfinder-tap:v1.2.3). Any other commit is a dev build, tagged
  # dev-<short commit sha>. Registry auth follows the build-image job's
  # convention (the runner is pre-authenticated to $CI_REGISTRY_IMAGE).
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="dev-$CI_COMMIT_SHORT_SHA"
      fi
      echo "Building wayfinder-tap and wayfinder-tui images tagged '$IMAGE_TAG'"
      for app in tap tui; do
        image="$CI_REGISTRY_IMAGE/wayfinder-$app:$IMAGE_TAG"
        docker build -f containers/Dockerfile --target "$app" -t "$image" .
        docker push "$image"
      done
