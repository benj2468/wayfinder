include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
variables:
  AST_ENABLE_MR_PIPELINES: true
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  # Line tables only, not full debuginfo, for the dev and test profiles every
  # MR job compiles: most of a debug build's link time and target size is
  # debuginfo nobody reads in CI, while line tables keep panic backtraces
  # pointing at the right line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CI_REGISTRY_IMAGE: registry.haganah.net
  # CI_REGISTRY_IMAGE_TAG is NOT set here: it's a per-content tag computed by
  # the image-tag job below (see there for why), and every job that needs it
  # pulls it in via that job's dotenv artifact.
# A newer push to the same MR makes a running pipeline's result moot, and the
# runners share a host with GitLab itself, so a stale pipeline is not just
# slow — enough of them starve the server. `interruptible` lets GitLab cancel
# the superseded one (with "Auto-cancel redundant pipelines" on in the project
# settings). `deploy` and `mirror:github` opt back out: half a push is worse
# than a redundant one.
default:
  interruptible: true
# **An MR pipeline aims at under five minutes.** Nothing gates on a lint stage
# finishing first: every job starts at t=0, and a lint failure still fails the
# pipeline. Coverage and the full `nix flake check` run on `main` only (a
# `main` failure is fixed forward). The two longest jobs, `build:web` and
# `test:run:python`, run everywhere but skip themselves when their exact
# inputs already passed (`.skip-if-passed`).

# For a long job over one Cargo package: skip it when a run with exactly the
# same inputs already passed, on any branch. `scripts/ci-input-hash.py` hashes
# the package, every crate it reaches through path dependencies, the lockfile,
# this file and the CI image, plus the pathspecs in CI_INPUT_HASH_ARGS. So,
# unlike a `rules: changes:` list, it cannot miss a dependency.
#
# The marker lives in the runners' persistent /sccache volume. before_script
# and script share one shell, so the `exit 0` ends the job as passed; the
# marker is written in after_script only when the job really succeeded.
.skip-if-passed:
  before_script:
    - set -f # CI_INPUT_HASH_ARGS carries pathspecs like '*.py' for git, not the shell
    - CI_PASS_MARK="/sccache/ci-passed/$(echo "$CI_JOB_NAME" | tr ':' '_')/$(python3 scripts/ci-input-hash.py $CI_INPUT_HASH_ARGS)"
    - set +f
    - if [ -e "$CI_PASS_MARK" ]; then echo "Inputs unchanged since a passing run ($CI_PASS_MARK); skipping."; exit 0; fi
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = success ]; then
        set -f
        mark="/sccache/ci-passed/$(echo "$CI_JOB_NAME" | tr ':' '_')/$(python3 scripts/ci-input-hash.py $CI_INPUT_HASH_ARGS)"
        mkdir -p "$(dirname "$mark")" && touch "$mark"
      fi
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_REF_PROTECTED == "true"'
stages:
  - lint
  - build
  - test
  - deploy
# Base for jobs that compile the workspace in the rust-ci image we build
# (build-image). It wires in sccache for compilation caching: SCCACHE_DIR points
# at the persistent cache mounted on the docker runners, and RUSTC_WRAPPER routes
# all rustc invocations through it (replaces GitLab's branch cache).
.base-ci-docker:
  image: $CI_REGISTRY_IMAGE_TAG
  tags:
    - docker
  variables:
    SCCACHE_DIR: "/sccache"
    RUSTC_WRAPPER: "sccache"
# Computes the tag every other job resolves the rust-ci image by: a hash of
# containers/testenv.Dockerfile's own content, not a shared mutable "latest".
# Two branches editing the Dockerfile differently get two different tags, so
# neither can overwrite the other's published image; two branches that end up
# with byte-identical content (e.g. one merges the other) get the SAME tag,
# so build-image (below) can recognize "already published" and skip the
# rebuild entirely rather than redoing work. Exposed to dependent jobs via a
# dotenv artifact, since a job's `image:` can only be a variable, never a
# shell command.
image-tag:
  stage: lint
  image: alpine:latest
  tags:
    - docker
  needs: []
  script:
    - echo "CI_REGISTRY_IMAGE_TAG=$CI_REGISTRY_IMAGE/rust-ci:$(sha256sum containers/testenv.Dockerfile | cut -c1-16)" >> image.env
  artifacts:
    reports:
      dotenv: image.env
# The shared binary cache, https://cache.haganah.net (Attic, on rabin), for any
# job that runs Nix. Every such job pulls from it and pushes to it, MR pipelines
# included (ATTIC_TOKEN is deliberately not protected), so an MR's builds are
# reused by its own retries and later commits, and by other MRs. The cost: any
# branch pipeline can write paths that `main` and developer machines trust.
#
# What gets pushed is what the job *built*: scripts/ci-nix-record-built.sh is a
# `post-build-hook`, which fires for built paths and never for substituted ones,
# and after_script pushes the lot in one go. after_script runs on failure too,
# so a job that fails half an hour in still leaves its work in the cache.
#
# The cache's public key is the non-secret ATTIC_PUBLIC_KEY variable (from
# `attic cache info haganah:wayfinder`). Unset, the job builds exactly as it
# would with no cache. The runners mount the host CA bundle and point
# NIX_SSL_CERT_FILE at it, which is how Nix trusts the step-ca certificate.
.nix-cache:
  variables:
    ATTIC_SERVER: https://cache.haganah.net
    ATTIC_CACHE: wayfinder
    # The first push of a cold cache uploads a whole workspace closure;
    # after_script's 5-minute default would cut it off.
    RUNNER_AFTER_SCRIPT_TIMEOUT: 30m
  before_script:
    - |
      if [ -n "${ATTIC_PUBLIC_KEY:-}" ]; then
        export NIX_CONFIG="${NIX_CONFIG:-}
      extra-substituters = $ATTIC_SERVER/$ATTIC_CACHE
      extra-trusted-public-keys = $ATTIC_PUBLIC_KEY
      post-build-hook = $CI_PROJECT_DIR/scripts/ci-nix-record-built.sh"
      fi
  after_script:
    - |
      if [ -n "${ATTIC_TOKEN:-}" ] && [ -s /tmp/nix-built-paths ]; then
        nix --extra-experimental-features "nix-command flakes" profile install --inputs-from . nixpkgs#attic-client
        # attic verifies TLS through rustls' platform verifier, which reads
        # SSL_CERT_FILE, not NIX_SSL_CERT_FILE — without this it trusts only
        # the image's public CAs and rejects the step-ca certificate.
        export SSL_CERT_FILE="${NIX_SSL_CERT_FILE:-/etc/ssl/certs/ca-bundle.crt}"
        attic login haganah "$ATTIC_SERVER" "$ATTIC_TOKEN"
        attic push "haganah:$ATTIC_CACHE" --stdin </tmp/nix-built-paths || echo "cache push failed; not failing the job for it"
      fi
# Also the repo's formatting gate: `nix flake check` includes treefmt-nix's
# `treefmt` check, which runs rustfmt (nightly, with `rustfmt.toml`'s unstable
# options) alongside every other formatter. A separate `lint:rust` job used to
# run a bare `cargo fmt` — which rewrites instead of checking, so it could never
# fail — on a ~1.5 GB nightly image pulled every pipeline.
lint:nix:
  extends: .nix-cache
  stage: lint
  image: nixos/nix
  tags:
    - docker
  script:
    # An MR checks formatting only: building the `treefmt` check is the gate
    # that matters per change. `main` runs the full `flake check`, which also
    # evaluates every NixOS configuration and minutes of store downloads.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        nix --extra-experimental-features "nix-command flakes" flake check
      else
        nix --extra-experimental-features "nix-command flakes" build --no-link ".#checks.$(nix --extra-experimental-features nix-command eval --impure --raw --expr builtins.currentSystem).treefmt"
      fi
# The four NixOS integration tests (nix/tests/*.nix): the NixOS module's
# privilege derivation, the no-local-egress CA posture, ethernet egress, and
# mesh traffic over a real Tailscale tunnel. They are the repo's only
# end-to-end deployment tests.
#
# Built explicitly here rather than moved into the flake's `checks`: `lint:nix`
# on `main` runs the whole `flake check`, and folding four container boots into
# the formatting gate would make it the slowest job in the pipeline. They stay
# `packages`, so `nix build .#wayfinder-simple` still works by hand.
#
# They are systemd-nspawn container tests, not QEMU VMs, so the runner needs
# no /dev/kvm. What it does need is the derivation's `requiredSystemFeatures`
# (`kvm nixos-test uid-range`): `uid-range` means sandboxed builds with
# auto-allocated uids, which needs kernel namespaces — and the general `docker`
# runners cannot create any (verified on !209: Nix there builds unsandboxed and
# only the final test derivation fails). So this runs on the `privileged`
# runner. `kvm` is declared but not exercised by the nspawn backend.
#
# Automatic on `main`, where a failure is fixed forward. On an MR it is a
# manual button: each test boots containers on runners that share a host with
# GitLab itself, too heavy to gate every push on, and most MRs cannot reach
# the NixOS module at all.
test:nixos:
  extends: .nix-cache
  stage: test
  image: nixos/nix
  tags:
    - privileged
  needs: []
  parallel:
    matrix:
      - TEST: [simple, ethernet-egress, ca-provider, vpn-data-plane]
  variables:
    NIX_CONFIG: |
      experimental-features = nix-command flakes auto-allocate-uids cgroups
      sandbox = true
      # Nix silently builds unsandboxed when it cannot create the namespaces
      # a sandbox needs, and only the final test derivation (which requires
      # `uid-range`) then fails — 30 minutes in. Fail at the first build
      # instead, with the reason.
      sandbox-fallback = false
      auto-allocate-uids = true
      system-features = kvm nixos-test uid-range big-parallel benchmark
      # The node under test creates its TAP egress by opening /dev/net/tun,
      # and a build sandbox starts with a minimal /dev: without this the unit
      # fails `failed to create TAP device: No such file or directory`. The
      # NixOS hosts set the same (nixconf host/default.nix). No
      # `?` suffix: a runner without the device should fail here, at once.
      extra-sandbox-paths = /dev/net/tun
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - when: manual
      allow_failure: true
  script:
    - nix build --print-build-logs --no-link ".#wayfinder-$TEST"
lint:mr-title:
  stage: lint
  image:
    name: commitlint/commitlint
    entrypoint:
      - ""
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "$CI_MERGE_REQUEST_TITLE" | commitlint
secret_detection:
  stage: lint
  tags:
    - docker
  needs: []
build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - docker
  needs:
    - job: image-tag
      artifacts: true
  # This job always runs, but it's cheap: gating it on `rules: changes:
  # containers/testenv.Dockerfile` looks tempting (and was tried), but a git
  # diff touching that path is neither necessary nor sufficient for "the
  # tag's image needs building" — the image can be missing for reasons a
  # diff can't see (first pipeline under a new content hash, a registry GC,
  # someone deleting the tag), and skipping on that basis leaves every
  # downstream job unable to pull an image that was never built. The
  # `docker pull` below is the real, self-healing gate: it's the same
  # content-hash tag every other job resolves, so "already published" is a
  # cheap pull-and-exit, and only a genuinely new hash pays for a real build.
  script:
    # $CI_REGISTRY_IMAGE_TAG (from the image-tag job) is a hash of this exact
    # Dockerfile content. If it's already in the registry, some pipeline
    # (this branch or another) already built this exact content — nothing to
    # do, and nothing we'd push here could ever be a different image anyway.
    - |
      if docker pull "$CI_REGISTRY_IMAGE_TAG"; then
        echo "$CI_REGISTRY_IMAGE_TAG already published for this Dockerfile content; skipping rebuild."
        exit 0
      fi
    # Otherwise build fresh. $CACHE_IMAGE is a floating pointer used only as a
    # --cache-from layer-cache source (most Dockerfile edits are incremental,
    # e.g. one more `cargo binstall` line, so most base layers are unchanged)
    # — never resolved by any other job, so branches racing to update it can't
    # stomp on each other's actual build output, only on each other's cache hit rate.
    - CACHE_IMAGE="$CI_REGISTRY_IMAGE/rust-ci:cache"
    - docker pull "$CACHE_IMAGE" || true
    - docker build -f containers/testenv.Dockerfile --cache-from "$CACHE_IMAGE" -t "$CI_REGISTRY_IMAGE_TAG" -t "$CACHE_IMAGE" .
    - docker push "$CI_REGISTRY_IMAGE_TAG"
    - docker push "$CACHE_IMAGE"
build:
  extends: .base-ci-docker
  stage: build
  needs:
    - job: image-tag
      artifacts: true
    - job: build-image
      optional: true
  script:
    # clippy fully subsumes a plain `cargo build` (it still fails on any
    # compile error) and additionally covers tests/examples/benches via
    # --all-targets, while cargo's fingerprinting invalidates the target dir
    # between a plain build and a clippy build of the same crate (different
    # rustc flags), so running both back-to-back was a full duplicate compile
    # of the whole workspace for no extra signal.
    - cargo clippy --workspace --all-targets -- -D warnings
    - sccache --show-stats
# Cross-compiles the `no_std` embedded stack for a real bare-metal target
# instead of just relying on `#![no_std]` type-checking under the host's
# `std`-having target, which lets a stray `std`-only dependency (e.g. a
# workspace default feature) slip through unnoticed. `thumbv7em-none-eabihf`
# is Tier 2 with prebuilt `core`/`alloc`, so a plain `rustup target add` is
# enough — no nightly `-Z build-std`.
#
# `bins/wayfinder-nrf52840` is a real, flashable firmware binary (linker
# script, panic handler, entry point) whose dependency graph already covers
# interfaces/ieee802154/batman/wayfinder(-auth)/nrf-ieee802154 — building it
# once exercises all of those together as they'd actually ship, in place of
# building each crate separately. It's its own independent Cargo workspace
# (see the comment in its Cargo.toml), so it's built from its own directory
# rather than via `-p` from the root. `rylr998`/`at86rf233` aren't part of
# that binary's graph (they're generic drivers for external radios, not this
# board's on-board peripheral), so they're still checked directly as libs.
# Each board below is one `scripts/ci-cached.sh` step with its own input hash
# (the board's crate, every crate it reaches, its lockfile, `memory.x` and
# `.cargo/config.toml`), so an MR that touches no board's dependencies skips
# them all, and one that touches one board rebuilds that board alone. The
# same holds for build:stack-budget and test:alloc-gate.
build:embedded:
  extends: .base-ci-docker
  stage: build
  needs:
    - job: image-tag
      artifacts: true
    - job: build-image
      optional: true
  variables:
    # Kept in sync with the `rustup target add` in containers/testenv.Dockerfile.
    BARE_METAL_TARGET: thumbv7em-none-eabihf
  script:
    # Each board binary is its own independent Cargo workspace (linker script,
    # panic handler, HAL), so built from its own directory rather than via `-p`.
    # All target thumbv7em-none-eabihf (Cortex-M4F) but on different vendor HALs
    # (Nordic vs ST) — building all of them proves the shared driver is
    # portable, and building both nRF boards proves `libs/wayfinder-nrf` serves
    # both rather than having drifted onto one.
    #
    # Only clippy runs, not a preceding plain `cargo build`: clippy still fails
    # on any compile error, and pairing it with a plain build was a full
    # duplicate compile per board (cargo's fingerprinting invalidates the
    # target dir between a plain build and a clippy build of the same crate).
    - scripts/ci-cached.sh nrf52840 --package wayfinder-nrf52840 --manifest-path bins/wayfinder-nrf52840/Cargo.toml -- sh -c 'cd bins/wayfinder-nrf52840 && cargo clippy --locked -- -D warnings'
    - scripts/ci-cached.sh nrf52840-dongle --package wayfinder-nrf52840-dongle --manifest-path bins/wayfinder-nrf52840-dongle/Cargo.toml -- sh -c 'cd bins/wayfinder-nrf52840-dongle && cargo clippy --locked -- -D warnings'
    # Debug like the others: clippy never links, so the STM32F411RE's 512 KB
    # flash (which is why it is *flashed* --release) does not constrain a lint.
    # The linked release image is build:stack-budget's to check.
    - scripts/ci-cached.sh stm32f411 --package wayfinder-stm32f411 --manifest-path bins/wayfinder-stm32f411/Cargo.toml -- sh -c 'cd bins/wayfinder-stm32f411 && cargo clippy --locked -- -D warnings'
    # Both boards now wire 802.15.4, so the clippy runs above cover
    # `nrf-ieee802154`. What nothing links any more is `blue`'s SoftDevice
    # backend — 802.15.4 and BLE contend for the same RADIO, and the boards
    # took the radio. Cross-compiled explicitly so it cannot rot unnoticed.
    # Keep in step with `clippy-loose-drivers` in the justfile.
    - scripts/ci-cached.sh blue --package blue -- cargo clippy --locked -p blue --no-default-features --features hardware,softdevice-log --target "$BARE_METAL_TARGET" -- -D warnings
    - sccache --show-stats
# The static stack-budget gate for the board images.
#
# A separate job from `build:embedded` rather than a step in it, because the two
# need different artifacts: clippy never links, and this check reads the linked
# ELF. Adding `cargo build` alongside the clippy run would recompile each board
# from scratch (cargo's fingerprinting invalidates the target dir between the
# two), so it is a parallel job that pays for one real link per board instead of
# serialising a duplicate compile into an existing one.
#
# What it gates is narrow and deterministic, in the spirit of `test:alloc-gate`
# rather than the wall-clock benchmarks: no `TaskStorage::<F>::poll` frame may
# reserve more than a small share of the stack the linker actually left. That
# frame is live for the whole dynamic extent of its task's body, so a large one
# is stack no other frame can use — and it is exactly how the nRF52840 DK
# overflowed into the SoftDevice's reserved RAM in Sep 2026, an `#[task]`
# wrapper `.await`ing `node::run` and paying 62,720 bytes to copy its future
# through the stack. That was live on `main` for months: it is invisible to the
# host test suite (the types are nRF-only), invisible to clippy, and reproduces
# identically in `--release`, so only hardware or this check finds it.
#
# See `scripts/stack-budget.py` for why the gate is on task polls specifically
# and not on frame size in general — a blanket cap fails the *healthy* image.
build:stack-budget:
  extends: .base-ci-docker
  stage: build
  needs:
    - job: image-tag
      artifacts: true
    - job: build-image
      optional: true
  script:
    # `--release` for every board: that is the profile each one is flashed at
    # (`cargo run --release`), and a profile change here measures an image
    # nobody runs.
    #
    # The nRF boards used to be checked at `debug`, which was exactly that
    # mistake. The two profiles did not merely differ by a margin, they
    # disagreed about *which symbol carries the frame*: at `debug` rustc
    # emitted `node::run`'s body as its own symbol and left a 932-byte
    # trampoline for this gate to find, while at `--release` the body inlined
    # into the poll and carried 72,908 bytes -- **before the changes on this
    # branch**. The gate had passed for as long as it has existed on an image
    # nobody flashes.
    #
    # The nRF boards' 18% share is argued in the `justfile` next to
    # `stack-budget-nrf52840`; keep the two in step.
    - scripts/ci-cached.sh nrf52840 --package wayfinder-nrf52840 --manifest-path bins/wayfinder-nrf52840/Cargo.toml --extra scripts/stack-budget.py -- sh -c 'cd bins/wayfinder-nrf52840 && cargo build --release --locked && python3 ../../scripts/stack-budget.py target/thumbv7em-none-eabihf/release/wayfinder-nrf52840 --memory-x memory.x --task-poll-pct 18'
    - scripts/ci-cached.sh nrf52840-dongle --package wayfinder-nrf52840-dongle --manifest-path bins/wayfinder-nrf52840-dongle/Cargo.toml --extra scripts/stack-budget.py -- sh -c 'cd bins/wayfinder-nrf52840-dongle && cargo build --release --locked && python3 ../../scripts/stack-budget.py target/thumbv7em-none-eabihf/release/wayfinder-nrf52840-dongle --memory-x memory.x --task-poll-pct 18'
    - scripts/ci-cached.sh stm32f411 --package wayfinder-stm32f411 --manifest-path bins/wayfinder-stm32f411/Cargo.toml --extra scripts/stack-budget.py -- sh -c 'cd bins/wayfinder-stm32f411 && cargo build --release --locked && python3 ../../scripts/stack-budget.py target/thumbv7em-none-eabihf/release/wayfinder-stm32f411 --memory-x memory.x'
    - sccache --show-stats
# `bins/wayfinder-web` needs its own job for two reasons. Its `default` feature
# set is deliberately empty — so the `build` job's `cargo build --workspace`
# compiles a stub that proves nothing — and its tests sit behind `mock-node`, so
# the workspace nextest run never sees them either. Both halves are built here
# (the wasm one is where a misplaced `cfg` hides, since it drops every
# server-side dependency), then linted and tested against the canned node.
build:web:
  extends:
    - .base-ci-docker
    - .skip-if-passed
  stage: build
  # Sixteen minutes (release server and wasm builds plus a test build of one
  # large Leptos crate), so it skips whenever `wayfinder-web` and the 13
  # in-repo crates it depends on are unchanged since a passing run.
  variables:
    CI_INPUT_HASH_ARGS: --package wayfinder-web
  needs:
    - job: image-tag
      artifacts: true
    - job: build-image
      optional: true
  script:
    # The real cargo-leptos path, which also runs wasm-bindgen and emits the
    # site bundle the binary serves. Debug, not --release: the optimised server
    # and wasm builds were ten of this job's sixteen minutes, shared nothing
    # with the debug clippy/nextest runs below, and the release build is
    # already exercised on `main` by the Nix package the NixOS tests boot.
    - cargo leptos build
    - cargo clippy -p wayfinder-web --features mock-node --all-targets -- -D warnings
    - cargo nextest run -p wayfinder-web --features mock-node
    - sccache --show-stats
test:run:rust:
  extends: .base-ci-docker
  stage: test
  # Not after `build`: the test build shares nothing with clippy's, so waiting
  # for it only lengthens the pipeline.
  needs:
    - job: image-tag
      artifacts: true
    - job: build-image
      optional: true
  # GitLab scrapes this regex against job stdout to populate the coverage badge.
  # The `cargo llvm-cov report` step below prints the TOTAL summary line it matches.
  coverage: '/(?i)total.*?(\d+(?:\.\d+)?%)/'
  script:
    # Coverage on `main` only: instrumentation is a separate, slower build of
    # the whole workspace. An MR runs the same three suites uninstrumented.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then RUN="cargo llvm-cov nextest --no-report"; else RUN="cargo nextest run"; fi
      # The whole workspace.
      $RUN --profile ci --workspace
      # `wayfinder-server`'s `embedded` feature is off by default (it is the
      # `no_std` + `alloc` management transport a board links, and a host
      # build must not pull `embedded-io-async`/`embassy-sync`), so a plain
      # `--workspace` run compiles neither the module nor its tests. See #22.
      $RUN --profile ci -p wayfinder-server --features embedded
      # Every board builds SHA-512 rolled (`wayfinder-auth/compact-sha512`)
      # while the host builds it unrolled; re-run the auth suite, RFC 8032
      # known answers included, on the board's build. See #71.
      $RUN --profile ci -p wayfinder-auth --features compact-sha512
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        cargo llvm-cov report --cobertura --output-path coverage.xml
        # Text summary for the `coverage:` regex above.
        cargo llvm-cov report
      fi
    - sccache --show-stats
  # `when: always`, so the JUnit report still uploads when the suite is red —
  # the run whose failures GitLab most needs to show on the MR.
  artifacts:
    when: always
    reports:
      coverage_report:
        path: coverage.xml
        coverage_format: cobertura
      junit: target/nextest/ci/junit.xml
# The allocation gate from libs/wayfinder-bench: asserts that planning a
# received frame and planning a transmit both allocate exactly zero times.
#
# A separate job rather than a step inside test:run:rust, because a failure here
# means something very specific — the `no_std` routing core stopped being
# allocation-free, which breaks the boards and nothing else — and that is worth
# naming in the pipeline instead of surfacing as "the rust tests failed".
#
# This is the *only* benchmark-derived job that can fail. Allocation counts are
# deterministic, so they mean the same thing on a busy shared runner as on a
# laptop; the wall-clock benchmarks (`bench`, below) are not gated for exactly
# the opposite reason.
test:alloc-gate:
  extends: .base-ci-docker
  stage: test
  needs:
    - job: image-tag
      artifacts: true
    - job: build-image
      optional: true
  script:
    # `--profile dev`: an allocation count is the code's semantics, not its
    # optimisation, so the bench profile's release build buys this gate
    # nothing but compile time.
    - scripts/ci-cached.sh alloc --package wayfinder-bench -- cargo bench -p wayfinder-bench --features alloc-gate --bench alloc --profile dev
    - sccache --show-stats
# The wall-clock packet-path benchmarks.
#
# `when: manual` and `allow_failure: true` on purpose. A full criterion pass is
# minutes of runtime for numbers that nothing automatically compares, so making
# it part of every pipeline would spend that on every push; and timings from a
# shared runner are too noisy to gate on even if it did. Run it when you want
# the numbers — before and after a change to the routing hot path — and read
# the HTML report from the job's artifacts.
#
# For a local before/after comparison, `just bench-save <name>` and
# `just bench-cmp <a> <b>` are the better loop; this job exists so a pipeline
# run can produce a shareable report without anyone having the toolchain set up.
bench:
  extends: .base-ci-docker
  stage: test
  needs:
    - build
    - job: image-tag
      artifacts: true
  when: manual
  allow_failure: true
  script:
    - cargo bench -p wayfinder-bench
    - sccache --show-stats
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      # The browsable report, plus the raw estimates the report is built from —
      # the latter is what `critcmp` and any future trend tracking would read.
      - target/criterion/
test:run:python:
  extends:
    - .base-ci-docker
    - .skip-if-passed
  stage: test
  needs:
    - job: image-tag
      artifacts: true
    - job: build-image
      optional: true
  # Four minutes (a maturin build plus a ~3-minute suite), so it skips when
  # the `wayfinder-py` extension's crates and every Python-side input are
  # unchanged since a passing run.
  variables:
    CI_INPUT_HASH_ARGS: >-
      --package wayfinder-py --manifest-path libs/wayfinder-py/Cargo.toml --extra *.py --extra sim --extra ml --extra scripts --extra libs/wayfinder-shark --extra pyproject.toml --extra uv.lock
  script:
    # `uv sync` builds libs/wayfinder-py from source via maturin (a real cargo
    # invocation), so it's worth the same sccache reuse as the other cargo
    # jobs; extending .base-ci-docker wires that in instead of restating
    # image/tags here.
    # `uv sync` resolves+builds the whole Python side from the root
    # pyproject.toml/uv.lock, including `libs/wayfinder-py` (a uv workspace
    # member, built from source via its `maturin` build backend) — nothing
    # else builds/installs it, since `cargo build --workspace` deliberately
    # never touches that crate's own independent Cargo workspace.
    # The one cargo build CI keeps at release (maturin's default), besides the
    # stack-budget gate: the suite's simulations run inside this extension, so
    # a debug build made the job slower overall (3 → 8+ minutes on GitHub's
    # runners), not faster.
    - uv sync --locked
    # tshark won't load the Lua dissector as root, so drop to the unprivileged
    # `ci` user (baked into the image) for the suite. The cargo jobs still run as
    # root over the root-owned checkout; only this job needs to be non-root.
    # The JUnit report lands in a directory created for `ci` up front: the
    # checkout is root-owned, so the unprivileged user cannot create one itself.
    - install -d -o ci target/pytest
    # `uv run` (not a bare `python3 -m pytest`) so it resolves against the
    # `.venv` `uv sync` just built rather than the system interpreter.
    - runuser -u ci -- uv run pytest --junitxml=target/pytest/junit.xml
  # `when: always` because the report is worth most on a red pipeline — the
  # default (`on_success`) would upload it only for runs that had no failures
  # to show.
  artifacts:
    when: always
    reports:
      junit: target/pytest/junit.xml
test:run:
  stage: test
  tags:
    - docker
  needs:
    - test:run:rust
    - job: test:run:python
      optional: true
  script:
    - echo "Test Completed"
deploy:
  stage: deploy
  interruptible: false
  image: docker:latest
  services:
    - docker:dind
  tags:
    - docker
  needs:
    - test:run
  # By far the longest job (multi-platform buildx for 4 apps), so it doesn't
  # run on every MR commit — only automatically for a release tag or a merge
  # to main. It's still available as an on-demand manual button on an MR
  # pipeline (e.g. to sanity-check a dev image before merging); allow_failure
  # keeps an untriggered manual job from blocking the MR's pipeline status.
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - when: manual
      allow_failure: true
  # Build one image per runnable binary and push them to the registry, as
  # multi-platform (linux/amd64 + linux/arm64) images. A tagged commit is a
  # release: the images are tagged with the git tag itself (e.g.
  # wayfinder-tap:v1.2.3). Any other commit is a dev build, tagged
  # dev-<short commit sha>. A dev build of the default branch additionally gets
  # the moving `nightly` tag, so `wayfinder-tap:nightly` always resolves to the
  # newest image built from main. Registry auth follows the build-image job's
  # convention (the runner is pre-authenticated to $CI_REGISTRY_IMAGE).
  #
  # containers/Dockerfile cross-compiles natively for each target arch (see
  # its header comment) rather than relying on QEMU to emulate the whole
  # build, so no binfmt/qemu setup is needed here — just a buildx builder
  # capable of assembling and pushing a multi-platform manifest.
  script:
    # The buildx container driver runs its own BuildKit daemon, which does NOT
    # inherit the host Docker daemon's insecure-registries config. Since
    # registry.haganah.net is served insecurely, hand the builder a buildkitd
    # config that marks the registry insecure (plain HTTP + skip TLS verify),
    # otherwise the multi-platform --push below fails to reach it.
    - |
      cat > buildkitd.toml <<EOF
      [registry."registry.haganah.net"]
        insecure = true
      EOF
    - docker buildx create --use --name wayfinder-builder --driver-opt network=host --config buildkitd.toml
    - |
      EXTRA_TAG=""
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="dev-$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          EXTRA_TAG="nightly"
        fi
      fi
      # What the binaries inside report as their build, over `GetNodeInfo` and
      # from `--version`. Deliberately the same expression as the image tag: a
      # released image's reported version is then literally its tag, so "which
      # build is this node running?" and "which image is deployed here?" have the
      # same answer. The Dockerfile never copies `.git`, so passing these in is
      # the only way the binaries can know — and the commit separately, because a
      # tag carries no hash.
      BUILD_VERSION="$IMAGE_TAG"
      BUILD_COMMIT="$CI_COMMIT_SHORT_SHA"
      # A published image that cannot say what it is defeats the point of
      # publishing it identifiably. Empty here means the expression above broke,
      # which is a pipeline bug, not something to ship past.
      if [ -z "$BUILD_VERSION" ]; then
        echo "refusing to build an unlabelled image: BUILD_VERSION is empty" >&2
        exit 1
      fi
      echo "Building wayfinder-tap, wayfinder-tui, wayfinder-ctl, wayfinder-ctl-vpn and wayfinder-web images (linux/amd64, linux/arm64) tagged '$IMAGE_TAG'${EXTRA_TAG:+ and '$EXTRA_TAG'}"
      for app in tap tui ctl ctl-vpn web; do
        image="$CI_REGISTRY_IMAGE/wayfinder-$app:$IMAGE_TAG"
        # Both tags name the same manifest, so buildx builds once and pushes it
        # under each name — no second build for the nightly tag.
        extra_tag_arg=""
        if [ -n "$EXTRA_TAG" ]; then
          extra_tag_arg="--tag $CI_REGISTRY_IMAGE/wayfinder-$app:$EXTRA_TAG"
        fi
        docker buildx build \
          --builder wayfinder-builder \
          --platform linux/amd64,linux/arm64 \
          -f containers/Dockerfile \
          --target "$app" \
          --build-arg "WAYFINDER_BUILD_VERSION=$BUILD_VERSION" \
          --build-arg "WAYFINDER_BUILD_COMMIT=$BUILD_COMMIT" \
          -t "$image" \
          $extra_tag_arg \
          --push \
          .
      done
# Mirror the repository to GitHub on every merge to the default branch. We don't
# let GitLab check out a working tree (GIT_STRATEGY: none); instead we make a
# fresh `--mirror` clone of this project over HTTPS using the per-job
# CI_JOB_TOKEN, then push branches and tags to GitHub. The refspecs deliberately
# only mirror refs/heads/* and refs/tags/* (with --prune so deletions
# propagate), so GitLab-internal refs like refs/merge-requests/* are not pushed.
# Auth to GitHub uses a Personal Access Token (scope: repo / Contents:write)
# stored as the masked CI/CD variable GITHUB_MIRROR_TOKEN.
mirror:github:
  stage: deploy
  interruptible: false
  # alpine/git sets ENTRYPOINT ["git"], so the runner's `sh`-based setup script
  # would be invoked as `git sh ...` ("git: 'sh' is not a git command"). Clear
  # the entrypoint so the runner gets a real shell.
  image:
    name: alpine/git:latest
    entrypoint: [""]
  tags:
    - docker
  # Run independently of the build/test/deploy graph — mirroring just replicates
  # whatever landed on the default branch and shouldn't wait on image builds.
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
  variables:
    GIT_STRATEGY: none
    GIT_SSL_NO_VERIFY: false
  script:
    - git clone --mirror "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" repo.git
    - cd repo.git
    - git push --prune "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/benj2468/wayfinder.git" "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
