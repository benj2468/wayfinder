# Board inventory for the hardware-in-the-loop tests (`just hil`).
#
# Copy to `hil.toml` (gitignored) and fill in your own serial numbers. Without
# it every hardware test skips with a reason, which is the intended state of a
# machine with no boards attached — `just hil` is a clean no-op there.
#
# Point at a different file with WAYFINDER_HIL_CONFIG=/path/to/inventory.toml.
#
# Find the values:
#   probe-rs list                       # probe serial, for a DK
#   just hil-list                       # probes plus how this file resolves
#   udevadm info -q property -n /dev/ttyACM0 | grep ID_SERIAL_SHORT
#
# Roles, not device paths, are what tests ask for: which physical part plays a
# role lives only here, which is what lets the same tests run on a desk and on a
# self-hosted runner. `/dev/ttyACM*` numbering reorders between plugs and across
# a reset, so nothing addresses a board by it.

# The probed board most tests use. `kind = "nrf52840-dk"` requires a `probe`.
[[board]]
role  = "alpha"
kind  = "nrf52840-dk"
probe = "001050288335"
usb   = "F4CE3684A1B2"

# The dongle. No probe, so it cannot be flashed or reset from the host — but it
# is the part the full-ring GetLogs reset was reported on, so it earns a slot.
[[board]]
role = "dongle"
kind = "nrf52840-dongle"
usb  = "CD1F4A0099EE"

# A second probed board, for the tests that need two parts (the OGM/keep-alive
# interop and the fragmentation table). Tests asking for it skip while it is
# absent.
# [[board]]
# role  = "beta"
# kind  = "nrf52840-dk"
# probe = "001050288336"
# usb   = "F4CE3684A1B3"

# The NUCLEO-WL55JC (STM32WL55JC), whose LoRa radio is on the die.
#
# Note `probe` and `usb` are the *same* serial, which is correct here and not a
# copy-paste slip: this board's onboard STLINK-V3E presents the debug interface
# and the virtual COM port as interfaces of one USB device, so one serial names
# both. The nRF DK's entry above is the other arrangement -- there the J-Link's
# two CDC-ACM interfaces share a serial *with each other* and neither of them is
# the management port, which is a different device entirely. Read each board's
# own topology; neither is the rule.
# [[board]]
# role  = "wl55"
# kind  = "stm32wl55-nucleo"
# probe = "003900314142500E20353451"
# usb   = "003900314142500E20353451"

# A REYAX RYLR998 LoRa module, for the WL55 interop tests
# (`tests/reyax_interop.rs`). Not a board: no probe, no management API, our
# firmware does not run on it. `usb` is its USB-to-UART adapter's serial
# (`udevadm info -q property -n /dev/ttyUSB0 | grep ID_SERIAL_SHORT`) -- a
# CP2102 ships with `0001`, shared by every such adapter, so it identifies one
# only while it is the only one attached.
#
# `frequency_hz` is required and has no default: set the band that is
# licence-free where the rig is (902-928 MHz in the US, 863-870 MHz in the EU).
# The tests configure the module and *build the WL55's firmware* at this value.
# [[radio]]
# role         = "lora"
# kind         = "rylr998"
# usb          = "0001"
# frequency_hz = 915000000
