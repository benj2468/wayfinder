# The pipeline: lint, build, test and (on `main` and tags) deploy.
#
# **A PR's pipeline aims to be short.** Nothing waits on a lint stage finishing
# first: every job starts at once, and a lint failure still fails the run. The
# full `nix flake check`, coverage, the NixOS tests and the image deploy run on
# `main` only (a `main` failure is fixed forward). The long jobs skip
# themselves when their exact inputs already passed (`scripts/ci-cached.sh`).
#
# **Everything builds debug except what ships or what measures a shipped
# image.** A release build is minutes per job that shares nothing with the
# debug clippy and test builds beside it, and release is already covered on
# `main` by the Nix packages the NixOS tests boot and by `deploy`. The
# exceptions are argued at each one: `build-stack-budget` (it measures the
# flashed firmware), `test-python` (its simulations run inside the extension),
# `bench` and `deploy`.
#
# Shared machinery, each explained where it lives:
#
# - **Runners.** `runs-on` comes from the `CI_RUNNER` repository variable,
#   defaulting to GitHub's hosted `ubuntu-latest`, so moving the pipeline to a
#   self-hosted runner is one setting. If one is ever used on a public
#   repository, route fork PRs to hosted runners first: a fork's PR is
#   arbitrary code on that machine.
# - **The rust-ci image** (`containers/testenv.Dockerfile`), on ghcr.io under
#   a tag that is a hash of its content (the `image` job).
# - **sccache** keeps compiler outputs in an R2 bucket every branch shares,
#   falling back to the Actions cache for a run with no secrets
#   (`.github/actions/sccache`).
# - **Pass markers** (`scripts/ci-cached.sh`) live in an `actions/cache` entry
#   per job. A marker lost to eviction or a race between branches only means a
#   step runs again; a marker is only ever written after its step passed.
# - **Nix** substitutes from, and pushes to, an R2 binary cache
#   (`.github/actions/nix`, `.github/actions/nix-cache-push`).
#
# The R2 buckets, their tokens and the Nix cache's signing key are managed
# outside this repository; the variables and secrets named below are what
# they hand to it.
name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Build and push the multi-arch images for this ref
        type: boolean
        default: false
      bench:
        description: Run the wall-clock benchmarks and upload the report
        type: boolean
        default: false
      nixos:
        description: Run the NixOS integration tests (nix/tests)
        type: boolean
        default: false
# A newer push to the same PR makes a running pipeline moot, so a PR's runs
# share a group and the older is cancelled. Everything else — `main`, tags, a
# dispatch — gets a group of its own (the run id) and never waits on another
# run: a shared never-cancelling group would queue each merge's run behind the
# whole of the previous one, and GitHub keeps only one pending run per group,
# so a third merge in that window would silently displace the second's run.
# What must not overlap is only `deploy`, which has its own job-level group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# `packages: read` is what lets a container job pull the rust-ci image from
# ghcr with the job's own token; without it every pull is `denied`, even
# though the `image` job (which asks for `packages: write`) pushed it fine.
permissions:
  contents: read
  packages: read
env:
  # Line tables only, not full debuginfo, for the dev and test profiles every
  # PR job compiles: most of a debug build's link time and target size is
  # debuginfo nobody reads in CI, while line tables keep panic backtraces
  # pointing at the right line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # sccache cannot cache incrementally-compiled crates, and a fresh runner has
  # no incremental state to reuse anyway.
  CARGO_INCREMENTAL: "0"
  # Which store it uses is `.github/actions/sccache`'s choice, per job.
  RUSTC_WRAPPER: sccache
jobs:
  # The tag every container job resolves the rust-ci image by: a hash of
  # containers/testenv.Dockerfile's own content, not a shared mutable
  # "latest". Two branches editing the Dockerfile differently get two tags, so
  # neither can overwrite the other's image; two that end up byte-identical
  # get the same tag and the second skips the build.
  #
  # The job always runs rather than being gated on the Dockerfile changing: a
  # diff is neither necessary nor sufficient for "this tag needs building"
  # (the image can be missing for reasons a diff cannot see — a new hash's
  # first run, a registry cleanup), and a skipped build would leave every
  # downstream job pulling an image that was never pushed. The manifest check
  # is the real, self-healing gate. `rust-ci:cache` is a floating pointer used
  # only as a `--cache-from` source, never resolved by a job, so branches
  # racing to update it only race for each other's cache hit rate.
  image:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$repo/rust-ci:$(sha256sum containers/testenv.Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push unless already published
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CACHE_IMAGE: ${{ steps.tag.outputs.repo }}/rust-ci:cache
        run: |
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published for this Dockerfile content; skipping rebuild."
            exit 0
          fi
          docker pull "$CACHE_IMAGE" || true
          docker build -f containers/testenv.Dockerfile --cache-from "$CACHE_IMAGE" -t "$TAG" -t "$CACHE_IMAGE" .
          docker push "$TAG"
          docker push "$CACHE_IMAGE"
  # Also the repository's formatting gate: `nix flake check` includes
  # treefmt-nix's `treefmt` check, which runs rustfmt (nightly, with
  # `rustfmt.toml`'s unstable options) alongside every other formatter. A PR
  # builds only that check; `main` runs the full `flake check`, which also
  # evaluates every NixOS configuration.
  lint-nix:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
        with:
          cache-url: ${{ vars.NIX_CACHE_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            nix flake check
          else
            nix build --no-link ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).treefmt"
          fi
      - uses: ./.github/actions/nix-cache-push
        if: always()
        with:
          cache-url: ${{ vars.NIX_CACHE_URL }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # The PR title becomes the squash-merge commit, so it is the one that must
  # follow Conventional Commits (commitlint.config.ts), not each commit.
  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      # The title goes through the environment, never interpolated into the
      # script: it is attacker-controlled text on a PR.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | docker run -i --rm -v "$PWD:/app" -w /app commitlint/commitlint
  # Every commit reachable from this ref, not only the tree: in a public
  # repository, a secret anywhere in history is published. `.gitleaks.toml`
  # holds the allowlist for known non-secrets.
  secret-scan:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # As the runner user, so git does not refuse a checkout it does not own.
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git --no-banner --redact --exit-code 1 .
  # clippy fully subsumes a plain `cargo build` (it still fails on any compile
  # error) and also covers tests/examples/benches through --all-targets.
  # Running both was a full duplicate compile of the workspace for no extra
  # signal: cargo's fingerprinting invalidates the target dir between a plain
  # build and a clippy build of the same crate.
  build:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: sccache --show-stats
  # Cross-compiles the `no_std` stack for a real bare-metal target instead of
  # relying on `#![no_std]` type-checking under the host's target, which lets
  # a stray `std`-only dependency (a workspace default feature, say) slip
  # through. `thumbv7em-none-eabihf` is Tier 2 with prebuilt `core`/`alloc`,
  # so no nightly `-Z build-std`.
  #
  # Each board is its own Cargo workspace (linker script, panic handler, HAL),
  # so it is linted from its own directory rather than through `-p`. They share
  # a target but not a vendor HAL (Nordic vs ST): linting all of them proves
  # the shared driver is portable, and both nRF boards proves
  # `libs/wayfinder-nrf` serves both. `blue`'s SoftDevice backend is linted
  # explicitly because no board links it any more (802.15.4 took the RADIO);
  # keep that line in step with `clippy-loose-drivers` in the justfile.
  #
  # Only clippy, never clippy plus a plain build (see `build`), and debug
  # throughout: clippy never links, so the STM32F411RE's 512 KB flash — the
  # reason it is *flashed* `--release` — does not constrain a lint. The linked
  # release images are `build-stack-budget`'s to check. Each board is one
  # `ci-cached.sh` step with its own input hash, so a PR that touches one
  # board's dependencies rebuilds that board alone.
  build-embedded:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # Kept in step with the `rustup target add` in containers/testenv.Dockerfile.
      BARE_METAL_TARGET: thumbv7em-none-eabihf
      CI_JOB_NAME: build-embedded
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-passed-${{ github.job }}-
      - run: echo "CI_PASS_DIR=$PWD/.ci-passed" >> "$GITHUB_ENV"
      - run: scripts/ci-cached.sh nrf52840 --package wayfinder-nrf52840 --manifest-path bins/wayfinder-nrf52840/Cargo.toml -- sh -c 'cd bins/wayfinder-nrf52840 && cargo clippy --locked -- -D warnings'
      - run: scripts/ci-cached.sh nrf52840-dongle --package wayfinder-nrf52840-dongle --manifest-path bins/wayfinder-nrf52840-dongle/Cargo.toml -- sh -c 'cd bins/wayfinder-nrf52840-dongle && cargo clippy --locked -- -D warnings'
      - run: scripts/ci-cached.sh stm32f411 --package wayfinder-stm32f411 --manifest-path bins/wayfinder-stm32f411/Cargo.toml -- sh -c 'cd bins/wayfinder-stm32f411 && cargo clippy --locked -- -D warnings'
      # The NUCLEO-WL55JC's Cortex-M4 has no FPU, so it builds for
      # `thumbv7em-none-eabi` (its own `.cargo/config.toml` selects it), not
      # `$BARE_METAL_TARGET`. It is the only board whose radio is on the die, so
      # this is what proves `libs/lora-link` and the `lora-phy` glue still
      # compile for a real target.
      - run: scripts/ci-cached.sh wl55jc --package wayfinder-wl55jc --manifest-path bins/wayfinder-wl55jc/Cargo.toml -- sh -c 'cd bins/wayfinder-wl55jc && cargo clippy --locked -- -D warnings'
      - run: scripts/ci-cached.sh blue --package blue -- cargo clippy --locked -p blue --no-default-features --features hardware,softdevice-log --target "$BARE_METAL_TARGET" -- -D warnings
      - run: sccache --show-stats
      - uses: actions/cache/save@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  # The static stack-budget gate for the board images: no
  # `TaskStorage::<F>::poll` frame may reserve more than a small share of the
  # stack the linker actually left. That frame is live for its task's whole
  # body, so a large one is stack no other frame can use — which is how the
  # nRF52840 DK overflowed into the SoftDevice's reserved RAM in Sep 2026: an
  # `#[task]` wrapper `.await`ing `node::run` paid 62,720 bytes to copy its
  # future through the stack. It was live on `main` for months, invisible to
  # the host suite (the types are nRF-only) and to clippy.
  #
  # **`--release`, and it must stay so.** That is the profile each board is
  # flashed at, and no Nix build covers the firmware. The boards used to be
  # checked at `debug`, and the two profiles did not merely differ by a margin
  # but disagreed about *which symbol carries the frame*: at `debug` rustc
  # emitted `node::run`'s body as its own symbol and left a 932-byte
  # trampoline for the gate to find, while at `--release` the body inlined
  # into the poll and carried 72,908 bytes. The gate had passed, for as long
  # as it had existed, on an image nobody flashes.
  #
  # A separate job from `build-embedded` because it needs the linked ELF, which
  # clippy never produces. See `scripts/stack-budget.py` for why the gate is on
  # task polls and not frame size in general (a blanket cap fails the healthy
  # image).
  build-stack-budget:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI_JOB_NAME: build-stack-budget
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-passed-${{ github.job }}-
      - run: echo "CI_PASS_DIR=$PWD/.ci-passed" >> "$GITHUB_ENV"
      # The nRF boards' 18% share is argued in the `justfile` next to
      # `stack-budget-nrf52840`; keep the two in step.
      - run: scripts/ci-cached.sh nrf52840 --package wayfinder-nrf52840 --manifest-path bins/wayfinder-nrf52840/Cargo.toml --extra scripts/stack-budget.py -- sh -c 'cd bins/wayfinder-nrf52840 && cargo build --release --locked && python3 ../../scripts/stack-budget.py target/thumbv7em-none-eabihf/release/wayfinder-nrf52840 --memory-x memory.x --chip nrf52840 --task-poll-pct 18'
      - run: scripts/ci-cached.sh nrf52840-dongle --package wayfinder-nrf52840-dongle --manifest-path bins/wayfinder-nrf52840-dongle/Cargo.toml --extra scripts/stack-budget.py -- sh -c 'cd bins/wayfinder-nrf52840-dongle && cargo build --release --locked && python3 ../../scripts/stack-budget.py target/thumbv7em-none-eabihf/release/wayfinder-nrf52840-dongle --memory-x memory.x --chip nrf52840 --task-poll-pct 18'
      - run: scripts/ci-cached.sh stm32f411 --package wayfinder-stm32f411 --manifest-path bins/wayfinder-stm32f411/Cargo.toml --extra scripts/stack-budget.py -- sh -c 'cd bins/wayfinder-stm32f411 && cargo build --release --locked && python3 ../../scripts/stack-budget.py target/thumbv7em-none-eabihf/release/wayfinder-stm32f411 --memory-x memory.x --chip stm32f411re'
      # `--task-poll-pct 12`: see the `stack-budget-wl55jc` justfile recipe.
      - run: scripts/ci-cached.sh wl55jc --package wayfinder-wl55jc --manifest-path bins/wayfinder-wl55jc/Cargo.toml --extra scripts/stack-budget.py -- sh -c 'cd bins/wayfinder-wl55jc && cargo build --release --locked && python3 ../../scripts/stack-budget.py target/thumbv7em-none-eabi/release/wayfinder-wl55jc --memory-x memory.x --chip stm32wl55jc --task-poll-pct 12'
      - run: sccache --show-stats
      - uses: actions/cache/save@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  # `bins/wayfinder-web` needs its own job: its `default` feature set is empty
  # on purpose (so `build`'s workspace clippy compiles a stub that proves
  # nothing), and its tests sit behind `mock-node`, so the workspace test run
  # never sees them. `cargo leptos build` is the real path — both halves,
  # wasm-bindgen and the site bundle — where a misplaced `cfg` hides, since the
  # wasm half drops every server-side dependency.
  #
  # Debug, not `--release`: the optimised server and wasm builds were ten of
  # this job's sixteen minutes and shared nothing with the debug clippy/nextest
  # builds after them. The job was also the pipeline's most expensive by a
  # distance (4,500 runner-minutes in a month on the previous forge), so it
  # skips whenever wayfinder-web and every crate it reaches are unchanged since
  # a passing run.
  build-web:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI_JOB_NAME: build-web
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-passed-${{ github.job }}-
      - run: echo "CI_PASS_DIR=$PWD/.ci-passed" >> "$GITHUB_ENV"
      - run: >-
          scripts/ci-cached.sh web --package wayfinder-web -- sh -c 'cargo leptos build && cargo clippy -p wayfinder-web --features mock-node --all-targets -- -D warnings && cargo nextest run -p wayfinder-web --features mock-node'
      - run: sccache --show-stats
      - uses: actions/cache/save@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  # Three suites. The workspace; `wayfinder-server`'s `embedded` feature, off
  # by default because a host build must not pull `embedded-io-async`/
  # `embassy-sync`, so `--workspace` compiles neither the module nor its tests
  # (#24); and `wayfinder-auth` with `compact-sha512`, since every board builds
  # SHA-512 rolled while the host builds it unrolled, so the RFC 8032 known
  # answers are re-run on the board's build (#73).
  #
  # Coverage on `main` only: instrumentation is a separate, slower build of the
  # whole workspace. The reports upload even from a red run — that is the run
  # whose failures most need reading.
  test-rust:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then RUN="cargo llvm-cov nextest --no-report"; else RUN="cargo nextest run"; fi
          $RUN --profile ci --workspace
          $RUN --profile ci -p wayfinder-server --features embedded
          $RUN --profile ci -p wayfinder-auth --features compact-sha512
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cargo llvm-cov report --cobertura --output-path coverage.xml
            cargo llvm-cov report
          fi
      - run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-rust-reports
          path: |
            target/nextest/ci/junit.xml
            coverage.xml
          if-no-files-found: ignore
  # The allocation gate from libs/wayfinder-bench: planning a received frame
  # and planning a transmit must allocate exactly zero times. Its own job
  # because a failure here means something specific — the `no_std` core
  # stopped being allocation-free, which breaks the boards and nothing else.
  #
  # The only benchmark-derived job that can fail: an allocation count is
  # deterministic, so it means the same on a busy runner as on a laptop. And
  # `--profile dev` rather than the bench profile's release build, because the
  # count is the code's semantics, not its optimisation.
  test-alloc-gate:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI_JOB_NAME: test-alloc-gate
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-passed-${{ github.job }}-
      - run: echo "CI_PASS_DIR=$PWD/.ci-passed" >> "$GITHUB_ENV"
      - run: scripts/ci-cached.sh alloc --package wayfinder-bench -- cargo bench -p wayfinder-bench --features alloc-gate --bench alloc --profile dev
      - run: sccache --show-stats
      - uses: actions/cache/save@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  # The Python side: `uv sync` resolves and builds everything from the root
  # pyproject.toml/uv.lock, including `libs/wayfinder-py` (a uv workspace
  # member built from source by maturin) — nothing else builds it, since that
  # crate is its own Cargo workspace. `uv run`, not a bare `python3 -m pytest`,
  # so the suite resolves against the `.venv` that sync built.
  #
  # tshark will not load the Lua dissector as root, so the suite runs as the
  # image's unprivileged `ci` user, with its JUnit directory created for it up
  # front (the checkout is root-owned).
  #
  # The one cargo build here left at release (maturin's default), besides the
  # stack-budget gate: the suite's simulations run inside the extension, so a
  # debug build made the job slower overall (3 minutes to 8+), not faster.
  test-python:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI_JOB_NAME: test-python
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-passed-${{ github.job }}-
      - run: echo "CI_PASS_DIR=$PWD/.ci-passed" >> "$GITHUB_ENV"
      - run: >-
          scripts/ci-cached.sh python --package wayfinder-py --manifest-path libs/wayfinder-py/Cargo.toml --extra '*.py' --extra sim --extra ml --extra scripts --extra libs/wayfinder-shark --extra pyproject.toml --extra uv.lock -- sh -c 'uv sync --locked && install -d -o ci target/pytest && runuser -u ci -- uv run pytest --junitxml=target/pytest/junit.xml'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-python-reports
          path: target/pytest/junit.xml
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        with:
          path: .ci-passed
          key: ci-passed-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  # Everything the NixOS tests need except running them, built once. Each
  # test's `.driver` holds its machines' full system closures — the wayfinder
  # packages included — so building all four drivers here, in one job, builds
  # every package they share exactly once and pushes it to the R2 cache. The
  # test jobs below then substitute their driver instead of each compiling the
  # same workspace in parallel (about 30 minutes each, before this job).
  build-nixos-tests:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.nixos)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
        with:
          cache-url: ${{ vars.NIX_CACHE_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - run: >-
          nix build --print-build-logs --no-link .#wayfinder-simple.driver .#wayfinder-ethernet-egress.driver .#wayfinder-ca-provider.driver .#wayfinder-vpn-data-plane.driver
      # Not `if: always()` as elsewhere: the tests only start once this job
      # passes, so its push is what they substitute from.
      - uses: ./.github/actions/nix-cache-push
        with:
          cache-url: ${{ vars.NIX_CACHE_URL }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # The NixOS integration tests (nix/tests), on `main` or on demand. They are
  # systemd-nspawn container tests, not QEMU VMs: no /dev/kvm is used, but the
  # test derivation requires `kvm nixos-test uid-range`, and `uid-range` needs a
  # real build sandbox — which a hosted runner, being a full VM, can give where
  # a docker-executor runner cannot (no namespaces inside its job container).
  #
  # The settings, each for a reason:
  # - `sandbox-fallback = false` (in `.github/actions/nix`): Nix otherwise
  #   builds unsandboxed when it cannot create the namespaces, and only the
  #   final test derivation (which needs `uid-range`) fails — half an hour in.
  # - `auto-allocate-uids` and `cgroups`: what `uid-range` is built on.
  # - `extra-sandbox-paths = /dev/net/tun`: the node under test opens it for
  #   its TAP egress, and a build sandbox starts with a minimal /dev. No `?`
  #   suffix, so a runner without the device fails here, at once.
  test-nixos:
    needs: build-nixos-tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.nixos)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        test: [simple, ethernet-egress, ca-provider, vpn-data-plane]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
        with:
          cache-url: ${{ vars.NIX_CACHE_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          extra-config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            sandbox = true
            auto-allocate-uids = true
            system-features = kvm nixos-test uid-range big-parallel benchmark
            extra-sandbox-paths = /dev/net/tun
      - run: nix build --print-build-logs --no-link ".#wayfinder-${{ matrix.test }}"
      - uses: ./.github/actions/nix-cache-push
        if: always()
        with:
          cache-url: ${{ vars.NIX_CACHE_URL }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # The wall-clock packet-path benchmarks, on demand only (the `bench` input).
  # A full criterion pass is minutes for numbers nothing compares
  # automatically, and timings from a shared runner are too noisy to gate on
  # (see CLAUDE.md). This exists so a run can produce a shareable report —
  # the `criterion` artifact — without anyone setting up the toolchain; for a
  # before/after comparison, `just bench-save`/`just bench-cmp` locally is the
  # better loop.
  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.bench
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - run: cargo bench -p wayfinder-bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion
          path: target/criterion/
          retention-days: 30
  # The one check to mark required in branch protection: it fails if any job
  # it depends on failed or was cancelled, and passes over skipped ones (a PR
  # skips nothing here, but `lint-pr-title` is skipped off a PR).
  ci-ok:
    if: always()
    needs:
      - lint-nix
      - lint-pr-title
      - secret-scan
      - build
      - build-embedded
      - build-stack-budget
      - build-web
      - test-rust
      - test-alloc-gate
      - test-python
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all required jobs passed"
  # One multi-platform (linux/amd64 + linux/arm64) image per runnable binary,
  # to ghcr.io: automatically for a release tag or a push to `main`, on demand
  # elsewhere (the `deploy` input). A tag is a release and its images carry
  # the git tag (`wayfinder-tap:v1.2.3`); any other commit is a dev build,
  # `dev-<short sha>`, and `main`'s also gets the moving `nightly` tag. Both
  # tags name one manifest, so the nightly tag costs no second build.
  #
  # The binaries report their build (over `GetNodeInfo` and `--version`) as
  # exactly the image tag, so "which build is this node running?" and "which
  # image is deployed here?" have one answer. The Dockerfile never copies
  # `.git`, so passing them in is the only way the binaries can know, and the
  # commit separately because a tag carries no hash. An empty version means
  # this script broke, and is refused rather than shipped.
  #
  # containers/Dockerfile cross-compiles natively for each target arch rather
  # than emulating the build under QEMU, so no binfmt setup is needed. Its
  # cargo builds run through sccache against the same R2 bucket as the jobs
  # above when handed the `sccache` build secret (containers/with-sccache.sh);
  # a secret, not a build arg, so the credentials are in no image layer.
  deploy:
    if: >-
      startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: [test-rust, test-python]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Write the sccache build secret
        env:
          BUCKET: ${{ vars.SCCACHE_BUCKET }}
          ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
          KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
        run: |
          secret="$RUNNER_TEMP/sccache.env"
          : > "$secret"
          chmod 600 "$secret"
          if [ -n "$BUCKET" ] && [ -n "$KEY_ID" ]; then
            {
              echo "SCCACHE_BUCKET=$BUCKET"
              echo "SCCACHE_ENDPOINT=$ENDPOINT"
              echo "SCCACHE_REGION=auto"
              echo "AWS_ACCESS_KEY_ID=$KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$SECRET"
            } >> "$secret"
          fi
          echo "SCCACHE_SECRET_FILE=$secret" >> "$GITHUB_ENV"
      - run: |
          registry=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          short_sha=$(git rev-parse --short HEAD)
          EXTRA_TAG=""
          if [ "${{ github.ref_type }}" = tag ]; then
            IMAGE_TAG="${{ github.ref_name }}"
          else
            IMAGE_TAG="dev-$short_sha"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              EXTRA_TAG="nightly"
            fi
          fi
          if [ -z "$IMAGE_TAG" ]; then
            echo "refusing to build an unlabelled image: IMAGE_TAG is empty" >&2
            exit 1
          fi
          for app in tap tui ctl ctl-vpn web; do
            image="$registry/wayfinder-$app:$IMAGE_TAG"
            extra_tag_arg=""
            if [ -n "$EXTRA_TAG" ]; then
              extra_tag_arg="--tag $registry/wayfinder-$app:$EXTRA_TAG"
            fi
            # shellcheck disable=SC2086 # $extra_tag_arg is zero or two words
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f containers/Dockerfile \
              --target "$app" \
              --secret "id=sccache,src=$SCCACHE_SECRET_FILE" \
              --build-arg "WAYFINDER_BUILD_VERSION=$IMAGE_TAG" \
              --build-arg "WAYFINDER_BUILD_COMMIT=$short_sha" \
              -t "$image" \
              $extra_tag_arg \
              --push \
              .
          done
      - if: always()
        run: rm -f "$SCCACHE_SECRET_FILE"
