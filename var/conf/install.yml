local_egress:
  type: Tap
  device_name: wayfinder0
  ip_address: 10.0.0.1
  netmask: 255.255.255.0
  mac_state_path: ./var/conf/wayfinder0.state
server:
  # Authenticated, encrypted management API. Clients authenticate by their mesh
  # membership identity (RFC 7250 raw public key in the TLS handshake); only a
  # non-revoked admin — or, before enrollment, a client proving the node's own
  # key — is admitted. The node's TLS identity reuses the `[auth]` seed when
  # configured, else a persistent seed generated on first boot.
  type: Tls
  addr: 0.0.0.0:7700
links:
  - type: Ble
    advertise_dwell_ms: 250
  - type: RawL2
    interface: tailscale0
    # Wire EtherType for this mesh's frames — a free-choice transport label the
    # AF_PACKET socket binds/filters on. Decoupled from the router's mesh
    # protocol (carried inside the frame), so any value works; pick one that
    # isolates this mesh from other L2 traffic on the segment.
    ethertype: 0xfafa
