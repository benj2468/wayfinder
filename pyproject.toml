# Python tooling for the repo: the integration/component test suite plus the
# dev-tool versions `uv sync` installs at the root.
#
# The tests are black-box tests that drive real built artifacts (e.g. the
# Wayfinder Wireshark Lua dissector via tshark, or the libs/wayfinder-py PyO3
# extension module), complementing the per-crate Rust unit tests. Each
# component keeps its tests next to its code in `libs/<crate>/tests/`; pytest
# discovers them automatically from the `libs` tree.
#
# `uv sync` from the repo root builds/installs everything (the dev shell
# provides `uv`; CI installs it too — see containers/testenv.Dockerfile),
# including `wayfinder-py` itself (built from source via its `maturin` build
# backend), `wayfinder-sim` and `wayfinder-ml`. All three are uv workspace
# members. Then run tests with `uv run pytest`.
[project]
name = "wayfinder-dev"
version = "0.0.0"
requires-python = ">=3.10"
# `wayfinder-sim` is a direct dependency and not merely `wayfinder-ml`'s, so
# that `sim/scenarios/*.py` — plain scripts, not part of any package — can
# `import wayfinder_sim` out of the synced environment.
dependencies = ["wayfinder-py", "wayfinder-sim", "wayfinder-ml"]

[dependency-groups]
dev = ["pytest", "ruff", "basedpyright", "ty", "uv"]
# Charting for the scenarios under sim/scenarios/ (see sim/README.sim.md) —
# kept out of the default `dev` group because matplotlib is a heavy dependency
# and nothing else in the repo draws. The simulator itself is always installed;
# this adds only its `plot` extra. Run a scenario with
# `uv run --group sim python sim/scenarios/<name>.py`.
sim = ["wayfinder-sim[plot,interactive]"]

[tool.uv]
# This root project is just the dev-tooling/test harness for the monorepo —
# nothing here is itself built or published.
package = false

[tool.uv.workspace]
members = [
    "libs/wayfinder-py",
    "sim",
    "ml",
]

[tool.uv.sources]
wayfinder-py = { workspace = true }
wayfinder-sim = { workspace = true }
wayfinder-ml = { workspace = true }

[tool.pytest.ini_options]
# Recurse the crate tree, plus the simulator's own tests (sim/tests/) and the
# ML pipeline's (ml/tests/). Every one of these resolves its imports from the
# synced environment — the workspace members are installed editable — so no
# `pythonpath` entry, `conftest.py` shim or `sys.path` insert is needed to
# make one directory see another.
testpaths = ["libs", "sim", "ml"]
# importlib mode means test modules need not have globally-unique filenames, so
# two crates can each have e.g. tests/test_wire.py without colliding.
addopts = "-ra --import-mode=importlib"
