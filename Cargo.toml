[package]
name = "wayfinder-workspace"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "libs/rylr998",
    "libs/ieee802154",
    "libs/at86rf233",
    "libs/nrf-ieee802154",
    "libs/interfaces",
    "libs/batman",
    "libs/wayfinder-auth",
    "libs/wayfinder",
    "libs/wayfinder-protos",
    "libs/wayfinder-server",
    "libs/wayfinder-driver",
    "libs/wayfinder-test",
    "libs/wayfinder-client",
    "bins/wayfinder-tap",
    "bins/wayfinder-tui",
    "bins/wayfinder-ctl",
]

[workspace.lints.rust]
# Every public API must carry documentation (see CLAUDE.md). Enforced
# workspace-wide: any `pub` item without a doc comment fails the build.
missing_docs = "deny"

[workspace.lints.clippy]
# `.unwrap()`/`.expect()` in production code hide a panic where an error/None
# case exists; both are fine in tests, where crate roots carry
# `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used))]` to opt
# back out of this.
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# Local Dependencies
interfaces = { path = "./libs/interfaces" }
batman = { path = "./libs/batman" }
wayfinder-auth = { path = "./libs/wayfinder-auth", default-features = false }
wayfinder = { path = "./libs/wayfinder" }
wayfinder-protos = { path = "./libs/wayfinder-protos" }
wayfinder-server = { path = "./libs/wayfinder-server" }
wayfinder-driver = { path = "./libs/wayfinder-driver" }
wayfinder-client = { path = "./libs/wayfinder-client" }

# Third Party Dependencies
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
futures = "0.3.32"
thiserror = { version = "2.0.18" }
pretty-hex = "0.4.2"
anyhow = "1.0.102"
zerocopy = "0.8.48"
rand = "0.10.1"
clap = { version = "4", features = ["derive"] }
etherparse = "0.20.1"
embedded-io-async = "0.6.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
heapless = "0.9.3"
embedded-io-adapters = { version = "0.6.1", features = ["tokio-1"] }
async-trait = "0.1.89"
dynosaur = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
socket2 = { version = "0.6.3", features = ["all"] }
libc = "0.2.186"

[dependencies]
serde.workspace = true
