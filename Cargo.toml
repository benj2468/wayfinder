[package]
name = "wayfinder-workspace"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "libs/rylr998",
    "libs/interfaces",
    "libs/batman",
    "libs/wayfinder",
    "libs/wayfinder-protos",
    "libs/wayfinder-server",
    "libs/wayfinder-test",
    "bins/wayfinder-tap",
]

[workspace.dependencies]
# Local Dependencies
interfaces = { path = "./libs/interfaces" }
batman = { path = "./libs/batman" }
wayfinder = { path = "./libs/wayfinder" }
wayfinder-protos = { path = "./libs/wayfinder-protos" }
wayfinder-server = { path = "./libs/wayfinder-server" }

# Third Party Dependencies
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
futures = "0.3.32"
thiserror = { version = "2.0.18" }
pretty-hex = "0.4.2"
anyhow = "1.0.102"
zerocopy = "0.8.48"
rand = "0.10.1"
clap = { version = "4", features = ["derive"] }
etherparse = "0.20.1"
embedded-io-async = "0.6.1"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
heapless = "0.9.3"
embedded-io-adapters = { version = "0.6.1", features = ["tokio-1"] }
async-trait = "0.1.89"
