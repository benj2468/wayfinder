[package]
name = "radio-research"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "libs/rylr998",
    "libs/interfaces",
    "libs/batman",
    "libs/wayfinder",
    "libs/wayfinder-test",
]

[workspace.dependencies]
# Local Dependencies
interfaces = { path = "./libs/interfaces" }
batman = { path = "./libs/batman" }
wayfinder = { path = "./libs/wayfinder" }

# Third Party Dependencies
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
futures = "0.3.32"
thiserror = "2.0.18"
pretty-hex = "0.4.2"
anyhow = "1.0.102"
zerocopy = "0.8.48"
rand = "0.10.1"
