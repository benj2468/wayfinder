[workspace]
resolver = "3"
members = [
    "libs/rylr998",
    "libs/rylr998-sim",
    "libs/wayfinder-link-utils",
    "libs/ieee802154",
    "libs/lora-link",
    "libs/at86rf233",
    "libs/nrf-ieee802154",
    "libs/blue",
    "libs/interfaces",
    "libs/batman",
    "libs/wayfinder-auth",
    "libs/wayfinder",
    "libs/wayfinder-protos",
    "libs/wayfinder-server",
    "libs/wayfinder-tls-mgmt",
    "libs/wayfinder-clock-trust",
    "libs/wayfinder-storage",
    "libs/wayfinder-driver-core",
    "libs/wayfinder-driver",
    "libs/wayfinder-embedded-driver",
    "libs/wayfinder-tick-driver",
    "libs/wayfinder-log",
    "libs/wayfinder-version",
    "libs/wayfinder-alarm",
    "libs/wayfinder-test",
    "libs/wayfinder-bench",
    "libs/wayfinder-client",
    "libs/wayfinder-hil",
    "bins/wayfinder-tap",
    "bins/wayfinder-tui",
    "bins/wayfinder-ctl",
    "bins/wayfinder-web",
    "bins/rylr998-cli",
]

# Board-support code for the nRF52840 firmware crates. Not a member: it depends
# on `cortex-m/critical-section-single-core` and `cortex-m-rt`, which only
# needs a real embedded target, so `cargo build --workspace` could not build it.
# The `bins/wayfinder-nrf52840*` workspaces pull it in by path.
exclude = ["libs/wayfinder-nrf"]

# `bins/wayfinder-web` is driven by `cargo leptos`, which needs to know how to
# build the crate's two halves. Paths are relative to this workspace root.
#
# Both halves set `*-default-features = false`: the crate's `default` feature is
# empty on purpose so a plain `cargo build --workspace` compiles a stub instead
# of failing, and cargo-leptos selects `ssr`/`hydrate` explicitly here.
#
# Keep this table last in the `[workspace]` section: it is an array-of-tables,
# so any bare key written after it is parsed as one of *its* keys rather than as
# a `[workspace]` key.
[[workspace.metadata.leptos]]
name = "wayfinder-web"
bin-package = "wayfinder-web"
lib-package = "wayfinder-web"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "bins/wayfinder-web/style/main.css"
# Only the default; the binary's `--listen` overrides it (see `src/main.rs`).
site-addr = "127.0.0.1:8080"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[workspace.lints.rust]
# Every public API must carry documentation (see CLAUDE.md). Enforced
# workspace-wide: any `pub` item without a doc comment fails the build.
missing_docs = "deny"

[workspace.lints.clippy]
# `.unwrap()`/`.expect()` in production code hide a panic where an error/None
# case exists; both are fine in tests, where crate roots carry
# `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used))]` to opt
# back out of this.
unwrap_used = "deny"
expect_used = "deny"

# Groups
all = "deny"

[workspace.dependencies]
# Local Dependencies
interfaces = { path = "./libs/interfaces" }
batman = { path = "./libs/batman" }
wayfinder-auth = { path = "./libs/wayfinder-auth", default-features = false }
wayfinder = { path = "./libs/wayfinder" }
wayfinder-protos = { path = "./libs/wayfinder-protos" }
wayfinder-server = { path = "./libs/wayfinder-server" }
wayfinder-tls-mgmt = { path = "./libs/wayfinder-tls-mgmt" }
wayfinder-clock-trust = { path = "./libs/wayfinder-clock-trust" }
wayfinder-storage = { path = "./libs/wayfinder-storage", default-features = false }
wayfinder-driver-core = { path = "./libs/wayfinder-driver-core" }
wayfinder-driver = { path = "./libs/wayfinder-driver" }
wayfinder-embedded-driver = { path = "./libs/wayfinder-embedded-driver" }
wayfinder-client = { path = "./libs/wayfinder-client" }
# **No features here, and that is deliberate.** Cargo features are additive and
# unify across the graph, so anything this shared entry turns on can never be
# turned off by a crate downstream of it. Naming `ring` here looked like the fix
# for a host `GetLogs` outage and was not: it reached `bins/wayfinder-stm32f411`
# through `wayfinder-alarm` and silently put back the 16,416-byte ring that
# board's `default-features = false` exists to drop, with nothing failing to say
# so.
#
# So the **leaf binary** decides. A host node or a board that serves `GetLogs`
# names `ring` in its own manifest; a crate in the middle inherits whatever the
# binary linking it chose. Library *tests* that need a live ring name it in
# `[dev-dependencies]`, which downstream consumers do not see at all.
wayfinder-log = { path = "./libs/wayfinder-log", default-features = false }
wayfinder-version = { path = "./libs/wayfinder-version" }
wayfinder-alarm = { path = "./libs/wayfinder-alarm", default-features = false }
rylr998 = { path = "./libs/rylr998", default-features = false }
blue = { path = "./libs/blue", default-features = false }

# Third Party Dependencies
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
futures = "0.3.32"
thiserror = { version = "2.0.18" }
pretty-hex = "0.4.2"
anyhow = "1.0.102"
zerocopy = "0.8.48"
rand = "0.10.1"
# Password hashing for the certificate authority's user store (§5.2 of
# docs/design/06). Memory-hard by construction, which is why the store lives at
# the CA and never on a node — see §4 of that document.
argon2 = { version = "0.5", features = ["std"] }
blake2 = { version = "0.10", default-features = false }
# RFC 6238 TOTP is HMAC-SHA1 over a counter; these two are the primitives, and
# the ~25 lines of RFC on top live in `wayfinder-server`'s `users` module rather
# than in a dependency that would be almost entirely those same lines.
hmac = "0.12"
sha1 = "0.10"
# Constant-time comparison for the TOTP code and the enrollment token.
subtle = "2.6"
# QR encoding for the `otpauth://` URI the registration page shows, so a
# phone-only registrant can point a camera at it instead of retyping a base32
# secret. Project Nayuki's encoder: one file, no dependencies of its own, and
# it emits modules rather than an image — `wayfinder-web` draws its own SVG, so
# nothing pulls a raster image crate into the wasm bundle.
qrcodegen = "1.8.0"
# Reading a password from a terminal without echoing it (`wayfinderctl`).
rpassword = "7.4"
clap = { version = "4", features = ["derive"] }
etherparse = "0.20.1"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
heapless = "0.9.3"
# Typed bit flags. `no_std` with no dependencies of its own, so it reaches a
# board without pulling anything else in, and already in the lockfile
# transitively.
bitflags = { version = "2.13", default-features = false }
embedded-io-adapters = { version = "0.7.0", features = ["tokio-1"] }
tokio-serial = "5.4"
async-trait = "0.1.89"
dynosaur = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
socket2 = { version = "0.6.3", features = ["all"] }
libc = "0.2.186"
# Management-API TLS. `ring` provider for now (migrate to a FIPS-friendly
# provider later); `aws_lc_rs` default is disabled. Raw public keys (RFC 7250)
# carry the mesh Ed25519 identity in the handshake — no X.509.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
# The HTTP client the CA's VPN coordination talks to Headscale's REST API with.
# `rustls-no-provider` rather than `rustls`: it reuses the `ring` provider this
# workspace already installs process-wide (see wayfinder-server's tls.rs) rather
# than pulling a second crypto backend in beside it, which would make which
# provider serves a given handshake depend on link order.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "http2",
    "charset",
    "query",
] }
# The web dashboard (`bins/wayfinder-web`). Leptos is pinned as a family — the
# four crates share a version and `cargo-leptos` 0.3.x expects the 0.8 line.
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

# Argon2id at the store's real parameters (64 MiB, 3 passes) is one of the few
# things a test does that is compute-bound, and unoptimised it is slow enough
# to matter: under CI's coverage instrumentation and a loaded runner a single
# `user add` took past the client's 10 s response deadline, so the RPC tests
# failed on time rather than on behaviour. Optimising just the hash keeps the
# test suite honest about the parameters without paying for a release build.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Dependencies keep line tables (so a backtrace still names the file and line)
# but not full debuginfo — the variable and type information nobody steps
# through in a third-party crate, and most of a debug `target/`'s size. With
# full debuginfo, a debug build of the workspace plus `wayfinder-web` filled
# ~16 GB and `just ci` hit ENOSPC partway through `build-web` (#83). Workspace
# crates keep full debuginfo: `"*"` matches only non-members.
[profile.dev.package."*"]
debug = "line-tables-only"

# The one workspace member that gets the same treatment. Its `cdylib` exists
# for the wasm hydration bundle, but a host build links it too, and with full
# debuginfo that `.so` alone was 1.8 GB — plus multi-hundred-MB codegen units
# and ~5 GB of incremental state, almost all of it leptos' generic view types.
[profile.dev.package.wayfinder-web]
debug = "line-tables-only"
