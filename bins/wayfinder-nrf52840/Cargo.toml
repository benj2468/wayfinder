[package]
name = "wayfinder-nrf52840"
version = "0.1.0"
edition = "2024"
publish = false

# Independent workspace: this crate cross-compiles to a bare-metal target
# (thumbv7em-none-eabihf, see .cargo/config.toml) with its own linker script and
# panic handler, which must not leak into the main workspace's host builds.
[workspace]
members = ["."]

# Bare-metal `no_std` has no unwinder, so panic must abort or the compiler
# rejects the landing pads it would emit at low opt-levels. `wayfinder-nrf`'s
# `#[panic_handler]` supplies the handler; abort just drops the unwinding
# machinery.
#
# A fully-unoptimized debug image (mgmt server + prost + the crypto stack) is
# ~1 MiB and no longer fits `FLASH` once the top two pages are reserved for the
# durable identity store. Optimizing for size in dev too keeps debuginfo but
# shrinks the image well under the limit, so `cargo build` links.
[profile.dev]
opt-level = "s"
panic = "abort"

[profile.release]
panic = "abort"

# `#[no_std]`/`#[no_main]` can't build the host `test` harness.
[[bin]]
name = "wayfinder-nrf52840"
path = "src/main.rs"
test = false
doc = false
bench = false

[dependencies]
# Everything not specific to this board: fault handling, stack measurement,
# identity, the link enum, the USB management port, the capacity profile and the
# bring-up sequence. Shared with the dongle firmware.
wayfinder-nrf = { path = "../../libs/wayfinder-nrf" }
wayfinder = { path = "../../libs/wayfinder", default-features = false }
tracing = { version = "0.1.44", default-features = false }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
    "log",
] }
embassy-nrf = { version = "0.10.0", features = [
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "log",
] }
cortex-m = "0.7"
# Embassy's executor requires this to be a direct dependency.
cortex-m-rt = "0.7"
