[package]
name = "wayfinder-tap"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
wayfinder.workspace = true
wayfinder-alarm.workspace = true
# `iroh` is not in `wayfinder-driver`'s default features (it is a heavy
# backend — see that crate's Cargo.toml). The node turns it on, so a real
# deployment and a workspace build both carry the `Iroh` link.
wayfinder-driver = { workspace = true, features = ["iroh"] }
wayfinder-server.workspace = true

# The node's logging stack: installs the console + log-ring subscriber and owns
# the runtime filter the management API's SetLogLevel drives. `subscriber` is
# the host-side layer (the boards use the same crate's RTT facade instead).
wayfinder-log = { workspace = true, features = ["subscriber"] }
tracing.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
tun-rs = { version = "2", features = ["async"] }
serde.workspace = true
serde_yaml = "0.9.34"
pretty-hex.workspace = true
async-trait.workspace = true
sd-notify = "0.5.0"

[dev-dependencies]
# Raising a real SIGTERM in the shutdown test: what is under test is the
# process's actual signal disposition, which a mocked trigger would not touch.
libc.workspace = true
