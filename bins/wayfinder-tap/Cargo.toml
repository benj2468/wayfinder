[package]
name = "wayfinder-tap"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
wayfinder-version.workspace = true
wayfinder.workspace = true
wayfinder-alarm.workspace = true
wayfinder-driver.workspace = true
wayfinder-server.workspace = true

# The node's logging stack: installs the console + log-ring subscriber and owns
# the runtime filter the management API's SetLogLevel drives. `subscriber` is
# the host-side layer (the boards use the same crate's RTT facade instead).
# `ring` as well as `subscriber`: this binary serves `GetLogs`, and the ring is
# what it serves *from*. The workspace entry deliberately names no features —
# see the comment there for why a shared entry must not.
wayfinder-log = { workspace = true, features = ["subscriber", "ring"] }
tracing.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
tun-rs = { version = "2", features = ["async"] }
serde.workspace = true
serde_yaml = "0.9.34"
pretty-hex.workspace = true
async-trait.workspace = true

# `MembershipCert` is a `#[repr(C, packed)]` wire struct with no bespoke
# serializer: its bytes come from `IntoBytes::as_bytes`, which is how a
# self-issued certificate reaches the same code path as one read from a file.
zerocopy.workspace = true
sd-notify = "0.5.0"

[dev-dependencies]
# Raising a real SIGTERM in the shutdown test: what is under test is the
# process's actual signal disposition, which a mocked trigger would not touch.
libc.workspace = true
