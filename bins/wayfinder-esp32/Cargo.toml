[package]
name = "wayfinder-esp32"
version = "0.1.0"
edition = "2024"
publish = false

# Independent workspace, for the same reason every board binary is one: a
# bare-metal target triple, linker script and panic handler must not leak into
# the host workspace. This board has a second, harder reason — its target
# (`xtensa-esp32-none-elf`) exists only in Espressif's rustc fork, so the root
# workspace's toolchain cannot build this crate at all. See the `esp-toolchain`
# section of the justfile.
[workspace]
members = ["."]

# Matching the other boards. `panic = "abort"` is the load-bearing one: a
# bare-metal image has no use for unwinding machinery.
[profile.dev]
opt-level = "s"
panic = "abort"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"

# `#[no_std]`/`#[no_main]` can't build the host `test` harness.
[[bin]]
name = "wayfinder-esp32"
path = "src/main.rs"
test = false
doc = false
bench = false

[dependencies]
# Named only to choose `compact-sha512`: the rolled SHA-512 Ed25519 runs on,
# ~10 KiB smaller than `sha2`'s unrolled round for the same digest. A size
# choice, so the leaf binary makes it; the host build keeps the fast path.
# `default-features = false` because the default is the host's `std`.
wayfinder-auth = { path = "../../libs/wayfinder-auth", default-features = false, features = [
    "compact-sha512",
] }
# The build identity this firmware prints at bring-up, so a flashed image can
# be tied back to a commit.
wayfinder-version = { path = "../../libs/wayfinder-version" }
# The routing core, at this board's capacity profile. `default-features = false`
# keeps `std`/`alloc` host helpers out.
wayfinder = { path = "../../libs/wayfinder", default-features = false }
# The same HAL-agnostic event loop the nRF and STM32 boards run. This board
# supplies only a `Clock` and its links.
wayfinder-embedded-driver = { path = "../../libs/wayfinder-embedded-driver" }
# **No text sink at all**, and the ring on. UART0 carries the management API
# (`src/mgmt.rs`), and a console sharing it would desynchronise the framing;
# RTT is not an option either, since this board has no debug probe. So records
# go to the `GetLogs` ring and are read back over that same port with
# `wayfinderctl logs` -- the nRF dongle's posture. See
# `libs/wayfinder-log/src/sink.rs`, which supports exactly this case.
wayfinder-log = { path = "../../libs/wayfinder-log", default-features = false, features = [
    "ring",
] }
# The embedded framing and the query channel bridging the management port to the
# single-threaded router loop. `default-features = false` drops the tokio/TLS
# host transport.
wayfinder-server = { path = "../../libs/wayfinder-server", default-features = false, features = [
    "embedded",
] }
# For the bring-up records the router emits; `std` off, routed to the sink
# above by `wayfinder-log`.
tracing = { version = "0.1.44", default-features = false }
# Espressif's HAL. The `esp32` feature selects the original Xtensa LX6 part —
# not interchangeable with the RISC-V ESP32-C/H parts, which need neither this
# target nor the toolchain fork.
# `unstable` is not optional here despite the name: `esp-rtos` drives the
# scheduler through esp-hal APIs that sit behind it, and esp-hal's build script
# fails outright ("the `unstable` feature is required by a dependent crate")
# rather than at the call site.
esp-hal = { version = "~1.2.1", features = ["esp32", "unstable"] }
# Emits the app descriptor the ESP-IDF second-stage bootloader expects to find
# in the image header. Without it the ROM bootloader refuses to start what we
# flash, which looks like a dead board rather than a rejected image.
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
# Not a logging sink -- `wayfinder-log` selects none on this board, see above.
# It is here only because `esp-backtrace`'s panic handler renders through it.
# A panic does write onto UART0 and so onto the management port, which garbles
# whatever frame was in flight; that is accepted, because a panic ends the
# session anyway and a decodable backtrace is worth more than clean framing on
# the way down.
esp-println = { version = "0.17.0", features = ["esp32"] }

# Raw SPI-flash access for the durable identity store, through the partition
# `partitions.csv` declares for it. `NorFlash` with a 4096-byte erase size,
# which is what `wayfinder-storage`'s `FlashStore` wants for its A/B pages.
#
# **`bytewise-read` is required, not a nicety.** Without it this backend's
# `READ_SIZE` is a 4-byte word and `read_nor` rejects any read whose *offset or
# length* is not a multiple of four. `FlashStore` streams a stored blob through
# CRC in bounded chunks, so its last chunk is `len % CRC_CHUNK` and almost never
# word-aligned: every load of a real record failed with
# `Store(Flash(NotAligned))` and the board fell back to no identity at all. The
# feature drops `READ_SIZE` to 1 and has the backend reassemble unaligned reads
# through a word buffer of its own.
esp-storage = { version = "0.10.0", features = [
    "esp32",
    "embedded-storage",
    "bytewise-read",
] }
# The A/B two-page durable store itself. `flash` rather than `std`: the same
# abstraction the nRF boards persist through, over a different medium.
wayfinder-storage = { path = "../../libs/wayfinder-storage", default-features = false, features = [
    "flash",
] }

# The embassy time driver and executor for this chip. The nRF and STM32 boards
# run `embassy-executor` over their vendor HAL's time driver, and this is the
# Espressif equivalent -- so all three boards drive the same `Driver::run` loop
# with the same `select!` semantics rather than this one inventing its own.
esp-rtos = { version = "0.4.0", features = ["esp32", "embassy", "esp-alloc"] }
# **Pinned to what `esp-rtos` itself depends on** (0.10 -- the same major the
# nRF boards are on; only `bins/wayfinder-stm32f411` still sits at 0.9). `#[esp_rtos::main]` hands the body a `Spawner` from
# *its* copy, so a second major version in the graph is two incompatible
# `Spawner` types and a `mismatched types` error on the macro rather than at
# any line a reader would look at. Deliberately no `arch-*` feature: `esp-rtos`
# provides the executor, and the crate docs say not to.
embassy-executor = "0.10"
embassy-time = "0.5.1"
# `join`, to run the router loop and the management port concurrently on one
# task -- the same primitive `libs/wayfinder-nrf`'s `node::run` uses.
embassy-futures = "0.1.2"
# `tracing-core` does an unconditional `extern crate alloc`, so any binary
# linking the log plumbing needs a real allocator -- the same reason the
# Cortex-M boards carry `embedded-alloc`.
esp-alloc = "0.11.0"
# The panic handler, printing a decodable backtrace over that same UART. A
# `loop {}` handler would be smaller and would turn every panic into a silent
# hang — the one failure mode worth spending flash to avoid on a new board.
esp-backtrace = { version = "0.19.0", features = [
    "esp32",
    "panic-handler",
    "println",
] }
