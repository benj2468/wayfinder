[package]
name = "wayfinder-pixel"
version = "0.1.0"
edition = "2024"
publish = false

# Independent workspace (like bins/wayfinder-nrf52840 and
# bins/wayfinder-stm32f411): cross-compiles via `cargo-ndk` for
# aarch64-linux-android, using the Android NDK's own clang/linker rather than
# the host toolchain, which must not leak into the main workspace's host
# builds. Built from its own directory (`cargo ndk -t arm64-v8a build`), not
# via `-p` from the root — see .gitlab-ci.yml's build:embedded job for the
# same pattern applied to the bare-metal boards.
[workspace]
members = ["."]

[[bin]]
name = "wayfinder-pixel"
path = "src/main.rs"

# The actual artifact the Android app loads: a `cdylib` exposing `src/lib.rs`'s
# UniFFI interface (`MeshNode`/`PixelBleAdvertiser`). `lib` is also kept
# (rather than `cdylib` alone) so `cargo test` can build/run this crate's own
# unit tests as a normal rlib — a `cdylib`-only crate isn't directly
# testable. The `[[bin]]` above doesn't use this lib today (it's a separate,
# lighter NDK-linking smoke test — see its own doc comment).
[lib]
crate-type = ["cdylib", "lib"]

# Only built/run on demand (`cargo run --bin uniffi-bindgen --features
# uniffi-bindgen -- generate ...`), never as part of a normal `cargo build`/
# `cargo ndk build` — `uniffi/cli` pulls in `clap` and friends, which have no
# reason to ship in the Android `.so`.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]

[features]
uniffi-bindgen = ["uniffi/cli"]

[dependencies]
# The seam this crate hosts for real: `BleLink`/`BleAdvertiser`, see
# `libs/blue/CLAUDE.md`. Used two ways — `main.rs`'s `NoopAdvertiser` proves
# `blue` itself links against the NDK's libc; `src/lib.rs`'s `MeshNode`/
# `ForeignAdvertiser` are the actual UniFFI-exported glue. `android` needs
# only `tokio`, no Android/JNI dependency itself.
blue = { path = "../../libs/blue", default-features = false, features = ["android"] }
# The bare `LinkT`/`interfaces` surface `blue` itself builds on;
# `default-features = false` keeps std/alloc off, matching how `blue`
# depends on it.
wayfinder = { path = "../../libs/wayfinder", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# UniFFI proc-macro export surface for `src/lib.rs` — no UDL file, no
# `build.rs` scaffolding step; `#[uniffi::export]`/`uniffi::setup_scaffolding!`
# generate the FFI glue directly. Kotlin bindings are produced separately by
# the `uniffi-bindgen` bin above, against the built `.so`.
uniffi = "0.28"
# `#[uniffi::export(with_foreign)]`'s expansion for async trait methods needs
# this in scope by name (its generated foreign-callback proxy type
# implements the trait via `async_trait`'s boxed-future desugaring, for the
# same dyn-compatibility reason `ForeignAdvertiser`'s own `Arc<dyn
# PixelBleAdvertiser>` needs it below).
async-trait = "0.1"
thiserror = "2.0.18"
tracing = { version = "0.1.44", default-features = false }
