[package]
name = "wayfinder-ctl"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "wayfinder-ctl"
path = "src/main.rs"

[lib]
name = "wayfinderctl"
path = "src/lib.rs"

[dependencies]
wayfinder-client = { workspace = true, features = ["cli"] }
wayfinder.workspace = true
wayfinder-protos = { workspace = true, features = ["serde"] }
wayfinder-version.workspace = true
wayfinder-auth = { workspace = true, features = ["std"] }
interfaces.workspace = true
clap = { workspace = true, features = ["env"] }
anyhow.workspace = true
tokio.workspace = true
zerocopy.workspace = true
rand = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json = "1"
# Reading a password from a terminal without echoing it.
rpassword.workspace = true

[dev-dependencies]
tempfile = "3"
# Test-only since design 15: the `user` subcommands became pure RPC, so nothing
# in `src/` constructs a `CertAuthority` any more. What still needs one is the
# in-process provider the integration tests run against.
wayfinder-server.workspace = true
wayfinder-auth = { workspace = true, features = ["std"] }
# So a test can present a live TOTP code the way an authenticator app would,
# against a secret it read out of an `otpauth://` URI. The authority's own
# generator is private to `wayfinder-server`, and widening it for a test in
# another crate would put a code *generator* on a type whose whole job is to
# verify one.
hmac.workspace = true
sha1.workspace = true
