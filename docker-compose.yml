# Run a Wayfinder node plus the browser dashboard on this host.
#
#   docker compose up --build      # first run also compiles the workspace
#   open http://127.0.0.1:8080
#
# Three services, all built from containers/Dockerfile (which see for how the
# images are assembled) — two that run, and one that is only ever `run`:
#
#   node  — wayfinder-tap: the mesh node. Creates a kernel TAP, carries a raw-L2
#           mesh link on a host NIC, and serves the management API.
#   web   — wayfinder-web: the axum/Leptos dashboard. It is the only party that
#           speaks the management protocol (the browser never does), so it
#           holds a mesh identity and connects out to `node`.
#   ctl   — wayfinderctl, one command at a time (`docker compose run --rm ctl
#           …`). Not started by `up`: it is a CLI, given the node's identity
#           volume so it authenticates as the node with no flags.
#
# The two share the `state` volume, which is how the dashboard gets an identity:
# the node writes /var/lib/wayfinder/identity.seed on first boot, and the
# dashboard reads that same file to bootstrap into an un-enrolled node. That is
# the *static credential* mode, and it is the right one here: this node has no
# certificate authority behind it, so there are no accounts to sign in to.
#
# Once the mesh has a CA, point the dashboard at it instead — `--provider
# <ca-host>:7700 --provider-key <hex> --node-key <hex>` — and it holds no
# credential at all: each viewer signs in for a session certificate of their
# own, and the shared volume goes away with it.
#
# Images are pulled from `$WAYFINDER_REGISTRY` (set it in a `.env` beside this
# file to use a mirror or your own builds), defaulting to ghcr.io, where CI's
# `deploy` job publishes `nightly` from `main` and a tag per release. A private
# package there needs `docker login ghcr.io` first. Every service here is
# `pull_policy: always`, so a registry the host cannot reach or is not logged
# in to fails `up` rather than falling back to a local build.
name: wayfinder
services:
  node:
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: tap
    image: ${WAYFINDER_REGISTRY:-ghcr.io/benj2468/wayfinder}/wayfinder-tap:nightly
    pull_policy: always
    command: ["--config", "/etc/wayfinder/node.yml"]
    network_mode: host
    # NET_ADMIN + /dev/net/tun to create and configure the kernel TAP device;
    # NET_RAW for the AF_PACKET/broadcast sockets the mesh links open. The image
    # bakes in neither — granting them is the caller's decision.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./containers/node.yml:/etc/wayfinder/node.yml:ro
      # Runtime identity state: the TLS identity seed and the persisted TAP MAC.
      # Named (not bind-mounted) because the seed is a secret the node creates
      # owner-only, and because keeping it makes this node's mesh identity
      # survive a `down`/`up`.
      - state:/var/lib/wayfinder
      # The host's D-Bus system bus, which is how a `Ble` link reaches BlueZ:
      # `bluetoothd` runs on the host and owns the adapter, so the container
      # borrows the host's bus rather than running a daemon of its own (an
      # in-container bus would have no org.bluez on it at all). Read-write on
      # purpose — a bus socket is bidirectional, and :ro would break the client's
      # own writes, not just protect the host.
      #
      # Harmless when no `Ble` link is configured; the node never opens the bus.
      # If the host has no bluetoothd, `docker compose up` fails on the missing
      # path instead — drop this line for a BLE-less deployment.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    environment:
      RUST_LOG: "info"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: web
    image: ${WAYFINDER_REGISTRY:-ghcr.io/benj2468/wayfinder}/wayfinder-web:nightly
    pull_policy: always
    # Host networking, same as `node`. `--listen` (the dashboard's own bind
    # address, distinct from `--connect` below) is passed explicitly rather than
    # left to a default, because under host networking loopback is the *host's*
    # real loopback and the difference is a security boundary: this dashboard
    # runs on a static credential and has no sign-in, so whoever reaches the
    # port has the access the node identity carries
    # (bins/wayfinder-web/CLAUDE.md). Widening it beyond the host needs a
    # reverse proxy in front, per that doc, and `--allowed-host` naming that
    # proxy.
    network_mode: host
    # --connect takes a DNS name as readily as an address, but not the `node`
    # service name: `network_mode: host` opts both containers out of Compose's
    # embedded DNS, so nothing here resolves it. 127.0.0.1 (both containers
    # share the host's network namespace) is the way to reach the node's mgmt
    # API here.
    # --identity is left at its default, /var/lib/wayfinder/identity.seed, which
    # on the shared volume is the *node's* seed; with no --cert that proves the
    # node's own key, the bootstrap path into a node that has not enrolled yet.
    command: ["--listen", "127.0.0.1:8080", "--connect", "127.0.0.1:7700"]
    volumes:
      - state:/var/lib/wayfinder:ro
    environment:
      RUST_LOG: "info"
    # `depends_on` only waits for the node's *container* to start, not for it to
    # have written its identity seed — and the dashboard reads that seed at
    # startup. So the first boot may exit once with "No such file or directory"
    # before the node gets there; the restart policy covers that race, and the
    # connection itself is lazy (the dashboard comes up with the node down and
    # reconnects on its own).
    depends_on:
      - node
    restart: unless-stopped
  # `wayfinderctl` against this node, one invocation at a time:
  #
  #   docker compose run --rm ctl --identity /var/lib/wayfinder/identity.seed node-info
  #   docker compose run --rm ctl --identity /var/lib/wayfinder/identity.seed auth status
  #   docker compose run --rm ctl --identity /var/lib/wayfinder/identity.seed link list
  #
  # A service rather than a documented `docker run` line because of the volume:
  # the node's identity seed lives in `state`, which is a named volume with no
  # path on this host, and that seed is the credential. Proving the node's own
  # key *is* full management access on a node with no trust anchor yet (the
  # self-key tier in `wayfinder_server::authz`), and remains valid after
  # enrollment — so this is the one credential that works at every stage of a
  # node's life.
  #
  # `--identity` is spelled out rather than left to its default, and this is the
  # one place that distinction bites. The path *is*
  # `ConnectArgs::DEFAULT_IDENTITY_PATH`, which is exactly where the volume is
  # mounted — but `wayfinderctl` only falls back to it once something else has
  # already decided the credential (the `--cert-from` branch of
  # `build_endpoint`). An absent `--identity` on a plain query means "use the
  # stored login session" instead, so these commands fail with "no credential"
  # without it. Setting `WAYFINDER_IDENTITY` in the environment below would fix
  # the flag away, at the cost of making `wayfinderctl login` unreachable from
  # this service — the session that volume exists to keep would never be
  # consulted again. The flag is the cheaper half of that trade.
  #
  # In its own profile so `up` never starts it. It is a CLI with no default
  # subcommand, and `docker compose run` enables a service's profile implicitly,
  # so the commands above need no `--profile`.
  ctl:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: ctl
    image: ${WAYFINDER_REGISTRY:-ghcr.io/benj2468/wayfinder}/wayfinder-ctl:nightly
    pull_policy: always
    # Host networking, like everything else here: the node's management API is
    # on the host's loopback, and an offline `cert` subcommand opens no
    # connection at all (`provider user` is not one of those any more — accounts
    # are administered over the management API).
    network_mode: host
    volumes:
      # Read-only, and that is the whole posture: this container reads the
      # node's identity to authenticate as it, and must never be the thing that
      # rewrites it. Everything that changes the node goes over the management
      # API instead.
      - state:/var/lib/wayfinder:ro
      # Somewhere durable for the operator-side files a command produces — a
      # CSR carried to an offline CA, a certificate collected from one, the
      # session `wayfinderctl login` stores. Durable because these outlive a
      # single `run`: a provider that holds requests for approval is answered
      # hours later, by a second invocation that has to find the first one's
      # output.
      - ctl-work:/work
    environment:
      # The node this CLI talks to unless `--connect` says otherwise, so
      # commands aimed at *this* node need no flags and the ones aimed at an
      # authority say so explicitly.
      WAYFINDER_CONNECT: "127.0.0.1:7700"
      # Keep `wayfinderctl login`'s stored session on the durable volume rather
      # than in a container-lifetime $HOME.
      WAYFINDER_CONFIG_HOME: "/work/config"
    # A one-shot: `run` must not resurrect it, and a non-zero exit (a CSR still
    # awaiting approval, say) is a result to read rather than a crash to retry.
    restart: "no"
volumes:
  state:
  ctl-work:
