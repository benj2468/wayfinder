# Three-node Wayfinder mesh simulation in a line topology:
#
#     node1 ──(link_ab)── node2 ──(link_bc)── node3
#
# Each docker network is its own isolated L2 segment carrying RawL2 mesh frames.
# node1 and node3 share no segment, so they can only reach each other through
# node2's BATMAN forwarding — exactly the multi-hop path the TUI visualises.
#
# Usage:
#   docker compose up --build -d
#   docker compose exec node1 wayfinder-tui      # inspect node1's routing tree
#   docker compose exec node2 wayfinder-tui      # node2 sees 1 and 3 directly
#   docker compose logs -f node2                 # watch OGM/route activity
#   docker compose down
#
# Each node needs NET_ADMIN (+ /dev/net/tun) to create its TAP device and
# NET_RAW for the AF_PACKET RawL2 sockets.
# Shared definition pulled into each node via a YAML anchor.
x-node: &node
  build:
    context: .
    dockerfile: containers/sim.Dockerfile
  image: wayfinder-sim:latest
  cap_add:
    - NET_ADMIN # create the kernel TAP device
    - NET_RAW # AF_PACKET raw L2 sockets
  devices:
    - /dev/net/tun
  # Keep a TTY so `docker compose exec <node> wayfinder-tui` has a real terminal.
  tty: true
  stdin_open: true
  restart: unless-stopped
services:
  node1:
    !!merge <<: *node
    container_name: wf-node1
    hostname: node1
    environment:
      NODE_IP: 10.0.0.1
      RUST_LOG: trace
    networks:
      - link_ab
  node2:
    !!merge <<: *node
    container_name: wf-node2
    hostname: node2
    environment:
      NODE_IP: 10.0.0.2
      RUST_LOG: trace
    networks:
      - link_ab
      - link_bc
  node3:
    !!merge <<: *node
    container_name: wf-node3
    hostname: node3
    environment:
      NODE_IP: 10.0.0.3
      RUST_LOG: trace
    networks:
      - link_bc
      - link_ce
      - link_cd
  node4:
    !!merge <<: *node
    container_name: wf-node4
    hostname: node4
    environment:
      NODE_IP: 10.0.0.4
      RUST_LOG: trace
    networks:
      - link_cd
      - link_df
  node5:
    !!merge <<: *node
    container_name: wf-node5
    hostname: node5
    environment:
      NODE_IP: 10.0.0.5
      RUST_LOG: trace
    networks:
      - link_ce
      - link_ef
  node6:
    !!merge <<: *node
    container_name: wf-node6
    hostname: node6
    environment:
      NODE_IP: 10.0.0.6
      RUST_LOG: trace
    networks:
      - link_df
      - link_ef
# Two separate bridge segments. node2 straddles both; 1 and 3 are isolated.
networks:
  link_ab:
    driver: bridge
  link_bc:
    driver: bridge
  link_cd:
    driver: bridge
  link_ce:
    driver: bridge
  link_de:
    driver: bridge
  link_ef:
    driver: bridge
  link_df:
    driver: bridge
