[package]
name = "batman"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
# Pinned directly (not workspace inheritance, which can't override
# default-features) so `default-features = false` keeps std off for both —
# thiserror still gates `impl core::error::Error` behind `std`, and tracing's
# `std` feature pulls in `once_cell/std`. Needed for this crate's `no_std` build.
thiserror = { version = "2.0.18", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }
heapless.workspace = true

tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
interfaces.workspace = true
