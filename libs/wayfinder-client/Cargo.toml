[package]
name = "wayfinder-client"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# The shared clap arguments (`ConnectArgs`) every management-API *binary*
# flattens. Off by default so an embedder that only speaks the protocol does not
# pull in a CLI parser.
cli = ["dep:clap"]

[dependencies]
wayfinder-protos.workspace = true
# The Ed25519-identity <-> rustls-raw-public-key bridge shared with
# `wayfinder-server`; neither management-TLS crate depends on the other.
wayfinder-tls-mgmt.workspace = true
# The identity crate: `Keypair` (to derive the pinned node key from a seed) and
# the seed/cert types the client authenticates with.
wayfinder-auth = { workspace = true, features = ["std"] }
# Whether this host's own clock is disciplined enough to stamp onto a node.
# Shared with `wayfinder-server` so the *same* verdict gates a CA issuing a
# credential and a client stamping the time that installs it (design 20 §4.6);
# neither of those crates depends on the other, which is why it is its own.
wayfinder-clock-trust.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
# The serial transport for reaching an embedded node's unauthenticated debug
# management API (e.g. the nRF52840's onboard-VCOM UART at /dev/ttyACM*).
# `SerialStream` is a tokio `AsyncRead + AsyncWrite`, so it frames identically to
# the TLS socket.
tokio-serial = "5.4"
futures.workspace = true
anyhow.workspace = true
prost = { version = "0.13", features = ["std"] }
bytes = "1"
# The throwaway identity `probe_node_key` presents on the one connection that
# carries no request.
rand = { workspace = true, features = ["std"] }

# Only for the `cli` feature: the shared `--connect`/`--identity`/... argument
# definitions the CLI binaries flatten.
clap = { workspace = true, features = ["derive", "env"], optional = true }

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]`: the request-deadline
# test reaches its deadline by letting the runtime auto-advance a paused clock,
# rather than by making the suite wait out a real one.
tokio = { workspace = true, features = ["test-util"] }
# Test-only: `args.rs` writes an identity seed to a scratch path to exercise
# endpoint resolution.
tempfile = "3"
anyhow.workspace = true
# Test-only: the `tests/transport.rs` end-to-end test and this crate's own
# handshake tests spin up a real `wayfinder-server` TLS listener to drive the
# client against. Production code (src/) never depends on the server crate.
wayfinder-server.workspace = true
# Test-only: `tests/transport.rs` drives records into the real log ring so the
# GetLogs/SetLogLevel path is exercised end to end over the wire, rather than
# against a canned provider value. `ring` is named here rather than on the
# workspace entry because a `[dev-dependencies]` feature is invisible
# downstream — a board linking this crate must stay free to build without it.
wayfinder-log = { workspace = true, features = ["ring"] }
