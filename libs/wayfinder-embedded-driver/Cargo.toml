[package]
name = "wayfinder-embedded-driver"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

# The `no_std` counterpart to `wayfinder-driver`: it runs the router's event
# loop on bare metal.  Deliberately **HAL- and executor-agnostic** — it depends
# on no vendor HAL and on no concrete time driver, so the same driver runs on
# the nRF52840 (Nordic) and on any Cortex-M (e.g. STM32).  A board supplies the
# concrete mesh links ([`LinkT`]) and a [`Clock`]; the board's async executor
# drives [`Driver::run`].

[dependencies]
wayfinder-driver-core.workspace = true
# The `no_std` core of the durable-store abstraction: the `Persisted`/`Codec`/
# `DurableStore` traits the node-identity persistence (`identity.rs`) is built
# on. Default features off so no `std`/`FileStore` is pulled into this `no_std`
# crate; a board supplies the concrete `DurableStore` (e.g. the `flash`-feature
# `FlashStore`) at the binary.
wayfinder-storage = { workspace = true, default-features = false }
# Pinned directly (not workspace inheritance, which can't override
# `default-features`) so the crate stays `no_std` — no `alloc`, no `std`.
wayfinder = { path = "../wayfinder", default-features = false }
interfaces.workspace = true
heapless.workspace = true
# The record's flags byte, as a type rather than seven loose `1 << n`
# constants: `RecordFlags` in `identity.rs`. `no_std`, no transitive deps.
bitflags.workspace = true
# Pure future combinators (`select_array`) — no time driver, builds for host.
embassy-futures = "0.1.2"
# Pinned directly to keep tracing's `std` feature off for the `no_std` build.
tracing = { version = "0.1.44", default-features = false }

# The `no_std` management-API adapter + request dispatcher and the query channel
# that carries a request in / a response out. Pinned directly (not workspace
# inheritance, which can't override `default-features`) so `wayfinder-server` is
# taken with only its `embedded` feature and no `std`/tokio leaks in.
#
# Unconditional, where this used to sit behind an off-by-default `mgmt` feature.
# The feature bought nothing: it was `default = ["mgmt"]`, so both consumers
# (`wayfinder-nrf` and `bins/wayfinder-stm32f411`) took it, nothing in CI or the
# `justfile` ever built `--no-default-features`, and its stated purpose — keeping
# a pure radio relay heap-free — was already void, since `tracing-core`'s
# unconditional `extern crate alloc` means every board that logs links an
# allocator regardless. What it did cost was 24 `#[cfg]` attributes over a
# configuration nothing compiled.
wayfinder-server = { path = "../wayfinder-server", default-features = false, features = [
    "embedded",
] }
wayfinder-protos.workspace = true
embassy-sync.workspace = true

[dev-dependencies]
# Test-only, and `std` on purpose: `Authority` is the host-side CA, so it is
# the only way to mint a *signed* certificate — which `SetAuth` verifies. A
# hand-built unsigned one is enough for `Driver::restore` (which deliberately
# does not re-verify) and not enough for the mgmt path. A dev-dependency, so
# the feature does not reach a firmware build: dev-deps are not part of the
# normal graph, and `cargo build` for a board never resolves them.
wayfinder-auth = { workspace = true, features = ["std"] }
# Test-only: the build identity this crate was compiled with, to assert the
# board's served `NodeInfo` reports it. Reaches the firmware anyway through
# `wayfinder-protos`; the dev-dependency is only so the test can name it.
wayfinder-version.workspace = true
# A minimal executor to drive the async loop in host unit tests.
futures.workspace = true
# Test-only: build/parse raw link frames (`as_bytes`/`ref_from_bytes`) to feed a
# received OGM into the loop.
zerocopy.workspace = true
