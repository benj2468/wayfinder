[package]
name = "wayfinder-nrf"
version = "0.1.0"
edition = "2024"
publish = false

# Excluded from the root workspace (see its `exclude`) because `cortex-m-rt`'s
# entry point and `critical-section-single-core` only make sense for a real
# embedded target. Consumed by path from the `bins/wayfinder-nrf52840*`
# firmware crates; profiles and the target triple come from whichever of those
# is building.
[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
all = "deny"

[lib]
test = false
doc = false
bench = false

[dependencies]
wayfinder = { path = "../wayfinder", default-features = false }
# The node's alarm board, for the one boot-path condition that is latchable
# rather than merely loggable: a stored credential naming an address this node
# does not run under, which no restart clears. Already in the graph via
# `wayfinder`; named here because this crate raises against it directly.
wayfinder-alarm = { path = "../wayfinder-alarm" }
wayfinder-embedded-driver = { path = "../wayfinder-embedded-driver" }
# By path, like its neighbours: this crate is not a root-workspace member. A
# zero-dependency `no_std` crate of consts — the build identity this firmware
# logs at bring-up and reports over `GetNodeInfo`.
wayfinder-version = { path = "../wayfinder-version" }
wayfinder-server = { path = "../wayfinder-server", default-features = false, features = [
    "embedded",
] }
wayfinder-storage = { path = "../wayfinder-storage", default-features = false, features = [
    "flash",
] }
wayfinder-log = { path = "../wayfinder-log" }
rylr998 = { path = "../rylr998", features = ["link"] }
nrf-ieee802154 = { path = "../nrf-ieee802154" }
# Only `short_address_of`, so a board's LoRa `AT+ADDRESS` and its 802.15.4
# source address are the same derivation from the same `Mac`.
ieee802154 = { path = "../ieee802154" }

embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.10.0", features = [
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "log",
] }
# 0.10, matching `nrf-ieee802154`'s. Deliberately still *not*
# `executor-interrupt`: nothing here needs a preempting executor, and the two
# background tasks a board spawns (the 802.15.4 radio and the CDC-NCM receive
# loop) both reach `LinkT` through `CriticalSectionRawMutex` channels sized
# for one. Turning it on is a deliberate act, not a default.
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
    "log",
] }
embassy-time = { version = "0.5.1", features = ["log"] }
# `default-features = false` drops the unused `usbd-hid` class, which otherwise
# pulls in a second `heapless` version alongside the workspace's.
embassy-usb = { version = "0.6.0", default-features = false, features = ["max-interface-count-6"] }
embedded-io-async = "0.7.0"
tracing = { version = "0.1.44", default-features = false }
# Only the `FromBytes` trait, to reinterpret a received CDC-NCM datagram as a
# `LinkFrame` in place. No `derive` feature: this crate declares no wire structs
# of its own.
zerocopy = { version = "0.8.48", default-features = false }

# `critical-section-single-core` **is** the right impl now, and used to be
# actively wrong. Its `acquire` is a bare `cpsid i`, masking everything; while
# the SoftDevice owned priority-0/1 RADIO/RTC0/TIMER0, that starved the radio
# on paths this firmware runs constantly (every log record, every heap
# allocation) until the SoftDevice tripped `NRF_FAULT_ID_SD_ASSERT`. The impl
# then came from `nrf-softdevice/critical-section-impl`, which masked only
# non-reserved IRQs. With the SoftDevice gone there are no reserved IRQs to
# starve and no second `critical_section::set_impl!` to collide with, so the
# plain single-core impl is both correct and the only one left.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
# `tracing-core` does an unconditional `extern crate alloc;`, so anything in
# this dependency graph needs a real allocator.
embedded-alloc = "0.6"
# Pinned to the 0.5 already resolved via `wayfinder-log`: `fault`'s panic
# handler writes to that crate's initialized print channel rather than opening a
# second RTT control block, so the versions must match.
rtt-target = "0.5"
static_cell = "2"
