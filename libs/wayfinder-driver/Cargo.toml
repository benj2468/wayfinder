[package]
name = "wayfinder-driver"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = ["tokio"]
# Enables the tokio-driven event loop, the concrete `tokio::net` frame
# transports, and the in-process server wiring.  Without it the crate exposes
# only the transport-agnostic [`FrameIo`] trait and the IGMP [`McastSnooper`].
tokio = [
    "dep:tokio",
    "dep:futures",
    "dep:socket2",
    "dep:libc",
    "dep:linkme",
    "dep:schemars",
    "dep:serde_json",
    "dep:serde",
    "std",
]
std = ["dep:async-trait", "wayfinder/std", "wayfinder/schema"]

[dependencies]
wayfinder.workspace = true
interfaces.workspace = true
wayfinder-protos.workspace = true
wayfinder-server.workspace = true

async-trait = { workspace = true, optional = true }
anyhow.workspace = true
tracing.workspace = true
zerocopy.workspace = true
etherparse.workspace = true

tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
