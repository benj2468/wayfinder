[package]
name = "wayfinder-driver"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = ["tokio"]
# Enables the tokio-driven event loop, the concrete `tokio::net` frame
# transports, and the in-process server wiring.  Without it the crate exposes
# only the transport-agnostic [`FrameIo`] trait and the IGMP [`McastSnooper`].
tokio = [
    "dep:tokio",
    "dep:futures",
    "dep:socket2",
    "dep:libc",
    "dep:rylr998",
    "dep:blue",
    "dep:tokio-serial",
    "dep:embedded-io-adapters",
    "dep:embedded-io-async",
    "std",
]
# `blue?/std` (not `blue/std`): enabling `std` alone must not drag in the BLE
# link and its whole BlueZ/D-Bus dependency tree — that is `tokio`'s to pull,
# since only the tokio event loop can build the link.
std = ["dep:async-trait", "wayfinder/std", "blue?/std"]

[dependencies]
wayfinder.workspace = true
wayfinder-driver-core.workspace = true
interfaces.workspace = true
wayfinder-protos.workspace = true
wayfinder-server.workspace = true

async-trait = { workspace = true, optional = true }
anyhow.workspace = true
tracing.workspace = true
zerocopy.workspace = true
etherparse.workspace = true

tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

# `tokio`-only: builds the `Rylr998` link transport over a real serial port.
rylr998 = { workspace = true, features = ["link"], optional = true }
blue = { workspace = true, optional = true }
tokio-serial = { workspace = true, optional = true }
embedded-io-adapters = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }

[dev-dependencies]
# In-process RYLR998 simulator, so the reconnect/reconfigure behavior in
# `rylr998.rs` can be exercised deterministically without real hardware.
rylr998-sim = { path = "../rylr998-sim" }
