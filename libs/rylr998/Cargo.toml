[package]
name = "rylr998"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = ["link"]
# Bridge a `RylrClient` onto a Wayfinder mesh by implementing the `LinkT`
# mesh-interface trait.  Off by default so the bare LoRa driver stays
# dependency-light; enabling it pulls in `wayfinder` (for the `LinkT` trait and
# the mesh frame types) and `zerocopy`.  The impl uses the native `async fn`
# trait directly, so it works in a `no_std` executor.
link = ["dep:wayfinder", "dep:zerocopy", "dep:wayfinder-link-utils"]

[dependencies]
# Pinned directly (not workspace inheritance, which can't override
# default-features) so `default-features = false` keeps std off for both —
# thiserror still gates `impl core::error::Error` behind `std`, and tracing's
# `std` feature pulls in `once_cell/std`. Needed for this crate's `no_std` build.
thiserror = { version = "2.0.18", default-features = false }
embedded-io-async.workspace = true
heapless.workspace = true
tracing = { version = "0.1.44", default-features = false }

# Depended on by path (not workspace inheritance) so `default-features = false`
# keeps the bare `LinkT` trait available without pulling `alloc`/`std`.
wayfinder = { path = "../wayfinder", default-features = false, optional = true }
zerocopy = { workspace = true, optional = true }
# Shared small-MTU fragmentation/reassembly machinery (see
# `libs/wayfinder-link-utils`); only needed by the `link` feature's `frag`
# adapter.
wayfinder-link-utils = { path = "../wayfinder-link-utils", optional = true }

[dev-dependencies]
tokio-serial = "5.4"
anyhow = "1.0.102"
tracing-subscriber.workspace = true
tokio.workspace = true
embedded-io-adapters.workspace = true
embedded-io = "0.7.0"
rylr998-sim = { path = "../rylr998-sim" }
