[package]
name = "wayfinder-test"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
wayfinder.workspace = true
wayfinder-driver.workspace = true
# The std certificate authority, to mint certs for authenticated-mesh tests.
wayfinder-auth = { workspace = true, features = ["std"] }
interfaces.workspace = true

thiserror.workspace = true
zerocopy.workspace = true
embassy-sync.workspace = true
heapless.workspace = true
embedded-io-async.workspace = true
rand = { workspace = true, features = ["std"] }
tokio.workspace = true
serde.workspace = true
tracing.workspace = true
async-trait.workspace = true
anyhow.workspace = true
futures.workspace = true



[dev-dependencies]
tracing-subscriber.workspace = true
# `test-util` enables tokio's pausable clock (`#[tokio::test(start_paused)]`),
# so the Trickle-paced convergence test advances virtual time instantly instead
# of waiting out real timer granularity.
tokio = { workspace = true, features = ["test-util"] }
# A real RYLR998 driver + its in-process LoRa-air simulator, for the
# rylr998_integration_tests module — the one suite that drives an actual
# LinkT implementation instead of the channel-based Switch fabric.
rylr998 = { path = "../rylr998", features = ["link"] }
rylr998-sim = { path = "../rylr998-sim" }
