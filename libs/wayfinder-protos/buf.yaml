version: v2
modules:
  - path: protos
lint:
  use:
    - STANDARD
    - COMMENTS
  except:
    # GetNodeInfoRequest, GetRoutingTableRequest, GetLinkQualityTableRequest,
    # and AllInterfacesEgress are empty marker messages whose names are
    # already self-documenting; field-level comments would be noise.
    - COMMENT_FIELD
breaking:
  use:
    - FILE
