[package]
name = "wayfinder-protos"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
prost = { version = "0.13" , default-features = false, features = ["derive"] }
# Pinned directly (not workspace inheritance, which can't override
# default-features) so `default-features = false` keeps std off — tracing's
# `std` feature pulls in `once_cell/std`, breaking this crate's no_std build.
tracing = { version = "0.1.44", default-features = false }
# Optional: derive `serde::Serialize`/`serde::Deserialize` on the generated
# message types so hosts can move them across a JSON boundary — `wayfinderctl
# --output json` emits them, `wayfinder-web` also decodes them in the browser.
# Off by default so the no_std/embedded build pulls in no extra surface.
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[features]
# Enable `#[derive(serde::Serialize, serde::Deserialize)]` on every generated
# proto type.  Pulls in `serde/alloc` for the impls on `Vec<u8>`/`String`
# fields, since this crate is `no_std` + `alloc` (serde's `std`/`alloc` are off
# by default).
serde = ["dep:serde", "serde/alloc"]

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
# Test-only: `tests/serde_roundtrip.rs` drives the generated types through a
# real JSON encoder/decoder, which is the only way to check that both halves of
# the `serde` feature's derives hold.
serde_json = "1"
