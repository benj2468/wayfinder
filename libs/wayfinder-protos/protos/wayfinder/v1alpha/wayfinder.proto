// Wayfinder management API — package wayfinder.v1alpha
//
// Provides a request/response interface for querying the state of a running
// Wayfinder router (CentralRouter).  The API is transport-agnostic: it can be
// carried over TCP, Unix domain sockets, or UDP depending on the operator's
// deployment.  Stream transports use 4-byte big-endian length-prefixed framing;
// datagram transports (UDP) carry one message per datagram.
//
// Identifier encoding: all node identifiers are raw bytes whose length depends
// on the address family in use.  For 802.11 / Ethernet MAC addresses this is
// 6 bytes; for short LoRa mesh addresses it is 1 byte.  Consumers should treat
// these as opaque blobs and display them in the format appropriate for the
// deployment (e.g. colon-delimited hex for MACs).

syntax = "proto3";

package wayfinder.v1alpha;

// ── Requests ──────────────────────────────────────────────────────────────────

// Request for basic information about the local node.
// Returns a NodeInfo response.
message GetNodeInfoRequest {}

// Request a full snapshot of the BATMAN originator table.
// Returns a RoutingTable response containing one RoutingEntry per known
// destination in the mesh.
message GetRoutingTableRequest {}

// Request the per-(neighbor, interface) link-quality table maintained by
// the router.  Returns a LinkQualityTable response describing the
// EWMA-smoothed signal quality observed for each neighbor on each
// physical interface.
message GetLinkQualityTableRequest {}

// Request the current per-interface OGM emission schedule.  Returns an
// OgmSchedule response describing, for each mesh interface, the live OGM
// publish interval and the adaptive backoff bounds it moves between.
message GetOgmScheduleRequest {}

// Request a routing decision for a hypothetical packet to `destination`,
// mirroring what the router would compute on send.  Returns a
// ResolveRouteResponse with the next-hop neighbor and the egress
// interface that would be selected.  Returned as an ErrorResponse if the
// raw bytes cannot be parsed as a valid identifier for this deployment's
// address family.
message ResolveRouteRequest {
  // Raw destination identifier bytes.  Same encoding as NodeInfo.node_id.
  bytes destination = 1;
}

// Top-level request envelope.  Exactly one variant must be set; an empty
// request (no variant) is treated as a protocol error and returns an
// ErrorResponse.
message WayfinderRequest {
  // The specific query to execute against the local router.
  oneof request {
    // Query basic identity and capacity information for this node.
    GetNodeInfoRequest get_node_info = 1;

    // Query the full BATMAN originator (routing) table.
    GetRoutingTableRequest get_routing_table = 2;

    // Query the per-(neighbor, interface) link-quality table.
    GetLinkQualityTableRequest get_link_quality_table = 3;

    // Ask the router how it would route a packet to a given destination.
    ResolveRouteRequest resolve_route = 4;

    // Query the current per-interface adaptive OGM emission schedule.
    GetOgmScheduleRequest get_ogm_schedule = 5;
  }
}

// ── Responses ─────────────────────────────────────────────────────────────────

// Basic identity and capacity information for the local router node.
message NodeInfo {
  // Raw bytes of this node's mesh identifier.
  // Length is address-family dependent (6 bytes for MAC, 1 byte for u8 short
  // address).  Display as colon-delimited hex for MAC addresses.
  bytes node_id = 1;

  // Number of entries currently in the BATMAN originator table, i.e. the
  // number of remote nodes this router has a path to.
  uint32 num_originators = 2;
}

// Per-neighbor path metrics for a single path to an originator.
// The BATMAN engine tracks up to 4 alternate paths per destination; each is
// represented here.
message NeighborPath {
  // Raw bytes of the immediate neighbor (next-hop) through which this path
  // was learned.  Same encoding as NodeInfo.node_id.
  bytes neighbor_id = 1;

  // Transmission Quality (TQ) observed via this neighbor.  Range 0–255;
  // higher is better.  Decremented by 10 per hop as OGMs propagate.
  uint32 tq = 2;

  // Sequence number of the most recent OGM received via this neighbor.
  // Monotonically increasing; wraps at u32::MAX.
  uint32 last_seqno = 3;
}

// A single entry in the BATMAN originator table, describing how to reach one
// remote destination node.
message RoutingEntry {
  // Raw bytes of the ultimate destination node identifier.
  bytes destination = 1;

  // Raw bytes of the immediate next-hop neighbor to use for the best-known
  // path to destination.
  bytes next_hop = 2;

  // Best Transmission Quality seen across all paths to this destination.
  // Range 0–255; higher is better.
  uint32 tq = 3;

  // Sequence number of the most recent OGM received from this originator
  // (across all paths).
  uint32 last_seqno = 4;

  // Per-neighbor path breakdown.  Contains one entry for each neighbor
  // through which OGMs from this originator have been received, up to the
  // engine's path limit (currently 4).
  repeated NeighborPath paths = 5;
}

// Snapshot of the full BATMAN originator table at the time of the request.
message RoutingTable {
  // All known originators.  Empty if the router has not yet received any OGMs
  // (e.g. immediately after startup).
  repeated RoutingEntry entries = 1;
}

// A single row in the per-(neighbor, interface) link-quality table.  The
// router folds every received frame's physical-layer metrics into an
// exponentially-weighted moving average keyed on (neighbor, iface_idx)
// and uses that to bias the egress-interface decision toward the
// strongest radio path for each neighbor.
message LinkQualityEntry {
  // Raw bytes of the neighbor this row describes.  Same encoding as
  // NodeInfo.node_id.
  bytes neighbor_id = 1;

  // Index of the physical interface on which `neighbor_id` was observed.
  // Indices are assigned in the order interfaces are registered with the
  // CentralRouter and are stable for the lifetime of the process.
  uint32 iface_idx = 2;

  // EWMA-smoothed normalized quality on the 0–255 scale (matching
  // BATMAN's TQ convention).  Higher is better.
  uint32 ewma_quality = 3;

  // Number of received frames folded into the EWMA so far.  Saturates at
  // u32::MAX.  Useful for callers that want to weight or filter entries
  // by how much evidence backs the quality estimate.
  uint32 sample_count = 4;
}

// Snapshot of the full link-quality table at the time of the request.
message LinkQualityTable {
  // All known (neighbor, interface) pairs.  Empty if the router has not
  // yet received any frames with measurable metrics.
  repeated LinkQualityEntry entries = 1;
}

// The adaptive OGM emission schedule for a single mesh interface.  OGM
// emission is paced per interface by a Trickle timer: the interval doubles
// toward max_interval_ms while the local view of the topology is stable, and
// snaps back to min_interval_ms the instant an inconsistency is detected, so
// the mesh is near-silent at rest yet reconverges quickly on change.
message OgmScheduleEntry {
  // Index of the interface this schedule describes.  Indices are assigned in
  // the order interfaces are registered with the CentralRouter and match the
  // iface_idx used in LinkQualityEntry.
  uint32 iface_idx = 1;

  // The interval the interface is *currently* emitting OGMs at, in
  // milliseconds: the live publish period.  Observe it grow on successive
  // queries while the mesh is stable, and collapse back to min_interval_ms
  // after a topology change.
  uint32 current_interval_ms = 2;

  // The most aggressive (shortest) interval the timer resets to on a topology
  // change, in milliseconds.  The configured backoff floor.
  uint32 min_interval_ms = 3;

  // The quietest (longest) interval the doubling backoff is capped at, in
  // milliseconds.  The configured backoff ceiling.
  uint32 max_interval_ms = 4;
}

// Snapshot of the per-interface adaptive OGM emission schedule at the time of
// the request.
message OgmSchedule {
  // One entry per configured mesh interface, in registration order.  Empty if
  // no interface has been configured for OGM emission yet.
  repeated OgmScheduleEntry entries = 1;
}

// Marker payload indicating the router would flood a packet out of every
// interface (the egress decision used for broadcasts and for
// destinations with no metric information).
message AllInterfacesEgress {}

// Answer to a ResolveRouteRequest: the next-hop neighbor and the egress
// interface the router would select for the requested destination right
// now.  The values reflect the in-memory routing and link-quality state
// at the time of the request and may change as new OGMs and frames are
// received.
message ResolveRouteResponse {
  // Immediate next-hop neighbor that would receive the packet.  Mirrors
  // the `lookup_route(dest).unwrap_or(dest)` fallback inside
  // CentralRouter::handle_local — when no BATMAN route is known this is
  // the original destination, since the router will try to reach it
  // directly.
  bytes next_hop = 1;

  // The egress interface the router would pick.  Unset when no link
  // quality or last-seen interface data exists yet for this destination
  // — the router would have nothing to send on in that state.
  oneof egress {
    // Flood out every interface — used for broadcast destinations.
    AllInterfacesEgress all_interfaces = 2;

    // Send out a specific physical interface, indexed in registration
    // order on the CentralRouter.
    uint32 interface_index = 3;
  }
}

// Returned when the router cannot fulfill a request.
message ErrorResponse {
  // Human-readable description of what went wrong.
  string message = 1;
}

// Top-level response envelope.  Always contains exactly one variant.
message WayfinderResponse {
  // The result of the corresponding WayfinderRequest.
  oneof response {
    // Response to GetNodeInfoRequest.
    NodeInfo node_info = 1;

    // Response to GetRoutingTableRequest.
    RoutingTable routing_table = 2;

    // Returned for malformed or unrecognised requests.
    ErrorResponse error = 3;

    // Response to GetLinkQualityTableRequest.
    LinkQualityTable link_quality_table = 4;

    // Response to ResolveRouteRequest.
    ResolveRouteResponse resolve_route = 5;

    // Response to GetOgmScheduleRequest.
    OgmSchedule ogm_schedule = 6;
  }
}
