// Wayfinder management API — package wayfinder.v1alpha
//
// Provides a request/response interface for querying the state of a running
// Wayfinder router (CentralRouter).  The API is transport-agnostic: it can be
// carried over TCP, Unix domain sockets, or UDP depending on the operator's
// deployment.  Stream transports use 4-byte big-endian length-prefixed framing;
// datagram transports (UDP) carry one message per datagram.
//
// Identifier encoding: all node identifiers are raw bytes whose length depends
// on the address family in use.  For 802.11 / Ethernet MAC addresses this is
// 6 bytes; for short LoRa mesh addresses it is 1 byte.  Consumers should treat
// these as opaque blobs and display them in the format appropriate for the
// deployment (e.g. colon-delimited hex for MACs).

syntax = "proto3";

package wayfinder.v1alpha;

// An empty payload, used as the response to a request that only succeeds or
// fails (e.g. SetAuthRequest) and carries no data back.
message Empty {}

// ── Requests ──────────────────────────────────────────────────────────────────

// Request for basic information about the local node.
// Returns a NodeInfo response.
message GetNodeInfoRequest {}

// Request a full snapshot of the BATMAN originator table.
// Returns a RoutingTable response containing one RoutingEntry per known
// destination in the mesh.
message GetRoutingTableRequest {}

// Request the per-(neighbor, interface) link-quality table maintained by
// the router.  Returns a LinkQualityTable response describing the
// EWMA-smoothed signal quality observed for each neighbor on each
// physical interface.
message GetLinkQualityTableRequest {}

// Request the current per-interface participation-feature state: the tx/rx
// OGM and data gates and keep-alive cadence set via SetConfig's
// LinkFeatures (or left at the interface's startup default).  Returns a
// LinkFeaturesTable response — the read counterpart to that mutation.
message GetLinkFeaturesTableRequest {}

// Request the current per-interface OGM emission schedule.  Returns an
// OgmSchedule response describing, for each mesh interface, the live OGM
// publish interval and the adaptive backoff bounds it moves between.
message GetOgmScheduleRequest {}

// Request the current per-interface throughput estimates.  Returns a
// Throughput response with one entry per mesh interface plus the node-wide
// totals.  The values are smoothed instantaneous rates evaluated at the time
// of the request, not cumulative counters.
message GetThroughputRequest {}

// Request the node's aggregate health and topology metrics.  Returns a
// NodeMetrics response summarising uptime, neighbour count, bounded-table
// occupancy, and the transmission-quality / path-diversity distribution across
// the mesh — the signals an application developer uses to infer the state of
// the underlying mesh from outside the router.
message GetMetricsRequest {}

// Query this node's mesh authentication / security posture: whether auth is
// enabled, the mesh and this node's own certificate, the revocation count, and
// the per-originator verification/expiry/revocation state.  An empty request.
message GetSecurityStatusRequest {}

// Request the current per-neighbor keep-alive heartbeat liveness table.
// Returns a KeepAliveTable response with one entry per neighbor this node has
// heard at least one heartbeat from — the direct-link liveness signal used to
// deprioritize (not evict) a route relayed through a neighbor that has gone
// quiet, faster than OGM-interval staleness alone would notice. A neighbor
// never heard from at all has no entry (opt-in by observation), so this
// table's emptiness does not distinguish "no keep-alive-enabled neighbors"
// from "none have ever sent one yet".
message GetKeepAliveTableRequest {}

// The security posture of one originator, as this node sees it.
message NodeSecurity {
  // The originator's node MAC (raw bytes).
  bytes node_id = 1;

  // Whether this node holds a verified membership certificate for the
  // originator: its OGM signature chained to our trust anchor.  False means we
  // have a route to it but no authenticated identity (e.g. auth disabled, or no
  // signed OGM accepted yet).
  bool verified = 2;

  // The originator certificate's expiry (unix seconds), when `verified`.  Zero
  // when not verified.
  uint64 cert_not_after = 3;

  // Whether this node currently holds a revocation for the originator (its
  // frames are dropped mesh-wide).
  bool revoked = 4;

  // When the revocation stops being enforced (unix seconds), when `revoked`;
  // zero otherwise.  This node drops the record at that instant and the
  // originator disappears from this list, so it is the answer to "how long
  // will this keep reading as revoked?".  Reported because it is nowhere else:
  // a revocation evicts the cached certificate the row would otherwise be
  // dated by, leaving `cert_not_after` zero.
  uint64 revocation_not_after = 5;
}

// Answer to a GetSecurityStatusRequest: the mesh-level crypto header plus a
// per-originator security row.  When `auth_enabled` is false the remaining
// header fields are zero/empty and `nodes` carries no verification state.
message GetSecurityStatusResponse {
  // Whether mesh authentication is enabled on this node.
  bool auth_enabled = 1;

  // The mesh id this node authenticates for (from its trust anchor).  Zero when
  // auth is disabled.
  uint32 mesh_id = 2;

  // This node's own certificate MAC (raw bytes); empty when auth is disabled.
  bytes node_mac = 3;

  // This node's own certificate expiry (unix seconds); zero when auth disabled.
  uint64 cert_not_after = 4;

  // The number of revocations this node currently holds.
  uint32 revocation_count = 5;

  // One entry per originator with a known security posture.
  repeated NodeSecurity nodes = 6;

  // Whether this node fails closed: while true and no membership cert is
  // installed, the node stays inert on the mesh (see NodeInfo.auth_locked).
  // Settable at runtime via SetConfig's RuntimeConfig.require_auth.
  bool require_auth = 7;

  // Whether this node's OGMs carry an 8-byte cert fingerprint instead of the
  // full membership cert.  Settable at runtime via SetConfig's
  // RuntimeConfig.lazy_cert_distribution.
  bool lazy_cert_distribution = 8;

  // The enrollment policy in force, present only on a node running in
  // provider (certificate-authority) mode.  Absent on a plain member, which
  // has no enrollment policy to report or to set.
  EnrollmentPolicyStatus enrollment = 9;

  // This node's own Ed25519 identity public key (32 bytes), which its OGM
  // signatures are verified against and which terminates its management TLS.
  // Reported whether or not auth is enabled: an un-enrolled node still has an
  // identity, and this is what a client enrolling it on its behalf puts in the
  // CSR, so the certificate that comes back is one this node can actually use.
  // Empty only on a node with no identity at all.
  bytes own_ed_pubkey = 10;

  // This node's own X25519 public key (32 bytes), used to derive the pairwise
  // keys that tag its frames.  Reported on the same terms as own_ed_pubkey and
  // bound into the same CSR.
  bytes own_x_pubkey = 11;
}

// The enrollment policy a provider-mode node is currently applying, as
// reported by GetSecurityStatus.  The read counterpart to the
// EnrollmentPolicy message SetConfig accepts.
message EnrollmentPolicyStatus {
  // Field 1 carried the same posture the other way round, as
  // `require_approval`.  It was replaced rather than renamed in place because
  // the meaning inverted: a peer reading the old name off this number would
  // read every posture backwards, and reporting a provider that signs for
  // anyone as one that holds requests for review is the worst direction for
  // that mistake to go.  A new number makes a version mismatch read as "not
  // reported" instead.
  reserved 1;
  reserved "require_approval";

  // Whether a submitted CSR is signed on submission, rather than parked as
  // pending until an operator approves it.  False is the closed posture and the
  // default a provider gets by saying nothing.
  bool auto_approve = 5;

  // The validity window applied to issued certificates, in seconds.
  uint64 cert_ttl_secs = 2;

  // Whether a shared enrollment token is configured, so a CSR must present a
  // matching value.  Whether one is required is all this message says; the
  // value is handed out only by RevealEnrollmentToken, one request at a time.
  bool enrollment_token_set = 3;

  // Field 4 carried the token itself.  It was removed because this message is
  // polled: a dashboard asks for it once a second, so the secret crossed the
  // wire, entered a browser and reached anything that formats this type
  // continuously, for the sake of an operator reading it perhaps twice in the
  // life of a mesh.  RevealEnrollmentToken now hands it over on request, which
  // is also what makes each disclosure a discrete, logged act.
  reserved 4;
  reserved "enrollment_token";
}

// Ask a provider-mode node for the shared enrollment token it is applying.
//
// Split from GetSecurityStatus because that request is polled and this answer
// is a secret: a value that only travels when someone asks for it can be
// logged as a disclosure, while one riding a poll cannot be told apart from
// the traffic it rides on.  Reachable only by a client authenticated as an
// admin or as this node itself — exactly the clients that may already replace
// or clear the token through SetConfig, so what is disclosed confers nothing
// they did not have.  An enrollment-tier connection cannot reach it at all
// (see wayfinder-server's authz::permits).
message RevealEnrollmentTokenRequest {}

// The admission secret a provider-mode node is applying, if any.
//
// A oneof rather than a string plus a flag: "no token is required" and "a
// token is required whose value is the empty string" are different states, and
// proto3's non-optional string cannot tell them apart.
message RevealEnrollmentTokenResponse {
  // Which admission rule is in force.
  oneof admission {
    // No token is required: a CSR is admitted on the policy's other terms
    // (operator approval, or nothing at all).
    Empty open = 1;

    // The token a joining node must present.  Never empty.
    string token = 2;
  }
}

// Request recent log records from the node's bounded in-memory ring.
//
// This is how a node's logs are read without a debug probe attached — on a
// board with no RTT reader, the only way at all.  Polled rather than streamed:
// the management protocol is strictly one request to one response, and a poll
// also lets a client attach *after* something went wrong and still see it.
//
// Records are numbered by a monotonic `seq` starting at 0 on boot.  A client
// passes the `next_seq` it was last handed and sees each record exactly once;
// LogRecords.dropped reports what fell out of the ring in between.
message GetLogsRequest {
  // Return records from this sequence number onward.  Pass 0 on a first poll
  // to get everything still retained, then the previous response's `next_seq`.
  uint64 since_seq = 1;

  // Maximum records to return in this batch.  0 means the node's default
  // batch size — a client that did not specify one wants records, not an
  // empty answer.
  uint32 max_records = 2;
}

// Change which log records the node emits, at runtime, across every sink it
// writes to (a board's RTT channel and its log ring; a host node's console and
// its log ring).  Applied in memory only — it does not persist across a
// restart.
//
// Answered with a LogFilter carrying the spec now in force.  A spec that fails
// to parse is answered with an ErrorResponse and *does not* change the filter:
// an operator typo must never blind a node.
message SetLogLevelRequest {
  // A RUST_LOG-style directive list: comma-separated `level`,
  // `target=level`, or bare `target` (meaning trace for that target), where a
  // level is one of off/error/warn/info/debug/trace.  Targets match on module
  // path prefix at module boundaries, and the longest match wins.  An empty
  // string restores the node's default.
  //
  // EnvFilter's span and field extensions (`target[span{field=value}]=level`)
  // are not supported and are rejected rather than reinterpreted.
  string directives = 1;
}

// The verbosity of a single log record.
enum LogLevel {
  // Unset — never emitted by a node; present because proto3 enums must have a
  // zero value.
  LOG_LEVEL_UNSPECIFIED = 0;

  // A failure an operator must act on, originating in the reporting node.
  LOG_LEVEL_ERROR = 1;

  // Unexpected but handled, worth operator attention.
  LOG_LEVEL_WARN = 2;

  // A lifecycle or topology event an observer wants.
  LOG_LEVEL_INFO = 3;

  // A developer-facing state transition.
  LOG_LEVEL_DEBUG = 4;

  // Per-frame/packet flow — the bulk of the records.
  LOG_LEVEL_TRACE = 5;
}

// One log record retained by the node.
message LogRecord {
  // Monotonic position in this node's log stream, starting at 0 on boot.
  uint64 seq = 1;

  // Milliseconds since the node booted, at the moment the record was emitted.
  // Uptime rather than wall-clock time because a board has no RTC and no
  // notion of the epoch, and because it is what correlates with the mesh's own
  // timers.
  uint64 uptime_ms = 2;

  // The record's verbosity.
  LogLevel level = 3;

  // The emitting module path (e.g. `wayfinder::router`), truncated by the node
  // if unusually long.
  string target = 4;

  // The rendered message and its structured fields.  Never payload bytes: this
  // project's logging rules permit only metadata (macs, lengths, seqnos) in a
  // record, so a log read over the management API discloses no more than a
  // routing-table query does.
  string message = 5;
}

// Answer to a GetLogsRequest: a batch of records plus where to resume.
message LogRecords {
  // The matching records, oldest first.
  repeated LogRecord records = 1;

  // The `since_seq` to pass on the next poll to resume exactly where this
  // batch ended.
  uint64 next_seq = 2;

  // How many records the caller missed: those between the `since_seq` it asked
  // for and the oldest the node still retains.  Zero whenever the caller kept
  // up.  Reported so a gap in the stream is visible as a gap, rather than the
  // record numbering quietly closing over it.
  uint64 dropped = 3;

  // The filter spec currently in force, in SetLogLevelRequest.directives
  // format.  Carried on every batch — rather than requiring a separate query —
  // so a client polling for records can always show what is actually being
  // recorded, including the node's startup filter it never set itself, and
  // including a change made by some other client.
  string filter = 4;
}

// Answer to a SetLogLevelRequest: the filter now in force.
message LogFilter {
  // The directive spec currently applied, echoed as the node stored it.
  string directives = 1;
}

// Read the node's alarm board: the bounded set of conditions it currently
// believes are wrong.
//
// Where GetLogs serves a stream of moments, this serves latched *conditions*.
// An alarm survives the burst that caused it — a flood is precisely the load
// that rolls the log ring over in seconds, so the evidence of the flood is
// what destroys the record of it — and it costs O(1) in the number of
// observations rather than one record per observation.
//
// Polled, like GetLogs and for the same reason: the management protocol is
// strictly one request to one response, and a poll lets a client attach after
// something went wrong and still see it.
message GetAlarmsRequest {}

// How bad a condition is, and — through the node's hold window — how long the
// node keeps asserting it after the last observation before deciding it has
// stopped.
enum AlarmSeverity {
  // Unset — never emitted by a node; present because proto3 enums must have a
  // zero value.
  ALARM_SEVERITY_UNSPECIFIED = 0;

  // Worth recording, not worth waking anyone: unusual, but with a benign
  // explanation more often than not.
  ALARM_SEVERITY_INFO = 1;

  // Something is wrong and an operator should look: the mesh is still carrying
  // traffic, but not the way it was configured to.
  ALARM_SEVERITY_WARNING = 2;

  // Something is wrong now and is degrading or attacking the mesh.
  ALARM_SEVERITY_CRITICAL = 3;
}

// What kind of condition an alarm reports.
//
// A closed enum rather than a free-form string: the set of things a node can
// flag is a design decision, not caller data, and a fixed set is what lets a
// client render, group and threshold alarms it has never seen.  Numbered from
// the node's own stable alarm codes rather than declaration order, so a
// variant can be added without renumbering the rest.
enum AlarmKind {
  // Unset — never emitted by a node.  A client that decodes this is talking to
  // a newer node holding a condition this build has no name for; render the
  // row as unknown rather than hiding it.
  ALARM_KIND_UNSPECIFIED = 0;

  // Frames are arriving from a source that fails authentication, in volume.
  ALARM_KIND_UNAUTHENTICATED_TRAFFIC = 1;

  // A source or interface is offering frames far faster than this mesh's
  // configured cadence explains.
  ALARM_KIND_TRAFFIC_FLOOD = 2;

  // Repeated management-API authentication failures — the mesh's
  // administrative front door being tried.
  ALARM_KIND_MANAGEMENT_AUTH_FAILURES = 3;

  // An OGM was seen whose sequence number this node has already processed: the
  // signature of a replay rather than a fresh advertisement.
  ALARM_KIND_OGM_REPLAY = 4;

  // Traffic from a peer holding a certificate this node knows to be revoked.
  ALARM_KIND_REVOKED_PEER = 5;

  // A link is failing I/O persistently rather than transiently — the radio or
  // its transport is not merely busy.
  ALARM_KIND_LINK_ERRORS = 6;

  // A bounded table is at capacity and evicting, so the node is now forgetting
  // state it would otherwise have kept.
  ALARM_KIND_TABLE_SATURATION = 7;
}

// One latched condition the node is holding.
//
// Identified by (kind, subject): every raise of that pair folds into this one
// row rather than adding another, which is what keeps a flood from becoming a
// flood of alarms.  `count` is the condition's magnitude, where the row itself
// is only its existence.
message Alarm {
  // What kind of condition this is.
  AlarmKind kind = 1;

  // The worst severity yet observed for this condition.  Ratchets up over the
  // condition's life and never down: a later, milder observation must not talk
  // the node down from what it already saw.
  AlarmSeverity severity = 2;

  // Uptime in milliseconds at the first raise: when the condition started,
  // preserved across every later observation.  The same clock as
  // LogRecord.uptime_ms, so an alarm correlates with the records around it.
  uint64 first_ms = 3;

  // Uptime in milliseconds at the most recent raise.  What `active` measures
  // from.
  uint64 last_ms = 4;

  // How many raises have folded into this row, saturating.
  uint32 count = 5;

  // The most recent observation, rendered by the detector and truncated by the
  // node.  Metadata only — rates, counts, windows, identifiers — never payload
  // bytes, on the same rule as a log record.
  string detail = 6;

  // Whether the node is still asserting this condition as of Alarms.now_ms:
  // whether it has been re-raised within its severity's hold window.  Computed
  // by the node so a client needs no clock of its own.
  //
  // A false here does not mean the row is gone.  Nothing expires on a timer —
  // the board latches, so an operator who polls after a burst ended still
  // learns it happened.
  bool active = 7;

  // Who or what the condition is about.  Unset when it is about the node as a
  // whole rather than any one peer or interface.
  oneof subject {
    // Raw identifier bytes of the peer this is about.  Address-family
    // agnostic and at most 8 bytes, so it holds a 6-byte MAC, a 1-byte short
    // address, or the leading bytes of a key fingerprint equally well.  Same
    // rendering as NodeInfo.node_id.
    bytes node_id = 8;

    // Index of the interface this is about, in the same numbering as
    // InterfaceThroughput.interface_index.
    uint32 interface_index = 9;
  }
}

// Answer to a GetAlarmsRequest: the whole board as one snapshot.
message Alarms {
  // Every alarm the board holds, worst first and — among equal severities —
  // most recent first.  Ordered by the node rather than the client so every
  // reader of a node agrees on what is at the top.
  repeated Alarm alarms = 1;

  // How many raises the board's capacity policy has refused or evicted since
  // boot.  Reported so a gap is visible as a gap, exactly as
  // LogRecords.dropped is.
  uint64 dropped = 2;

  // Node uptime in milliseconds at the moment this snapshot was taken.  What
  // Alarm.active was evaluated against, and what a client renders an alarm's
  // age from without needing a clock the node shares.
  uint64 now_ms = 3;
}

// Request a routing decision for a hypothetical packet to `destination`,
// mirroring what the router would compute on send.  Returns a
// ResolveRouteResponse with the next-hop neighbor and the egress
// interface that would be selected.  Returned as an ErrorResponse if the
// raw bytes cannot be parsed as a valid identifier for this deployment's
// address family.
message ResolveRouteRequest {
  // Raw destination identifier bytes.  Same encoding as NodeInfo.node_id.
  bytes destination = 1;
}

// Update the authentication configuration on the node, enabling (or replacing)
// opt-in mesh authentication at runtime.  The three fields are the raw bytes of
// the same material wayfinder-tap otherwise loads from disk; the node builds its
// OgmAuth from them.  Because the seed is the node's private identity, this is a
// privileged operation — restrict who can reach the management endpoint.
//
// Persisted on the same terms as SetConfig: a node configured with a runtime
// state path writes the installed identity into it (restricted to the owner,
// since it carries the seed) and re-installs it on next boot, so a node
// enrolled at runtime does not silently revert to an unauthenticated one after
// a restart.  A node without such a path installs the identity in memory only.
message SetAuthRequest {
  // The node's 32-byte Ed25519 identity seed, as raw bytes.  Secret: it *is*
  // the node's identity.
  //
  // May be empty, which means "certify the identity I already have": the node
  // keeps its current seed and installs only the certificate and trust anchor.
  // That is what online enrollment sends, and it is not merely a convenience —
  // a node's MAC is derived from its seed and read once at startup, so handing
  // it a *new* identity while it runs leaves it signing frames under a
  // certificate bound to a MAC its peers do not know it by, until it restarts.
  // Certifying the existing key changes nothing about who the node is.
  bytes seed = 1;
  // The node's membership certificate, as raw `MembershipCert` bytes (signed
  // by the mesh root).
  bytes cert = 2;
  // The mesh trust anchor, as raw `TrustAnchor` bytes (the mesh id and root
  // public key the node verifies certificates against).
  bytes trust_anchor = 3;
}

// The first message a client sends on a management connection, presenting its
// identity so the transport can authorize the connection.  The connection's TLS
// handshake has already proven possession of the client's raw Ed25519 public
// key (RFC 7250); this message supplies the membership certificate that binds
// that key to a mesh admin identity.  The transport verifies the cert against
// the trust anchor, confirms it matches the handshake key, and admits the
// connection only for a non-revoked admin.  A successful authentication is
// answered with EmptyResponse; a rejected one with ErrorResponse, after which
// the connection is closed.
message AuthenticateRequest {
  // The client's membership certificate as raw `MembershipCert` bytes.  Empty on
  // an un-enrolled node being bootstrapped: there is no cert yet, so admission
  // rests solely on the TLS handshake key matching the node's own identity key.
  bytes cert = 1;
}

// A single mesh interface's Trickle/OGM emission bounds, as set via
// SetConfig.  Mirrors OgmScheduleEntry's min_interval_ms/max_interval_ms, but
// as a request to install them rather than a report of what's installed.
// Replaces the interface's Trickle timer outright: any backoff already grown
// toward the old max_interval_ms is discarded and the interface resets to
// firing near min_interval_ms — expect a burst of OGMs shortly after this is
// applied to a live interface.
message TrickleConfig {
  // Index of the interface to reconfigure, in registration order (same
  // indexing as OgmScheduleEntry.iface_idx).  Must refer to an interface
  // already registered by the node's startup configuration; SetConfig cannot
  // provision a new interface that doesn't already exist.
  uint32 iface_idx = 1;

  // The new backoff floor, in milliseconds: the most aggressive interval the
  // timer resets to on a topology change.
  uint32 min_interval_ms = 2;

  // The new backoff ceiling, in milliseconds: the quietest interval the
  // doubling backoff is capped at.
  uint32 max_interval_ms = 3;
}

// A single mesh interface's participation features, as set via SetConfig: one
// send gate and one receive gate for each of the two planes — the OGM control
// plane (topology) and the data plane (unicast, multicast, and broadcast
// together).  Each flag is independently optional — an unset flag leaves that
// capability unchanged from the interface's current setting, so a caller can
// flip one gate (e.g. silence OGM tx on a link a ground station only fronts)
// without restating the others.  Takes effect on the next frame.
message LinkFeatures {
  // Index of the interface to reconfigure, in registration order (same indexing
  // as OgmScheduleEntry.iface_idx).  Must refer to an interface already
  // registered by the node's startup configuration; SetConfig cannot provision
  // a new interface that doesn't already exist.
  uint32 iface_idx = 1;

  // Send OGMs (this node's own, and re-flooded ones) onto this link, announcing
  // topology on it.  False keeps the node OGM-silent on the link.
  optional bool tx_ogm = 2;

  // Accept OGMs arriving on this link and learn routes from them (the link may
  // become a next hop).  False drops inbound OGMs, so the node is never routed
  // through this link.
  optional bool rx_ogm = 3;

  // Send data-plane traffic (unicast, multicast, and broadcast) onto this link.
  // False makes the link transmit no data.  Because it is this node's ability to
  // deliver to what is behind the link, it also governs route re-advertisement:
  // an originator learned on a tx_data-off link is kept locally for visibility
  // but not re-flooded, so the node never advertises a route it cannot honor.
  optional bool tx_data = 4;

  // Accept data-plane traffic (unicast, multicast, and broadcast) arriving on
  // this link (to deliver, forward, or bridge).  False drops inbound data.
  optional bool rx_data = 5;

  // Send keep-alive heartbeats on this link, if present. Unlike the plain
  // bool flags above this needs a third state alongside "leave unchanged"
  // (the field absent) and "on" (a cadence), so it is a oneof rather than an
  // optional scalar: absent leaves the current schedule as it is, disabled
  // tears it down, and interval_ms arms (or re-arms) it at that cadence.
  oneof tx_keepalive_update {
    // Disable keep-alive transmission on this link.
    bool tx_keepalive_disabled = 6;

    // Arm (or re-arm) keep-alive transmission on this link at this cadence,
    // in milliseconds.
    uint64 tx_keepalive_interval_ms = 7;
  }
}

// The node's live-editable runtime configuration.  Each field is
// independently optional: an unset field leaves that piece of configuration
// unchanged.  New runtime-editable knobs are added here as additional
// fields, rather than as new RPCs.
message RuntimeConfig {
  // Present to update the Trickle/OGM bounds for one mesh interface.
  TrickleConfig trickle = 1;

  // Present to switch lazy cert distribution on or off: whether this node's
  // OGMs carry an 8-byte cert fingerprint (true) instead of the full
  // membership cert (false), fetching the full cert on demand when a peer
  // can't resolve the fingerprint. A flag-day, wire-incompatible switch with
  // un-upgraded auth nodes — see the design doc before flipping it on a live
  // mesh.
  optional bool lazy_cert_distribution = 2;

  // Present to update the participation features for one mesh interface.
  LinkFeatures link_features = 3;

  // Present to switch the fail-closed gate on or off: whether this node stays
  // inert on the mesh while it has no membership cert installed (see
  // NodeInfo.auth_locked).  Turning it on while the node has no cert takes it
  // off the mesh immediately, so a caller that is not certain a cert is
  // installed should read GetSecurityStatus.auth_enabled first.
  optional bool require_auth = 4;

  // Present to update this node's enrollment policy.  Rejected with an
  // ErrorResponse on a node that is not running in provider mode, which has
  // no enrollment policy to change.
  EnrollmentPolicy enrollment = 5;
}

// A provider-mode node's enrollment policy, as set via SetConfig: how a node
// asking to join the mesh is admitted.  Each field is independently optional —
// an unset field leaves that piece of the policy unchanged — so a caller can
// close open enrollment without also restating the certificate lifetime.
//
// Applies to requests submitted after it takes effect; certificates already
// issued keep the lifetime they were signed with, and CSRs already held keep
// their place in the approval queue.
message EnrollmentPolicy {
  // Field 1 carried the same posture the other way round, as
  // `require_approval`; see EnrollmentPolicyStatus for why the inversion took
  // a new number instead of a rename.  On this side the hazard is worse than a
  // misread: a peer setting the old name would open a provider it meant to
  // close.
  reserved 1;
  reserved "require_approval";

  // Sign a submitted CSR on submission (true), rather than parking it as
  // pending until an operator approves it (false).
  optional bool auto_approve = 5;

  // The validity window to apply to certificates issued from now on, in
  // seconds.  Keep it short — passive expiry is the primary revocation
  // mechanism.  Zero is rejected: it would issue certificates that are already
  // expired, taking every newly enrolled node off the mesh on arrival.
  optional uint64 cert_ttl_secs = 2;

  // The shared enrollment token needs a third state alongside "leave
  // unchanged" (the field absent) and "require this value", so it is a oneof
  // rather than an optional string: an empty string is a legitimate-looking
  // value that would otherwise be indistinguishable from clearing the token,
  // and the two mean opposite things — one gates enrollment on a secret
  // nobody can present, the other opens it to everyone.
  oneof enrollment_token_update {
    // Clear the token, so enrollment is open (TOFU) to any node that can
    // reach this provider.  Only the value `true` clears it; `false` is
    // rejected rather than silently treated as "leave unchanged", so a
    // default-constructed message can never open enrollment by accident.
    bool enrollment_token_cleared = 3;

    // Require this value on a submitted CSR.  Rejected when empty — an empty
    // token would gate enrollment on a secret no client can present, which is
    // never what a caller means.
    string enrollment_token = 4;
  }
}

// Apply a partial update to the node's runtime configuration.  Only the
// fields present in `config` are changed; unset fields are left as they are.
// Answered with an Empty response on success, or an ErrorResponse if a present
// field fails validation (e.g. an out-of-range interface index, or
// TrickleConfig.min_interval_ms exceeding max_interval_ms).
//
// Whether an accepted update survives a restart is the *node's* decision, not
// the caller's: a node configured with a runtime state path persists what it
// accepts here and re-applies it over its startup configuration on next boot,
// and one without such a path applies the update in memory only.  A caller
// that needs to know which happened reads NodeInfo.runtime_config_active,
// rather than assuming either way.
//
// An update is persisted only once it has been accepted and applied, so a
// rejected field is never durably remembered.  A failure to persist fails the
// whole request — the node does not report success for a change it could not
// make durable, since the caller would then believe a setting is in force that
// the next restart quietly discards.
message SetConfigRequest {
  // The partial configuration update to apply.
  RuntimeConfig config = 1;
}

// Fetch the mesh trust anchor a node verifies certificates against.  Served by
// a node running in provider (certificate-authority) mode; an enrolling member
// uses it to learn the anchor without trusting whatever it was handed
// out-of-band.  Returns an ErrorResponse on a node that is not a provider.
message GetTrustAnchorRequest {}

// A certificate-signing request: an enrolling node asks the provider to issue a
// membership certificate binding its MAC to its freshly generated public keys.
// The provider (the only holder of the mesh root key) validates and signs it, so
// the root key never leaves the provider.  Served only by a provider node.
message SubmitCsrRequest {
  // The enrolling node's MAC, as raw bytes (same encoding as NodeInfo.node_id).
  // The issued certificate is bound to this MAC.
  bytes node_mac = 1;

  // The node's Ed25519 identity public key (32 bytes) — what its OGM signatures
  // are verified against.
  bytes ed_pubkey = 2;

  // The node's X25519 public key (32 bytes) — used to derive pairwise
  // data-plane keys.
  bytes x_pubkey = 3;

  // Optional shared enrollment token.  When the provider is configured with a
  // token, a request must present the matching value or it is rejected; when the
  // provider has no token configured this field is ignored (open enrollment).
  string enrollment_token = 4;
}

// Request to revoke a node from the mesh.  The provider signs a revocation
// record for the MAC and floods it across the mesh (the active counterpart to
// passive certificate expiry).  Served only by a provider node; answered with an
// Empty response on success.
message RevokeNodeRequest {
  // The MAC of the node to revoke, as raw bytes.
  bytes node_mac = 1;
}

// List the membership certificates this provider has issued (observability for
// the operator).  Served only by a provider node.
message ListCertsRequest {}

// List the certificate-signing requests currently awaiting operator approval.
// A provider configured to require approval parks each incoming CSR here until
// an operator approves or denies it; this lets the operator (via wayfinderctl or
// the TUI) see what is waiting.  Served only by a provider node.
message ListPendingCsrsRequest {}

// Approve a pending certificate-signing request, identified by the enrolling
// node's MAC.  The provider signs the certificate immediately; the enrolling
// node collects it on its next SubmitCsr poll.  Served only by a provider node;
// answered with an Empty response on success, or an error if no CSR for that MAC
// is pending.
message ApproveCsrRequest {
  // The MAC of the pending CSR to approve, as raw bytes.
  bytes node_mac = 1;
}

// Deny (drop) a pending certificate-signing request, identified by the enrolling
// node's MAC.  The request is removed from the pending list and no certificate
// is issued; a subsequent SubmitCsr from that node would create a fresh pending
// entry.  Served only by a provider node; answered with an Empty response on
// success, or an error if no CSR for that MAC is pending.
message DenyCsrRequest {
  // The MAC of the pending CSR to deny, as raw bytes.
  bytes node_mac = 1;
}

// Ask the provider for what this node needs to join the coordination-server
// managed VPN: the login server to register against, and a freshly minted
// single-use pre-authentication key.
//
// Carries no fields on purpose.  The credential is minted *for the identity
// that asked*, which the management transport already knows from the
// TLS-authenticated membership certificate on the connection — so there is
// nothing here for a caller to assert, and no MAC it could name but not hold.
// That is the whole reason this is a second request rather than extra fields on
// CsrIssued: SubmitCsr runs on the enrollment tier, where every field is
// self-asserted and bound to nothing about the connection.
//
// Reachable only by an enrolled device (a certificate carrying the member
// capability, bound to this connection's handshake key).  Not by an operator's
// session certificate, however privileged: the response is a credential scoped
// to a device identity, and a person's session is not one.
message GetVpnEnrollmentRequest {}

// Answer to a GetVpnEnrollmentRequest: everything needed for an unattended
// `tailscale up`, and nothing that outlives its single use.
message GetVpnEnrollmentResponse {
  // Base URL of the self-hosted coordination server to register against,
  // passed as --login-server.  Always the mesh's own instance, never a public
  // default: pointing it elsewhere would leak an isolated network's
  // coordination metadata to third-party infrastructure.
  string vpn_login_server = 1;

  // A single-use, short-TTL pre-authentication key, minted during this call and
  // never persisted by the provider.  Grants network reachability on the
  // tunnel, not mesh membership — a holder still cannot originate or forward
  // frames the mesh accepts without a valid membership certificate.
  string vpn_preauth_key = 2;
}

// List the VPN peers registered with the coordination server, for operator
// visibility.  Served only by a provider node with VPN integration configured;
// answered from the coordination server's own node list at request time, so
// there is nothing stale for the provider to keep in sync.
message ListVpnPeersRequest {}

// One VPN peer as the coordination server reports it, joined back to the mesh
// identity that enrolled it.
message VpnPeerStatus {
  // The mesh MAC this peer enrolled under, as raw bytes.  Recovered primarily
  // from the name of the Headscale user that owns this node — set once at
  // enrollment as the MAC in lowercase hex, and immune to an operator later
  // renaming the node's display name — falling back to raw_hostname only for
  // a peer with no owning user (registered by hand).  This join is what makes
  // the mapping possible without the provider persisting a table of its own.
  // Empty when neither is a MAC, in which case raw_hostname carries what was
  // actually found.
  bytes node_mac = 1;

  // The hostname as registered with the coordination server, verbatim.  Kept
  // alongside the parsed MAC so a peer that does not follow the naming
  // convention is still listed and still revocable, rather than silently
  // dropped from the operator's view.
  string raw_hostname = 2;

  // The address the coordination server assigned this peer, as a string
  // (the tunnel's own address family, not a mesh address).  This is what a
  // UDP mesh link on that host binds to or points at.
  string tailscale_ip = 3;

  // Whether the coordination server currently considers this peer connected.
  bool online = 4;

  // When this peer was last seen by the coordination server (unix seconds), or
  // 0 if it never has been.
  int64 last_seen_unix = 5;

  // When this peer's node key expires (unix seconds), or 0 if it does not
  // expire.
  int64 key_expiry_unix = 6;
}

// Answer to a ListVpnPeersRequest.
message ListVpnPeersResponse {
  // One entry per registered peer, in the order the coordination server
  // reports them.  Empty if none are registered.
  repeated VpnPeerStatus peers = 1;
}

// Remove a node's VPN registration, revoking its tunnel reachability without
// touching its mesh membership.  Served only by a provider node with VPN
// integration configured; answered with an Empty response on success.
//
// Mesh revocation (RevokeNodeRequest) already performs this as part of removing
// a node, so this exists for the case where that half failed: it is the retry,
// and it is idempotent — a MAC with no VPN registration is a success, not an
// error, so a retry after a partial failure always converges.
message RevokeVpnPeerRequest {
  // The MAC of the node whose VPN registration to remove, as raw bytes.
  bytes node_mac = 1;
}

// Top-level request envelope.  Exactly one variant must be set; an empty
// request (no variant) is treated as a protocol error and returns an
// ErrorResponse.
message WayfinderRequest {
  // The specific query to execute against the local router.
  oneof request {
    // Query basic identity and capacity information for this node.
    GetNodeInfoRequest get_node_info = 1;

    // Query the full BATMAN originator (routing) table.
    GetRoutingTableRequest get_routing_table = 2;

    // Query the per-(neighbor, interface) link-quality table.
    GetLinkQualityTableRequest get_link_quality_table = 3;

    // Ask the router how it would route a packet to a given destination.
    ResolveRouteRequest resolve_route = 4;

    // Query the current per-interface adaptive OGM emission schedule.
    GetOgmScheduleRequest get_ogm_schedule = 5;

    // Query the current per-interface throughput estimates.
    GetThroughputRequest get_throughput = 6;

    // Query the node's aggregate health and topology metrics.
    GetMetricsRequest get_metrics = 7;

    // Set Authentication configuration
    SetAuthRequest set_auth = 8;

    // Fetch the mesh trust anchor (provider mode).
    GetTrustAnchorRequest get_trust_anchor = 9;

    // Submit a certificate-signing request (provider mode).
    SubmitCsrRequest submit_csr = 10;

    // Revoke a node from the mesh (provider mode).
    RevokeNodeRequest revoke_node = 11;

    // Query the mesh authentication / security posture (field 12 is reserved for
    // ListCertsRequest on the provider branch, so this takes 13).
    GetSecurityStatusRequest get_security_status = 12;

    // List the certificates this provider has issued (provider mode).
    ListCertsRequest list_certs = 13;

    // List the CSRs awaiting operator approval (provider mode).
    ListPendingCsrsRequest list_pending_csrs = 14;

    // Approve a pending CSR (provider mode).
    ApproveCsrRequest approve_csr = 15;

    // Deny a pending CSR (provider mode).
    DenyCsrRequest deny_csr = 16;

    // Apply a partial update to the node's runtime configuration.
    SetConfigRequest set_config = 17;

    // Query the per-neighbor keep-alive heartbeat liveness table.
    GetKeepAliveTableRequest get_keepalive_table = 18;

    // Authenticate this management connection (must be the first message on a
    // connection, before any other request). Carries the client's membership
    // certificate; the transport binds it to the TLS-authenticated raw public
    // key and admits the connection only if it verifies as a non-revoked admin
    // (or, on an un-enrolled node, matches the node's own bootstrap key).
    AuthenticateRequest authenticate = 19;

    // Query the per-interface participation-feature state.
    GetLinkFeaturesTableRequest get_link_features_table = 20;

    // Read recent log records from the node's in-memory ring.
    GetLogsRequest get_logs = 21;

    // Change which log records the node emits, at runtime.
    SetLogLevelRequest set_log_level = 22;

    // Read the shared enrollment token in force (provider mode).
    RevealEnrollmentTokenRequest reveal_enrollment_token = 23;

    // Exchange user credentials for a short-lived management certificate
    // (provider mode).  On the enrollment tier, which is what admits a client
    // holding no credential at all — which is precisely what someone who has
    // not logged in yet is.
    AuthenticateUserRequest authenticate_user = 24;

    // List the certificate authority's user accounts (provider mode).  Requires
    // a full management grant: this is the roster of who can mint a certificate
    // the whole mesh honours.
    ListUsersRequest list_users = 25;

    // Create a user account (provider mode).  Requires a full management grant.
    CreateUserRequest create_user = 26;

    // Remove a user account (provider mode).  Requires a full management grant.
    RemoveUserRequest remove_user = 27;

    // Obtain this device's VPN join credential (provider mode).  Requires the
    // member tier — an enrolled device's own certificate — and is the one
    // request a full management grant may *not* invoke, because the response is
    // scoped to the calling device's identity.
    GetVpnEnrollmentRequest get_vpn_enrollment = 28;

    // List the registered VPN peers (provider mode).  Requires a full
    // management grant.
    ListVpnPeersRequest list_vpn_peers = 29;

    // Remove a node's VPN registration (provider mode).  Requires a full
    // management grant.
    RevokeVpnPeerRequest revoke_vpn_peer = 30;

    // Read the node's alarm board: the conditions it currently believes are
    // wrong.
    GetAlarmsRequest get_alarms = 31;
  }
}

// ── Responses ─────────────────────────────────────────────────────────────────

// Basic identity and capacity information for the local router node.
message NodeInfo {
  // Raw bytes of this node's mesh identifier.
  // Length is address-family dependent (6 bytes for MAC, 1 byte for u8 short
  // address).  Display as colon-delimited hex for MAC addresses.
  bytes node_id = 1;

  // Number of entries currently in the BATMAN originator table, i.e. the
  // number of remote nodes this router has a path to.
  uint32 num_originators = 2;

  // Whether this node is required to authenticate but has no membership
  // cert installed yet. While true, the node is inert on the mesh (no
  // routing, no OGM emission) until provisioned with a cert over the
  // management API.
  bool auth_locked = 3;

  // Whether this node currently has a runtime configuration override applied
  // via SetConfig, as opposed to running purely off its startup
  // configuration. Overrides are in-memory only and do not survive a
  // restart.
  bool runtime_config_active = 4;
}

// Per-neighbor path metrics for a single path to an originator.
// The BATMAN engine tracks up to 4 alternate paths per destination; each is
// represented here.
message NeighborPath {
  // Raw bytes of the immediate neighbor (next-hop) through which this path
  // was learned.  Same encoding as NodeInfo.node_id.
  bytes neighbor_id = 1;

  // Transmission Quality (TQ) observed via this neighbor.  Range 0–255;
  // higher is better.  Decremented by 10 per hop as OGMs propagate.
  uint32 tq = 2;

  // Sequence number of the most recent OGM received via this neighbor.
  // Monotonically increasing; wraps at u32::MAX.
  uint32 last_seqno = 3;

  // Whether this neighbor currently holds a valid next-hop proof — it has
  // answered a challenge with the pairwise key for the address it claims,
  // recently enough that the proof has not lapsed.
  //
  // Only a proven path can be selected as next_hop; an unproven one is
  // reported here so an operator can see a candidate being challenged rather
  // than a silent gap.  Always true on an unauthenticated mesh, which has no
  // pairwise keys and so requires no proof.
  bool proven = 4;
}

// A single entry in the BATMAN originator table, describing how to reach one
// remote destination node.
message RoutingEntry {
  // Raw bytes of the ultimate destination node identifier.
  bytes destination = 1;

  // Raw bytes of the immediate next-hop neighbor to use for the best-known
  // path to destination.
  //
  // Empty when no path is currently usable — including when every known path
  // is via a neighbor that has not proven itself.  A destination with paths
  // but no next_hop is one still being challenged, not one that is
  // unreachable; see NeighborPath.proven.
  bytes next_hop = 2;

  // Transmission Quality of the currently selected path -- the best among
  // *selectable* paths, not across all known ones. Range 0–255; higher is
  // better. Zero when no path is selectable, including while every path's
  // neighbor is still unproven, so a tq of 0 alongside populated paths means
  // "still being challenged", not "dead link"; see NeighborPath.proven.
  uint32 tq = 3;

  // Sequence number of the most recent OGM received from this originator
  // (across all paths).
  uint32 last_seqno = 4;

  // Per-neighbor path breakdown.  Contains one entry for each neighbor
  // through which OGMs from this originator have been received, up to the
  // engine's path limit (currently 4).
  repeated NeighborPath paths = 5;
}

// Snapshot of the full BATMAN originator table at the time of the request.
message RoutingTable {
  // All known originators.  Empty if the router has not yet received any OGMs
  // (e.g. immediately after startup).
  repeated RoutingEntry entries = 1;
}

// A single row in the per-(neighbor, interface) link-quality table.  The
// router folds every received frame's physical-layer metrics into an
// exponentially-weighted moving average keyed on (neighbor, iface_idx)
// and uses that to bias the egress-interface decision toward the
// strongest radio path for each neighbor.
message LinkQualityEntry {
  // Raw bytes of the neighbor this row describes.  Same encoding as
  // NodeInfo.node_id.
  bytes neighbor_id = 1;

  // Index of the physical interface on which `neighbor_id` was observed.
  // Indices are assigned in the order interfaces are registered with the
  // CentralRouter and are stable for the lifetime of the process.
  uint32 iface_idx = 2;

  // EWMA-smoothed normalized quality on the 0–255 scale (matching
  // BATMAN's TQ convention).  Higher is better.
  //
  // Absent when this link has never carried a physical-layer measurement,
  // which is the case for every frame on a metric-less transport (raw L2,
  // UDP, Unix): there is no signal to measure, as opposed to a bad one.
  // Absent is NOT zero — a wired neighbor is typically an excellent link —
  // so a consumer must render it as unknown (`—`, `n/a`) and must never
  // substitute 0 or display it as 0%.
  optional uint32 ewma_quality = 3;

  // Number of frames received on this (neighbor, interface) pair, counting
  // those that carried no measurement.  Saturates at u32::MAX.  Useful for
  // callers that want to weight or filter entries by how much evidence backs
  // the row.  Note this counts received frames, not EWMA samples: it can be
  // non-zero while `ewma_quality` is absent.
  uint32 sample_count = 4;

  // Human-readable name of the interface `iface_idx` refers to, as configured
  // on the node (`udp0`, `lora-roof`).  Display metadata only — nothing routes
  // on it.  Empty when the interface was never named, in which case a consumer
  // shows `iface_idx` instead.
  string iface_name = 5;
}

// Snapshot of the full link-quality table at the time of the request.
message LinkQualityTable {
  // All known (neighbor, interface) pairs.  Empty if the router has not yet
  // received any frames.  A pair whose link exposes no physical-layer metrics
  // still appears here, with `ewma_quality` absent — being heard on an
  // interface is itself worth reporting.
  repeated LinkQualityEntry entries = 1;
}

// A single mesh interface's live participation-feature state — the read
// counterpart to the LinkFeatures SetConfig message.  All four gates default
// to true (full participation) for an interface that has never had features
// overridden.
message LinkFeaturesEntry {
  // Index of the interface this row describes, in registration order (same
  // indexing as LinkQualityEntry.iface_idx).
  uint32 iface_idx = 1;

  // Whether this link currently sends OGMs (its own, and re-flooded ones).
  bool tx_ogm = 2;

  // Whether this link currently accepts and learns from inbound OGMs.
  bool rx_ogm = 3;

  // Whether this link currently sends data-plane traffic (unicast,
  // multicast, and broadcast).
  bool tx_data = 4;

  // Whether this link currently accepts inbound data-plane traffic.
  bool rx_data = 5;

  // The armed keep-alive cadence in milliseconds, if this link is currently
  // sending heartbeats.  Absent when keep-alive transmission is disabled.
  optional uint64 tx_keepalive_interval_ms = 6;

  // Human-readable name of this interface, as configured on the node.  Same
  // encoding and empty-means-unnamed contract as LinkQualityEntry.iface_name.
  string iface_name = 7;
}

// Snapshot of the per-interface participation-feature state at the time of
// the request.
message LinkFeaturesTable {
  // One entry per configured mesh interface, in registration order.  Empty
  // if no interface has been configured yet.
  repeated LinkFeaturesEntry entries = 1;
}

// A single row in the per-neighbor keep-alive heartbeat liveness table,
// evaluated as of the moment of the request.
message KeepAliveEntry {
  // Raw bytes of the neighbor this row describes.  Same encoding as
  // NodeInfo.node_id.
  bytes neighbor_id = 1;

  // Milliseconds elapsed since this neighbor's last heard heartbeat.
  uint64 ms_since_last_heard = 2;

  // The learned heartbeat cadence, in milliseconds.  Zero until a second
  // heartbeat has provided a real gap to measure.
  uint64 interval_estimate_ms = 3;

  // Whether this neighbor has missed its keep-alive budget: its heartbeat
  // has not been refreshed within the miss-budget multiple of its learned
  // (or seeded) cadence.  This is the signal the router uses to deprioritize
  // — not evict — a route relayed through this neighbor.
  bool missed = 4;
}

// Snapshot of the full keep-alive liveness table at the time of the request.
message KeepAliveTable {
  // One entry per neighbor this node has heard at least one heartbeat from.
  // Empty if none has (yet), which is indistinguishable here from no
  // neighbor running keep-alives at all — the opt-in-by-observation
  // contract described on GetKeepAliveTableRequest.
  repeated KeepAliveEntry entries = 1;
}

// The adaptive OGM emission schedule for a single mesh interface.  OGM
// emission is paced per interface by a Trickle timer: the interval doubles
// toward max_interval_ms while the local view of the topology is stable, and
// snaps back to min_interval_ms the instant an inconsistency is detected, so
// the mesh is near-silent at rest yet reconverges quickly on change.
message OgmScheduleEntry {
  // Index of the interface this schedule describes.  Indices are assigned in
  // the order interfaces are registered with the CentralRouter and match the
  // iface_idx used in LinkQualityEntry.
  uint32 iface_idx = 1;

  // The interval the interface is *currently* emitting OGMs at, in
  // milliseconds: the live publish period.  Observe it grow on successive
  // queries while the mesh is stable, and collapse back to min_interval_ms
  // after a topology change.
  uint32 current_interval_ms = 2;

  // The most aggressive (shortest) interval the timer resets to on a topology
  // change, in milliseconds.  The configured backoff floor.
  uint32 min_interval_ms = 3;

  // The quietest (longest) interval the doubling backoff is capped at, in
  // milliseconds.  The configured backoff ceiling.
  uint32 max_interval_ms = 4;

  // Human-readable name of this interface, as configured on the node.  Same
  // encoding and empty-means-unnamed contract as LinkQualityEntry.iface_name.
  string iface_name = 5;
}

// Snapshot of the per-interface adaptive OGM emission schedule at the time of
// the request.
message OgmSchedule {
  // One entry per configured mesh interface, in registration order.  Empty if
  // no interface has been configured for OGM emission yet.
  repeated OgmScheduleEntry entries = 1;
}

// Smoothed throughput for a single mesh interface, in both directions.  The
// rates are exponentially-weighted moving averages evaluated at the instant of
// the request — bytes and frames per second flowing in and out — rather than
// cumulative counters, so they stay bounded for an arbitrarily long-lived node
// and decay back toward zero when an interface goes quiet.
message InterfaceThroughput {
  // Index of the interface these rates describe, in registration order.
  // Matches the iface_idx used in LinkQualityEntry and OgmScheduleEntry.
  uint32 iface_idx = 1;

  // Smoothed receive rate in bytes per second (whole link frames, header
  // included).
  double rx_bps = 2;

  // Smoothed receive rate in link frames per second.
  double rx_fps = 3;

  // Smoothed transmit rate in bytes per second (whole link frames, header
  // included).
  double tx_bps = 4;

  // Smoothed transmit rate in link frames per second.
  double tx_fps = 5;

  // Human-readable name of this interface, as configured on the node.  Same
  // encoding and empty-means-unnamed contract as LinkQualityEntry.iface_name.
  string iface_name = 6;
}

// Snapshot of per-interface throughput plus the node-wide totals at the time of
// the request.  The totals are the sum of the per-interface rates and are
// provided so a caller need not re-derive them.
message Throughput {
  // One entry per interface the router is tracking, in registration order.
  // Empty if no interface has been configured or carried traffic yet.
  repeated InterfaceThroughput interfaces = 1;

  // Node-wide smoothed receive rate in bytes per second (sum across interfaces).
  double total_rx_bps = 2;

  // Node-wide smoothed receive rate in link frames per second.
  double total_rx_fps = 3;

  // Node-wide smoothed transmit rate in bytes per second (sum across
  // interfaces).
  double total_tx_bps = 4;

  // Node-wide smoothed transmit rate in link frames per second.
  double total_tx_fps = 5;
}

// Current-vs-maximum occupancy of one of the router's fixed-capacity tables.
// These tables are sized at compile time for embedded targets, so an operator
// (or an application sizing its own behaviour to the mesh) needs to see how
// close each is to saturation: a table at capacity silently evicts or drops.
message TableOccupancy {
  // Number of entries currently held.
  uint32 used = 1;

  // Maximum number of entries the table can hold before eviction/drop.
  uint32 capacity = 2;
}

// Aggregate health and topology metrics for the local node, derived from the
// router's live state at the time of the request.  Exposed so an application
// on top of the mesh can infer conditions it cannot otherwise observe — how
// large and how stable the surrounding mesh is, and how close the node is to
// its capacity limits.
message NodeMetrics {
  // Seconds the router has been running (its monotonic clock at request time).
  uint64 uptime_secs = 1;

  // Number of distinct directly-reachable (one-hop) neighbours: originators the
  // node routes to via the originator itself.
  uint32 neighbor_count = 2;

  // Occupancy of the originator (routing) table.
  TableOccupancy originators = 3;

  // Occupancy of the broadcast-deduplication table (per-originator highest
  // broadcast sequence number).
  TableOccupancy broadcast_dedup = 4;

  // Occupancy of the locally-joined multicast group table (groups announced in
  // this node's OGMs).
  TableOccupancy local_mcast_groups = 5;

  // Occupancy of the learned multicast-membership table (group → remote
  // listener pairs learned from other nodes' OGMs).
  TableOccupancy mcast_memberships = 6;

  // Lowest best-path transmission quality (0–255) across all originators, or 0
  // when no originators are known.
  uint32 tq_min = 7;

  // Highest best-path transmission quality (0–255) across all originators, or 0
  // when no originators are known.
  uint32 tq_max = 8;

  // Mean best-path transmission quality (0–255) across all originators, or 0
  // when no originators are known.
  double tq_mean = 9;

  // Largest number of alternate paths held for any single originator (0–4).
  uint32 paths_max = 10;

  // Mean number of alternate paths per originator, a path-diversity / route-
  // resilience gauge; 0 when no originators are known.
  double paths_mean = 11;

  // Count of locally originated host frames dropped because they did not fit the
  // transmit buffer once wrapped in mesh encapsulation — i.e. the host offered a
  // frame larger than the mesh can carry (a TAP MTU set too high for the links).
  // A non-zero, growing value signals a misconfigured MTU.
  uint32 oversize_drops = 12;

  // Count of relayed frames (OGM re-floods, or relayed unicast/multicast/
  // broadcast traffic) dropped because they did not fit the buffer for the
  // outbound link — i.e. this node received a frame on one link whose MTU is
  // larger than another of its links. Distinct from oversize_drops, which
  // only counts locally originated frames; a non-zero, growing value signals
  // an MTU mismatch between two of this node's links.
  uint32 relay_oversize_drops = 13;

  // Occupancy of the verified-neighbor cert cache: other members' certs this
  // node currently holds, resolved either from a full Cert TVLV or fetched
  // on demand under lazy cert distribution. Zero (0/0) when auth is disabled.
  TableOccupancy cert_store = 14;

  // Occupancy of the requester-side in-flight lazy-cert-fetch table:
  // outstanding CertReq fetches this node has sent but not yet resolved.
  // Zero (0/0) when auth is disabled.
  TableOccupancy in_flight_cert_requests = 15;

  // Occupancy of the responder-side parked-reply table: verified CertReq
  // requesters this node has no route to yet, awaiting the opportunistic
  // flush once one appears. Zero (0/0) when auth is disabled.
  TableOccupancy pending_cert_replies = 16;

  // Smoothed rate (frames/sec) at which this node sends CertReq — a rising
  // rate signals growing cert-cache churn or a misresolving fingerprint.
  // Zero when auth is disabled.
  double cert_req_rate = 17;

  // Smoothed rate (frames/sec) at which this node sends CertReply, answering
  // CertReqs as the requested originator. Zero when auth is disabled.
  double cert_reply_rate = 18;

  // Smoothed rate (frames/sec) at which this node drops a directed frame
  // because it holds no pairwise key for the chosen next hop, so the frame
  // could neither be authenticated nor sent in the clear.
  //
  // A security-relevant drop, and one an application on top of the mesh
  // otherwise cannot see: to the sender the route looked fine and the traffic
  // simply vanished. Sustained non-zero means traffic is being aimed at a next
  // hop this node cannot authenticate to — a peer whose certificate lapsed, or
  // an outsider that got itself into the path. Zero when auth is disabled.
  double untaggable_drop_rate = 19;
}

// Marker payload indicating the router would flood a packet out of every
// interface (the egress decision used for broadcasts and for
// destinations with no metric information).
message AllInterfacesEgress {}

// Answer to a ResolveRouteRequest: the next-hop neighbor and the egress
// interface the router would select for the requested destination right
// now.  The values reflect the in-memory routing and link-quality state
// at the time of the request and may change as new OGMs and frames are
// received.
message ResolveRouteResponse {
  // Immediate next-hop neighbor that would receive the packet.  Mirrors
  // the `lookup_route(dest).unwrap_or(dest)` fallback inside
  // CentralRouter::handle_local — when no BATMAN route is known this is
  // the original destination, since the router will try to reach it
  // directly.
  bytes next_hop = 1;

  // The egress interface the router would pick.  Unset when no link
  // quality or last-seen interface data exists yet for this destination
  // — the router would have nothing to send on in that state.
  oneof egress {
    // Flood out every interface — used for broadcast destinations.
    AllInterfacesEgress all_interfaces = 2;

    // Send out a specific physical interface, indexed in registration
    // order on the CentralRouter.
    uint32 interface_index = 3;
  }
}

// Returned when the router cannot fulfill a request.
message ErrorResponse {
  // Human-readable description of what went wrong.
  string message = 1;
}

// Answer to a GetTrustAnchorRequest: the mesh trust anchor.
message GetTrustAnchorResponse {
  // The mesh trust anchor as raw `TrustAnchor` bytes (mesh id + root public
  // key).  Distribute to members so they can verify certificates.
  bytes trust_anchor = 1;
}

// Answer to a SubmitCsrRequest.  A CSR is in exactly one of three states, so the
// response is a sum type: a caller can never observe a contradictory combination
// (e.g. "pending" together with an issued certificate).
message SubmitCsrResponse {
  // The CSR's disposition.  Exactly one variant is set.
  oneof outcome {
    // The certificate was issued and is ready to use.
    CsrIssued issued = 1;

    // The CSR was accepted and is awaiting operator approval.  The client
    // should poll SubmitCsr again (with the same request) until it resolves to
    // issued or rejected.
    CsrPending pending = 2;

    // The CSR was rejected and will not be issued (a bad enrollment token, or an
    // operator denied it).  The client should stop polling.
    CsrRejected rejected = 3;
  }
}

// Exchange a username, password and TOTP code for a short-lived management
// certificate bound to a keypair the client generated for this session.
//
// The credentials are verified at the certificate authority, never at a node:
// a password verifier worth having is memory-hard, a password would be the
// only fleet-wide bearer secret in this system, and it would have to be
// replicated to every node.  What comes back is an ordinary membership
// certificate, so every node authorizes its holder through the unchanged
// certificate path and no node ever learns what a password is.
message AuthenticateUserRequest {
  // The account name, as created by `wayfinderctl user add`.
  string username = 1;

  // The account password.  Never logged and never persisted — the authority
  // stores only an Argon2id hash of it.
  string password = 2;

  // The current TOTP code, or empty for an account explicitly created without
  // a second factor.  A code is accepted once: presenting the same one again
  // inside its own validity window is refused.
  string totp_code = 3;

  // The Ed25519 public key of the session keypair the client generated, which
  // the issued certificate is bound to.  32 bytes.  The client holds the
  // private half, so a captured transcript of this exchange is useless without
  // it.
  bytes ed_pubkey = 4;

  // The X25519 public key of the same session keypair, for pairwise key
  // agreement.  32 bytes.
  bytes x_pubkey = 5;
}

// List the certificate authority's user accounts (provider mode).
//
// Administered offline by `wayfinderctl user` as well, and that tool remains
// the only way to create the *first* account: creating one over this API needs
// the credential it creates.
message ListUsersRequest {}

// Answer to a ListUsersRequest: the accounts this authority holds.
message ListUsersResponse {
  // One entry per account, in the order the authority stores them.
  repeated UserAccount users = 1;
}

// One user account, as the management API reports it.
//
// Never the password hash and never the TOTP secret.  Neither is recoverable
// from the authority at all — the hash by construction, the secret because it
// is shown once, when the account is created, and never again.
message UserAccount {
  // The account name presented at sign-in.
  string username = 1;

  // Whether this account's session certificates carry the
  // management-administration capability.  False means read-only: the account
  // may read the management API and change nothing.
  bool admin = 2;

  // How long a session certificate issued to this account stays valid, in
  // seconds.  Per account rather than per authority: an automation account may
  // be worth minutes and a field operator a shift.
  uint64 session_ttl_secs = 3;

  // Whether a second factor is enrolled.  An account without one has a password
  // as its whole credential.
  bool totp_enrolled = 4;

  // Whether the account is disabled: it can obtain no new sessions, while
  // certificates already issued to it are unaffected until they expire or are
  // revoked.
  bool disabled = 5;

  // Whether the account is currently locked out after consecutive failed
  // sign-ins.  Temporary, and clears on its own.
  bool locked = 6;
}

// Create a user account (provider mode).
//
// Requires a full management grant, and note what that means: an admin session
// can mint another account, so this endpoint makes the user store remotely
// mutable by anyone holding one.  That is a deliberate widening — an admin can
// already revoke nodes and rewrite the enrollment policy — but it is a widening,
// and `wayfinderctl user` on the provider host remains the path that needs no
// network at all.
message CreateUserRequest {
  // The account name, unique within this authority.  A name already in use is
  // an error rather than a silent replacement.
  string username = 1;

  // The initial password.  Never logged and never persisted: the authority
  // stores only an Argon2id hash of it.  It does travel this channel, which is
  // authenticated TLS and admits only a full management grant.
  string password = 2;

  // Grant the management-administration capability to the certificates this
  // account is issued.  False creates a read-only (viewer) account.
  bool admin = 3;

  // Validity window for this account's session certificates, in seconds.  Zero
  // takes the authority's default of eight hours, and any value is still bound
  // by the provider's own certificate-lifetime cap.
  uint64 session_ttl_secs = 4;

  // Create the account with no second factor.
  //
  // Any account here can mint a certificate the whole mesh honours, so a
  // password alone makes fleet-wide administrative access a phishable secret.
  // For an automation account that cannot present a code — which should
  // generally hold a long-lived certificate issued offline instead.
  bool no_totp = 5;
}

// Answer to a CreateUserRequest.
message CreateUserResponse {
  // The `otpauth://` enrolment URI for the account's new second factor, or
  // empty when it was created without one.
  //
  // Shown once.  The authority does not serve it again and the secret cannot be
  // recovered from it, so an account whose URI was lost is one whose password
  // must be reset.
  string totp_enrolment_uri = 1;
}

// Remove a user account (provider mode).
//
// Ends the account's ability to obtain *new* sessions.  A certificate already
// issued to it is unaffected — that is what `RevokeNode` and expiry are for —
// so removing a compromised account is two acts, not one.
//
// Answered with the empty response on success.  The authority refuses to remove
// the last account that can still administer the mesh: `CreateUserRequest` and
// this one both need a full management grant, so an authority left with no
// enabled administrator has a user store that can no longer be changed over
// this API in either direction, recoverable only with `wayfinderctl user add`
// on the provider host.
message RemoveUserRequest {
  // The account to remove.  A name that is not on file is an error rather than
  // a silent success: whoever sent it has a wrong idea about the roster.
  string username = 1;
}

// The result of an AuthenticateUserRequest.
message AuthenticateUserResponse {
  // The outcome.  Exactly one variant is set.
  oneof outcome {
    // The credentials verified; the session certificate is ready to use.
    UserSessionIssued issued = 1;

    // The credentials did not verify.  One variant covering unknown account,
    // wrong password, wrong code, locked and disabled: distinguishing them
    // would make this endpoint a user-enumeration oracle reachable by anyone
    // who can route to the provider.
    UserSessionRejected rejected = 2;
  }
}

// A successfully issued session certificate.
message UserSessionIssued {
  // The issued membership certificate as raw `MembershipCert` bytes, carrying
  // CERT_FLAG_USER plus the account's capability (admin or viewer) and bound
  // to the session keys named in the request.
  bytes cert = 1;

  // The mesh trust anchor as raw `TrustAnchor` bytes, so the client can verify
  // what it was just handed without fetching it separately.
  bytes trust_anchor = 2;
}

// A refused login.  Deliberately carries no reason: any detail here would be
// the enumeration oracle the outcome oneof's own comment describes.
message UserSessionRejected {
  // Human-readable text, identical for every failure reason.  Present so a
  // client has something to print, not so it has something to branch on.
  string message = 1;
}

// A successfully issued certificate: the signed cert plus the trust anchor it
// chains to, so the enrolling node has everything it needs to enable auth.
message CsrIssued {
  // The issued membership certificate as raw `MembershipCert` bytes, signed by
  // the mesh root and bound to the requested MAC and public keys.
  bytes cert = 1;

  // The mesh trust anchor as raw `TrustAnchor` bytes, for convenience so the
  // node need not fetch it separately.
  bytes trust_anchor = 2;
}

// A CSR that has been accepted and is waiting for an operator to approve or deny
// it.  Carries no fields — its presence is the signal to keep polling.
message CsrPending {}

// A CSR that was rejected and will not be issued.
message CsrRejected {
  // Human-readable reason (e.g. "invalid or missing enrollment token" or
  // "denied by operator"), for the enrolling node to surface to its operator.
  string reason = 1;
}

// One certificate this provider has issued, summarised for the operator.
message IssuedCert {
  // The node MAC the certificate is bound to, as raw bytes.
  bytes node_mac = 1;

  // The node's Ed25519 identity public key (32 bytes).
  bytes ed_pubkey = 2;

  // Validity-window start (unix seconds).
  uint64 not_before = 3;

  // Validity-window end (unix seconds).
  uint64 not_after = 4;

  // Whether this provider has since revoked the node.  The entry is retained
  // (rather than removed) so the operator can see the revocation; the node's
  // frames are dropped mesh-wide and its cert will also passively expire.
  bool revoked = 5;

  // Whether this is a person's session certificate (CERT_FLAG_USER) rather
  // than a device's membership certificate.  Both bind to a MAC, so without
  // this an operator reading the list has no way to tell one from the other —
  // which is the whole reason the flag exists.
  bool user = 6;

  // Whether the certificate carries the management-administration capability
  // (CERT_FLAG_ADMIN).
  bool admin = 7;

  // Whether the certificate carries the read-only management capability
  // (CERT_FLAG_VIEWER).  Never set alongside admin, which subsumes it.
  bool viewer = 8;
}

// Answer to a ListCertsRequest: the certificates this provider has issued.
message ListCertsResponse {
  // One entry per distinct issued MAC, in first-issuance order (a re-issue
  // updates the existing entry in place).  Empty if the provider has issued none
  // (or was restarted — the list is in-memory).
  repeated IssuedCert certs = 1;
}

// One CSR awaiting operator approval, summarised for the operator.
message PendingCsr {
  // The enrolling node's MAC the certificate would be bound to, as raw bytes.
  bytes node_mac = 1;

  // The node's Ed25519 identity public key (32 bytes) — its future OGM-signing
  // identity, shown so the operator can vet what they are approving.
  bytes ed_pubkey = 2;

  // The node's X25519 public key (32 bytes) — used to derive pairwise
  // data-plane keys.
  bytes x_pubkey = 3;

  // When the provider first saw this CSR (unix seconds), so an operator can age
  // out stale requests.
  uint64 requested_at = 4;
}

// Answer to a ListPendingCsrsRequest: the CSRs awaiting operator approval.
message ListPendingCsrsResponse {
  // One entry per pending CSR, in first-seen order.  Empty if none are waiting.
  repeated PendingCsr pending = 1;
}

// Top-level response envelope.  Always contains exactly one variant.
message WayfinderResponse {
  // The result of the corresponding WayfinderRequest.
  oneof response {
    // No response
    Empty empty = 9;

    // Response to GetNodeInfoRequest.
    NodeInfo node_info = 1;

    // Response to GetRoutingTableRequest.
    RoutingTable routing_table = 2;

    // Returned for malformed or unrecognised requests.
    ErrorResponse error = 3;

    // Response to GetLinkQualityTableRequest.
    LinkQualityTable link_quality_table = 4;

    // Response to ResolveRouteRequest.
    ResolveRouteResponse resolve_route = 5;

    // Response to GetOgmScheduleRequest.
    OgmSchedule ogm_schedule = 6;

    // Response to GetThroughputRequest.
    Throughput throughput = 7;

    // Response to GetMetricsRequest.
    NodeMetrics metrics = 8;

    // Response to GetTrustAnchorRequest.
    GetTrustAnchorResponse trust_anchor = 10;

    // Response to SubmitCsrRequest.
    SubmitCsrResponse submit_csr = 11;

    // Response to GetSecurityStatusRequest (field 12 is reserved for
    // ListCertsResponse on the provider branch, so this takes 13).
    GetSecurityStatusResponse security_status = 12;

    // Response to ListCertsRequest.
    ListCertsResponse list_certs = 13;

    // Response to ListPendingCsrsRequest.  (ApproveCsr and DenyCsr answer with
    // the Empty response above.)
    ListPendingCsrsResponse list_pending_csrs = 14;

    // Response to GetKeepAliveTableRequest.
    KeepAliveTable keepalive_table = 15;

    // Response to GetLinkFeaturesTableRequest.
    LinkFeaturesTable link_features_table = 16;

    // Response to GetLogsRequest.
    LogRecords logs = 17;

    // Response to SetLogLevelRequest.
    LogFilter log_filter = 18;

    // Response to RevealEnrollmentTokenRequest.
    RevealEnrollmentTokenResponse enrollment_token = 19;

    // Response to AuthenticateUserRequest.
    AuthenticateUserResponse authenticate_user = 20;

    // Response to ListUsersRequest.
    ListUsersResponse list_users = 21;

    // Response to CreateUserRequest.
    CreateUserResponse create_user = 22;

    // Response to GetVpnEnrollmentRequest.
    GetVpnEnrollmentResponse vpn_enrollment = 23;

    // Response to ListVpnPeersRequest.  (RevokeVpnPeer answers with the Empty
    // response above.)
    ListVpnPeersResponse list_vpn_peers = 24;

    // Response to GetAlarmsRequest: the node's whole alarm board.
    Alarms alarms = 25;
  }
}
