[package]
name = "wayfinder-server"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = ["std"]
# Enables the tokio-net transport listeners and the query channel that bridges
# them to a single-threaded router loop. Without it the crate is `no_std` +
# `alloc` and exposes only the `RouterAdapter` data-provider adapter.
std = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures",
    "dep:bytes",
    "dep:anyhow",
    "dep:serde",
    "dep:serde_json",
    "prost/std",
    "wayfinder-auth/std",
    "wayfinder-storage/std",
]

[dependencies]
wayfinder.workspace = true
wayfinder-protos.workspace = true
# Direct dep so the std `CertAuthority` (provider mode) can use the std-gated
# `Authority`; embedded/no_std builds leave the std feature off and pull none of
# it in.
wayfinder-auth.workspace = true
# CA-state snapshot persistence (persistence.rs) is built atop the shared
# DurableStore abstraction; only the std-gated FileStore is used here.
wayfinder-storage.workspace = true
zerocopy.workspace = true
tracing.workspace = true
prost = { version = "0.13", default-features = false }

tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
anyhow = { workspace = true, optional = true }
# CA-state snapshot persistence (authority.rs), std-only.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
