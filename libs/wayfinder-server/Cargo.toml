[package]
name = "wayfinder-server"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = ["std"]
# Enables the tokio-net transport listeners and the query channel that bridges
# them to a single-threaded router loop. Without it the crate is `no_std` +
# `alloc` and exposes only the `RouterAdapter` data-provider adapter.
std = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:wayfinder-tls-mgmt",
    "dep:futures",
    "dep:bytes",
    "dep:anyhow",
    "dep:serde",
    "dep:serde_json",
    "prost/std",
    "tracing/std",
    "wayfinder-auth/std",
    "dep:wayfinder-storage",
    "wayfinder-storage/std",
]
# The `no_std` + `alloc` embedded management transport: length-delimited request
# framing over an `embedded-io-async` byte stream (`framing`) and the
# `embassy-sync` query channel + `serve` loop that bridge that stream to the
# router loop on bare metal. The `no_std` counterpart to `std`'s tokio
# listeners; mutually exclusive with `std` in practice (a target picks one).
embedded = ["dep:embedded-io-async", "dep:embassy-sync"]

[dependencies]
wayfinder.workspace = true
wayfinder-protos.workspace = true
# Direct dep so the std `CertAuthority` (provider mode) can use the std-gated
# `Authority`; embedded/no_std builds leave the std feature off and pull none of
# it in.
wayfinder-auth.workspace = true
# CA-state snapshot persistence (persistence.rs) is built atop the shared
# DurableStore abstraction; only the std-gated FileStore is used here, so this
# is optional and pulled in only by the `std` feature — the embedded build never
# links it (and so never pulls its std `tracing`).
wayfinder-storage = { workspace = true, optional = true }
zerocopy.workspace = true
# Pinned directly (not workspace inheritance, which forces `default-features`
# on) so tracing's `std` feature stays off for the `no_std` embedded build — the
# same reason `wayfinder`/`wayfinder-driver-core` pin it.  Re-enabled via
# `tracing/std` under the `std` feature.
tracing = { version = "0.1.44", default-features = false }
prost = { version = "0.13", default-features = false }

tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
# The Ed25519-identity <-> rustls-raw-public-key bridge shared with
# `wayfinder-client`; neither management-TLS crate depends on the other.
wayfinder-tls-mgmt = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
anyhow = { workspace = true, optional = true }
# CA-state snapshot persistence (authority.rs), std-only.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# The embedded management transport (`embedded` feature): the byte-stream I/O
# trait the framing reads/writes over, and the SPSC channel the `serve` loop
# uses to hand a decoded request to the router loop and await its response.
embedded-io-async = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
